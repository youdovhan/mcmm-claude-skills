<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCMM Ораторське · Подарунок класу</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");

      :root {
        --bg-cream: #f5f0e8;
        --ink-charcoal: #2a2a2a;
        --blood-wine: #7a2a2a;
        --blood-wine-dark: #5c1f1f;
        --sepia-gold: #8b6f47;
        --card-paper: #fbf7ee;
        --border-faint: #e0d8c8;
        --stage-dark: #1a1a1a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg-cream);
        color: var(--ink-charcoal);
        font-family: "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-cream);
        border-bottom: 1px solid var(--border-faint);
        padding: 16px 0;
      }

      .site-header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }

      .site-logo {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 18px;
        color: var(--blood-wine);
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      .site-logo small {
        display: block;
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 11px;
        color: var(--sepia-gold);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      .site-nav {
        display: flex;
        gap: 28px;
        align-items: center;
        flex-wrap: wrap;
      }

      .site-nav a {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 13px;
        color: var(--ink-charcoal);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        transition:
          border-color 0.2s,
          color 0.2s;
      }

      .site-nav a:hover,
      .site-nav a.active {
        color: var(--blood-wine);
        border-bottom-color: var(--blood-wine);
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Playfair Display", serif;
        color: var(--ink-charcoal);
        font-weight: 700;
        line-height: 1.2;
      }

      h1 {
        font-size: 56px;
        margin-bottom: 24px;
      }
      h2 {
        font-size: 36px;
        margin-bottom: 20px;
      }
      h3 {
        font-size: 26px;
        margin-bottom: 16px;
      }
      h4 {
        font-size: 20px;
        margin-bottom: 12px;
      }

      p {
        margin-bottom: 16px;
      }

      .hero {
        text-align: center;
        padding: 64px 0 48px;
        border-bottom: 1px solid var(--border-faint);
        margin-bottom: 64px;
      }

      .hero h1 {
        font-size: 64px;
        font-weight: 900;
        color: var(--blood-wine);
        margin-bottom: 32px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .hero-subtitle {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-style: italic;
        color: var(--ink-charcoal);
        margin-bottom: 20px;
        font-weight: 400;
      }

      .hero-dedication {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-style: italic;
        color: var(--sepia-gold);
        margin-bottom: 40px;
      }

      .hero-lead {
        max-width: 720px;
        margin: 0 auto 40px;
        font-size: 18px;
        line-height: 1.7;
        color: var(--ink-charcoal);
        text-align: left;
      }

      .hero-cta {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 40px;
      }

      .stats-bar {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--sepia-gold);
        letter-spacing: 0.05em;
        padding: 16px;
        border-top: 1px solid var(--border-faint);
        border-bottom: 1px solid var(--border-faint);
        max-width: 900px;
        margin: 0 auto;
      }

      .btn {
        display: inline-block;
        padding: 14px 28px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.1s;
      }

      .btn-primary {
        background: var(--blood-wine);
        color: var(--bg-cream);
      }

      .btn-primary:hover {
        background: var(--blood-wine-dark);
      }

      .btn-secondary {
        background: transparent;
        color: var(--blood-wine);
        border-color: var(--blood-wine);
      }

      .btn-secondary:hover {
        background: var(--blood-wine);
        color: var(--bg-cream);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .section-heading {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        color: var(--ink-charcoal);
        margin-bottom: 32px;
        text-align: center;
      }

      .section-heading::after {
        content: "";
        display: block;
        width: 80px;
        height: 2px;
        background: var(--blood-wine);
        margin: 16px auto 0;
      }

      .participants-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin-bottom: 64px;
      }

      .participant-card {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 28px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .participant-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(42, 42, 42, 0.1);
      }

      .participant-card.special {
        border: 2px solid var(--blood-wine);
        background: linear-gradient(180deg, var(--card-paper) 0%, #f5ede0 100%);
      }

      .participant-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--blood-wine);
        color: var(--bg-cream);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", serif;
        font-size: 26px;
        font-weight: 700;
      }

      .participant-card.special .participant-avatar {
        background: var(--sepia-gold);
      }

      .participant-name {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--ink-charcoal);
        margin: 0;
      }

      .participant-quote {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 15px;
        color: var(--ink-charcoal);
        line-height: 1.5;
        border-left: 2px solid var(--sepia-gold);
        padding-left: 12px;
      }

      .participant-tag {
        display: inline-block;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 4px 8px;
        background: var(--bg-cream);
        color: var(--sepia-gold);
        border: 1px solid var(--border-faint);
        border-radius: 2px;
        align-self: flex-start;
      }

      .participant-tag.full {
        color: var(--blood-wine);
        border-color: var(--blood-wine);
      }

      .participant-lessons {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--sepia-gold);
        letter-spacing: 0.05em;
      }

      .special-block {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-left: 4px solid var(--blood-wine);
        padding: 40px;
        margin-bottom: 32px;
        border-radius: 4px;
        cursor: pointer;
        transition: box-shadow 0.2s;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
      }

      .special-block:hover {
        box-shadow: 0 6px 18px rgba(122, 42, 42, 0.12);
      }

      .special-block h3 {
        color: var(--blood-wine);
        margin-bottom: 12px;
      }

      .special-block .pull-quote {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 20px;
        color: var(--ink-charcoal);
        margin-top: 16px;
      }

      .site-footer {
        border-top: 1px solid var(--border-faint);
        padding: 32px 24px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        color: var(--sepia-gold);
        line-height: 1.6;
        max-width: 720px;
        margin: 64px auto 0;
      }

      .focus-view {
        max-width: 880px;
        margin: 0 auto;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        color: var(--blood-wine);
        text-decoration: none;
        margin-bottom: 32px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .focus-hero {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 48px;
        margin-bottom: 32px;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
        text-align: center;
      }

      .focus-hero h1 {
        font-size: 48px;
        color: var(--blood-wine);
        margin-bottom: 16px;
      }

      .lesson-chip {
        display: inline-block;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px 14px;
        background: var(--bg-cream);
        color: var(--sepia-gold);
        border: 1px solid var(--border-faint);
        border-radius: 2px;
        margin-bottom: 20px;
      }

      .focus-identity {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        font-style: italic;
        color: var(--ink-charcoal);
        line-height: 1.5;
        max-width: 640px;
        margin: 0 auto;
      }

      .focus-section {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 36px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
      }

      .focus-section h2 {
        font-family: "Playfair Display", serif;
        font-size: 26px;
        color: var(--blood-wine);
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border-faint);
        padding-bottom: 12px;
      }

      .denys-quote {
        background: transparent;
        border-left: 3px solid var(--blood-wine);
        padding: 16px 0 16px 20px;
        margin-bottom: 20px;
        font-style: italic;
      }

      .denys-quote p {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        color: var(--ink-charcoal);
        line-height: 1.6;
        margin-bottom: 8px;
      }

      .denys-quote cite {
        font-family: "JetBrains Mono", monospace;
        font-style: normal;
        font-size: 11px;
        letter-spacing: 0.05em;
        color: var(--sepia-gold);
      }

      .strengths-list,
      .exercises-list {
        list-style: none;
        padding: 0;
      }

      .strengths-list li,
      .exercises-list li {
        padding: 14px 0;
        border-bottom: 1px solid var(--border-faint);
        position: relative;
        padding-left: 28px;
        line-height: 1.6;
      }

      .strengths-list li:last-child,
      .exercises-list li:last-child {
        border-bottom: none;
      }

      .strengths-list li::before {
        content: "\2726";
        position: absolute;
        left: 0;
        top: 14px;
        color: var(--blood-wine);
        font-size: 14px;
      }

      .exercises-list li::before {
        content: counter(ex);
        counter-increment: ex;
        position: absolute;
        left: 0;
        top: 14px;
        color: var(--blood-wine);
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        font-size: 14px;
      }

      .exercises-list {
        counter-reset: ex;
      }

      .exercise-code {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        background: var(--bg-cream);
        color: var(--blood-wine);
        padding: 2px 6px;
        border-radius: 2px;
        border: 1px solid var(--border-faint);
      }

      .grow-area {
        font-family: "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.7;
        color: var(--ink-charcoal);
      }

      .denys-offer-card {
        background: var(--bg-cream);
        border: 1px solid var(--blood-wine);
        border-radius: 4px;
        padding: 32px;
        margin-top: 12px;
      }

      .denys-offer-card h4 {
        color: var(--blood-wine);
        margin-bottom: 16px;
        font-size: 22px;
      }

      .focus-nav {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border-faint);
      }

      .focus-nav .btn {
        flex: 1;
        text-align: center;
        max-width: 280px;
      }

      .offer-hero {
        text-align: center;
        padding: 48px 0;
        margin-bottom: 48px;
        border-bottom: 1px solid var(--border-faint);
      }

      .offer-hero h1 {
        font-size: 52px;
        color: var(--blood-wine);
        margin-bottom: 20px;
      }

      .offer-hero p {
        font-size: 18px;
        max-width: 640px;
        margin: 0 auto;
        color: var(--ink-charcoal);
      }

      .offer-card {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 48px;
        margin-bottom: 32px;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
      }

      .offer-card-number {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--sepia-gold);
        letter-spacing: 0.15em;
        margin-bottom: 8px;
      }

      .offer-card h2 {
        font-size: 38px;
        color: var(--blood-wine);
        margin-bottom: 20px;
      }

      .recommended-list {
        list-style: none;
        padding: 0;
        margin: 16px 0;
      }

      .recommended-list li {
        display: inline-block;
        margin: 4px 4px 4px 0;
      }

      .recommended-list a {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--blood-wine);
        text-decoration: none;
        background: var(--bg-cream);
        padding: 4px 10px;
        border: 1px solid var(--border-faint);
        border-radius: 2px;
        transition: background 0.2s;
      }

      .recommended-list a:hover {
        background: var(--blood-wine);
        color: var(--bg-cream);
        border-color: var(--blood-wine);
      }

      .offer-card ul {
        padding-left: 24px;
        margin: 16px 0;
      }

      .offer-card li {
        padding: 6px 0;
        line-height: 1.6;
      }

      .offer-soc-proof {
        background: var(--bg-cream);
        padding: 14px 18px;
        border-left: 3px solid var(--sepia-gold);
        font-style: italic;
        margin: 16px 0;
        font-size: 15px;
      }

      .contact-block {
        background: var(--bg-cream);
        padding: 18px;
        border-radius: 4px;
        margin-top: 20px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--sepia-gold);
      }

      .speech-view {
        max-width: 880px;
        margin: 0 auto;
      }

      body.stage-mode {
        background: #e8e8e5;
      }
      body.stage-mode .site-header {
        background: #e8e8e5;
      }

      .speech-controls {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 20px;
        margin-bottom: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        position: sticky;
        top: 80px;
        z-index: 50;
        box-shadow: 0 4px 12px rgba(42, 42, 42, 0.06);
      }

      .control-btn {
        padding: 8px 14px;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: var(--bg-cream);
        border: 1px solid var(--border-faint);
        color: var(--ink-charcoal);
        border-radius: 2px;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .control-btn:hover,
      .control-btn.active {
        background: var(--blood-wine);
        color: var(--bg-cream);
        border-color: var(--blood-wine);
      }

      .tone-diagram {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 32px;
        padding: 24px;
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
      }

      .tone-chip {
        text-align: center;
        padding: 16px;
        border-radius: 4px;
        background: var(--bg-cream);
        border: 1px solid var(--border-faint);
      }

      .tone-chip .tone-label {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--blood-wine);
        margin-bottom: 6px;
      }

      .tone-chip .tone-duration {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--sepia-gold);
        letter-spacing: 0.05em;
      }

      .speech-section {
        background: var(--card-paper);
        border: 1px solid var(--border-faint);
        border-radius: 4px;
        padding: 40px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(42, 42, 42, 0.06);
      }

      body.stage-mode .speech-section {
        background: #deddd9;
      }

      .speech-section h2 {
        font-size: 32px;
        color: var(--blood-wine);
        margin-bottom: 8px;
      }

      .speech-section .tone-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--sepia-gold);
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      .speech-text {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        line-height: 1.65;
        color: var(--ink-charcoal);
        font-weight: 400;
      }

      .speech-text p {
        margin-bottom: 20px;
      }

      .speech-text strong {
        color: var(--blood-wine);
        font-weight: 700;
      }

      .speech-text em {
        font-style: italic;
        color: var(--sepia-gold);
      }

      .speech-stage-direction {
        display: inline-block;
        background: var(--bg-cream);
        border-left: 2px solid var(--sepia-gold);
        padding: 4px 10px;
        margin: 0 2px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-style: italic;
        color: var(--sepia-gold);
      }

      .speech-annotation {
        font-family: "Inter", sans-serif;
        font-style: italic;
        font-size: 14px;
        color: var(--sepia-gold);
        margin-top: 16px;
        padding: 12px 16px;
        background: var(--bg-cream);
        border-radius: 2px;
        line-height: 1.5;
      }

      body.annotations-off .speech-annotation {
        display: none;
      }

      @media (max-width: 1024px) {
        .participants-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        h1 {
          font-size: 44px;
        }
        .hero h1 {
          font-size: 48px;
        }
        .offer-hero h1 {
          font-size: 40px;
        }
      }

      @media (max-width: 680px) {
        .participants-grid {
          grid-template-columns: 1fr;
        }
        main {
          padding: 32px 16px 64px;
        }
        .site-header-inner {
          padding: 0 16px;
        }
        .site-nav {
          gap: 16px;
        }
        .site-nav a {
          font-size: 11px;
        }
        h1 {
          font-size: 32px;
        }
        .hero h1 {
          font-size: 36px;
        }
        .offer-hero h1 {
          font-size: 32px;
        }
        .focus-hero h1 {
          font-size: 32px;
        }
        .hero-subtitle {
          font-size: 20px;
        }
        .speech-text {
          font-size: 18px;
        }
        .focus-hero,
        .focus-section,
        .speech-section,
        .offer-card {
          padding: 24px;
        }
        .tone-diagram {
          grid-template-columns: repeat(2, 1fr);
        }
        .focus-nav {
          flex-direction: column;
        }
      }

      @media print {
        .site-header,
        .site-nav,
        .focus-nav,
        .speech-controls,
        .hero-cta {
          display: none;
        }
        body {
          background: white;
          color: black;
        }
        .focus-section,
        .participant-card,
        .speech-section,
        .offer-card {
          box-shadow: none;
          border: 1px solid #ccc;
          page-break-inside: avoid;
        }
        a {

          const idx = list.findIndex((x) => x.slug === slug);
          const prev = idx > 0 ? list[idx - 1] : null;
          const next = idx < list.length - 1 ? list[idx + 1] : null;

          let denysSection = "";
          if (p.denys_offer) {
            denysSection = `
        <section class="focus-section">
          <h2>Якщо хочеш глибше з Денисом</h2>
          <div class="denys-offer-card">
            <h4>${escHtml(p.denys_offer.title)}</h4>
            <p>${escHtml(p.denys_offer.body)}</p>
          </div>
        </section>
      `;
          }

          let denysGratitudeSection = "";
          if (p.gratitude) {
            denysGratitudeSection = `
        <section class="focus-section">
          <h2>Маркер аутентичности — те, що ми побачили</h2>
          <ul class="strengths-list">
            ${p.gratitude.authentic_markers.map((m) => `<li>${escHtml(m)}</li>`).join("")}
          </ul>
        </section>
        <section class="focus-section">
          <h2>Дякуємо за</h2>
          <ul class="strengths-list">
            ${p.gratitude.thanks_for.map((m) => `<li>${escHtml(m)}</li>`).join("")}
          </ul>
        </section>
      `;
          }

          let growSection = "";
          if (p.grow_area) {
            growSection = `
        <section class="focus-section">
          <h2>Зона росту</h2>
          <p class="grow-area">${escHtml(p.grow_area)}</p>
        </section>
      `;
          }

          let exercisesSection = "";
          if (p.exercises && p.exercises.length > 0) {
            exercisesSection = `
        <section class="focus-section">
          <h2>3 наступні кроки практики</h2>
          <ol class="exercises-list">
            ${p.exercises.map((e) => `<li><span class="exercise-code">${escHtml(e.code)}</span> — ${escHtml(e.desc)}</li>`).join("")}
          </ol>
        </section>
      `;
          }

          return `
      <div class="focus-view">
        <a href="#/home" class="back-link" aria-label="Назад до всіх карт">Назад до всіх карт</a>

        <header class="focus-hero">
          <div class="lesson-chip">${escHtml(p.lessons)}</div>
          <h1>${escHtml(p.name)}</h1>
          <p class="focus-identity">${escHtml(p.identity)}</p>
        </header>

        <section class="focus-section">
          <h2>Що Денис побачив у тобі</h2>
          ${p.quotes
            .map(
              (q) => `
            <blockquote class="denys-quote">
              <p>«${escHtml(q.text)}»</p>
              <cite>[${escHtml(q.ref)}]</cite>
            </blockquote>
          `,
            )
            .join("")}
        </section>

        <section class="focus-section">
          <h2>Сильні сторони</h2>
          <ul class="strengths-list">
            ${p.strengths.map((s) => `<li>${escHtml(s)}</li>`).join("")}
          </ul>
        </section>

        ${growSection}
        ${exercisesSection}
        ${denysSection}
        ${denysGratitudeSection}

        <nav class="focus-nav" aria-label="Навігація між картами">
          ${prev ? `<a href="#/focus/${prev.slug}" class="btn btn-secondary">${escHtml(prev.name)}</a>` : `<span></span>`}
          ${next ? `<a href="#/focus/${next.slug}" class="btn btn-secondary">${escHtml(next.name)}</a>` : `<span></span>`}
        </nav>
      </div>
    `;
        }

        function renderOffer() {
          const heroGlybyna = [
            "alina-velihina",
            "anna",
            "olena-sidok",
            "yuliia-nutritsiolog",
            "yuliia-kravchuk",
            "nataliia",
            "olha-bohdanovska",
            "vasyl",
          ];
          const oneOnOne = [
            "kateryna",
            "lera-reznyk",
            "anastasiia-vynohradova",
            "snizhana",
          ];

          function renderRecommendedList(slugs) {
            return slugs
              .map((s) => {
                const p = findBySlug(s);
                if (!p) return "";
                return `<li><a href="#/focus/${s}">${escHtml(p.name)}</a></li>`;
              })
              .join("");
          }

          return `
      <section class="offer-hero">
        <h1>Наступний крок з Денисом</h1>
        <p>Це не cold sales. Це 4 опції, які Денис пропонує далі для тих, хто хоче глибше.</p>
      </section>

      <article class="offer-card">
        <div class="offer-card-number">ОПЦІЯ 01</div>
        <h2>«Глибина Героя» — 44-й потік</h2>
        <p><strong>Що:</strong> Розширена особистісна робота з тріадою + Аркою Героя + 4 елементами глибини героя (хто я · де я · мої закони · що для мене щастя).</p>
        <div class="offer-soc-proof">43 потоки → люди повертаються. Soc proof не від маркетингу, а від людей які повертаються знову.</div>
        <h4 style="margin-top:24px;font-family:'Playfair Display',serif;font-size:18px;color:var(--ink-charcoal);">Для кого з нашого класу особливо:</h4>
        <ul class="recommended-list">${renderRecommendedList(heroGlybyna)}</ul>
        <div class="contact-block">КОНТАКТ: запитати у Дениса прямо на занятті або через Telegram</div>
      </article>

      <article class="offer-card">
        <div class="offer-card-number">ОПЦІЯ 02</div>
        <h2>1-on-1 коучинг з Денисом</h2>
        <p>Персональний формат для тих, хто вже на високому рівні або має унікальний випадок, що не лікується груповим форматом.</p>
        <h4 style="margin-top:24px;font-family:'Playfair Display',serif;font-size:18px;color:var(--ink-charcoal);">Для кого з нашого класу особливо:</h4>
        <ul class="recommended-list">${renderRecommendedList(oneOnOne)}</ul>
        <div class="contact-block">КОНТАКТ: через Дениса прямо</div>
      </article>

      <article class="offer-card">
        <div class="offer-card-number">ОПЦІЯ 03</div>
        <h2>Студія «Тепло» (Одеса)</h2>
        <p>Якщо ти в Одесі або плануєш приїхати — physical practice присутності. Інтегрується з 8-фокусів каталогом — «сьогодні я треную ОДНУ якість».</p>
        <div class="contact-block">КОНТАКТ: через Дениса або сторінку студії</div>
      </article>

      <article class="offer-card">
        <div class="offer-card-number">ОПЦІЯ 04</div>
        <h2>«Годуй. Люби. Молись»</h2>
        <p>4 роки безкоштовно годуємо ~100 людей/тиждень. Якщо хочеш приєднатися як волонтер або підтримати фінансово — це шлях.</p>
        <div class="offer-soc-proof">Це не пропозиція з курсу — це запрошення в практику Дениса.</div>
      </article>

      <footer class="site-footer">
        Центр оффера — Денис. Подарунок класу.
      </footer>
    `;
        }

        function renderSpeech() {
          return `
      <div class="speech-view">
        <a href="#/home" class="back-link" aria-label="Назад на головну">Назад на головну</a>

        <header style="text-align:center;margin-bottom:32px;">
          <h1 style="color:var(--blood-wine);font-size:42px;">5-хв СКРИПТ ВИСТУПУ</h1>
          <p style="font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:var(--sepia-gold);">Структура: Hook → Demo → Reveal → Закриття · ~680 слів · 5 хв з 30-сек люфтом</p>
        </header>

        <div class="tone-diagram" role="region" aria-label="Тонова діаграма виступу">
          ${SPEECH_SECTIONS.map(
            (s) => `
            <div class="tone-chip">
              <div class="tone-label">${escHtml(s.tone)}</div>
              <div class="tone-duration">${escHtml(s.duration)}</div>
            </div>
          `,
          ).join("")}
        </div>

        <div class="speech-controls" role="region" aria-label="Контроли виступу">
          <button class="control-btn" id="toggle-annotations" type="button" aria-pressed="false">Без анотацій</button>
          <button class="control-btn" id="toggle-stage" type="button" aria-pressed="false">Темний фон сцени</button>
          <button class="control-btn" id="font-bigger" type="button" aria-label="Збільшити шрифт">A+</button>
          <button class="control-btn" id="font-smaller" type="button" aria-label="Зменшити шрифт">A−</button>
          <button class="control-btn" id="font-reset" type="button" aria-label="Скинути шрифт">A</button>
        </div>

        ${SPEECH_SECTIONS.map(
          (s) => `
          <section class="speech-section">
            <h2>${escHtml(s.title)}</h2>
            <div class="tone-tag">${escHtml(s.duration)} · Тон ${escHtml(s.tone)}</div>
            <div class="speech-text">${s.text}</div>
            <div class="speech-annotation">${escHtml(s.annotation)}</div>
          </section>
        `,
        ).join("")}

        <footer class="site-footer">
          Тон-фрейм: ПОДАРУНОК класу. Не cold sales. Денис у залі — ми вшановуємо його.
        </footer>
      </div>
    `;
        }

        function renderRoute() {
          const hash = window.location.hash || "#/home";
          const app = document.getElementById("app");
          let html = "";

          if (!hash.startsWith("#/speech")) {
            document.body.classList.remove("stage-mode");
            document.body.classList.remove("annotations-off");
          }

          if (
            hash === "#/home" ||
            hash === "#" ||
            hash === "" ||
            hash === "#/" ||
            hash.startsWith("#/home") ||
            hash === "#cards"
          ) {
            html = renderHome();
            setActiveNav("home");
          } else if (hash.startsWith("#/focus/")) {
            const slug = hash.replace("#/focus/", "");
            html = renderFocus(slug);
            setActiveNav("cards");
          } else if (hash === "#/offer") {
            html = renderOffer();
            setActiveNav("offer");
          } else if (hash === "#/speech") {
            html = renderSpeech();
            setActiveNav("speech");
          } else {
            html = renderHome();
            setActiveNav("home");
          }

          app.innerHTML = html;
          window.scrollTo({ top: 0, behavior: "instant" });

          if (hash === "#/speech") bindSpeechControls();

          document.querySelectorAll('[role="link"]').forEach((el) => {
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                el.click();
              }
            });
          });
        }

        function setActiveNav(active) {
          document.querySelectorAll(".site-nav a").forEach((a) => {
            a.classList.toggle("active", a.getAttribute("data-nav") === active);
          });
        }

        let speechFontSize = 22;

        function bindSpeechControls() {
          const tA = document.getElementById("toggle-annotations");
          const tS = document.getElementById("toggle-stage");
          const fB = document.getElementById("font-bigger");
          const fS = document.getElementById("font-smaller");
          const fR = document.getElementById("font-reset");

          if (tA)
            tA.addEventListener("click", () => {
              const on = document.body.classList.toggle("annotations-off");
              tA.classList.toggle("active", on);
              tA.setAttribute("aria-pressed", String(on));
              tA.textContent = on ? "Показати анотації" : "Без анотацій";
            });

          if (tS)
            tS.addEventListener("click", () => {
              const on = document.body.classList.toggle("stage-mode");
              tS.classList.toggle("active", on);
              tS.setAttribute("aria-pressed", String(on));
              tS.textContent = on ? "Світлий фон" : "Темний фон сцени";
            });

          function applyFontSize() {
            document.querySelectorAll(".speech-text").forEach((el) => {
              el.style.fontSize = speechFontSize + "px";
            });
          }

          if (fB)
            fB.addEventListener("click", () => {
              speechFontSize = Math.min(36, speechFontSize + 2);
              applyFontSize();
            });
          if (fS)
            fS.addEventListener("click", () => {
              speechFontSize = Math.max(14, speechFontSize - 2);
              applyFontSize();
            });
          if (fR)
            fR.addEventListener("click", () => {
              speechFontSize = 22;
              applyFontSize();
            });
        }

        window.addEventListener("hashchange", renderRoute);
        document.addEventListener("DOMContentLoaded", renderRoute);
        if (document.readyState !== "loading") renderRoute();
      })();
    </script>
  </body>
</html>
