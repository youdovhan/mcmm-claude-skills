<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCMM Ораторське — Каталог вправ · Юрій Довган · v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f4efe6;
        --paper2: #ede5d4;
        --paper-dark: #c8b998;
        --ink: #1a1410;
        --ink-soft: #4a3f33;
        --mute: #7a6a55;
        --accent: #5c1a1b;
        --accent-soft: #8a3a3b;

        /* Type badge palette */
        --t-warmup: #c2691f;
        --t-voice: #2c5d8a;
        --t-breath: #2c8a8a;
        --t-structure: #5d3a8a;
        --t-presence: #2d6a3e;
        --t-articulation: #a07e1f;
        --t-rhythm: #a02e7a;
        --t-reflection: #6b6b1f;
        --t-other: #777;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        font-family: "Inter", sans-serif;
        line-height: 1.55;
        background-image:
          radial-gradient(rgba(140, 110, 70, 0.04) 1px, transparent 1px),
          radial-gradient(rgba(140, 110, 70, 0.03) 1px, transparent 1px);
        background-size: 24px 24px, 48px 48px;
        background-position: 0 0, 12px 12px;
      }

      /* ===================== APP SHELL ===================== */
      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }

      .app-header {
        border-bottom: 2px solid var(--paper-dark);
        padding-bottom: 16px;
        margin-bottom: 28px;
      }

      .app-title {
        font-family: "Playfair Display", serif;
        font-weight: 900;
        font-size: 28px;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }

      .app-sub {
        color: var(--mute);
        font-size: 13px;
        margin: 0;
      }

      /* ===================== PROGRESS ===================== */
      .progress-block {
        background: #fbf8f1;
        border: 1px solid var(--paper-dark);
        border-radius: 4px;
        padding: 16px 20px;
        margin-bottom: 28px;
      }

      .progress-line {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink-soft);
        margin: 0 0 8px;
      }

      .progress-line strong { color: var(--ink); }

      .progress-bar {
        height: 8px;
        background: var(--paper2);
        border: 1px solid var(--paper-dark);
        border-radius: 2px;
        overflow: hidden;
        margin: 8px 0 6px;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--t-presence), var(--accent-soft));
        transition: width 0.3s ease;
      }

      .progress-sub {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--mute);
        margin: 4px 0 0;
      }

      /* ===================== SECTION HEADS ===================== */
      .section-head {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 16px;
        color: var(--ink);
      }

      /* ===================== TODAY CARDS ===================== */
      .today-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 28px;
      }

      .today-card {
        background: #fbf8f1;
        border: 1px solid var(--paper-dark);
        border-radius: 4px;
        padding: 18px 20px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 16px;
        align-items: center;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.03);
      }

      .today-index {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        font-weight: 900;
        color: var(--accent);
        min-width: 32px;
        text-align: center;
        line-height: 1;
      }

      .today-mid { min-width: 0; }

      .today-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--mute);
        margin-bottom: 6px;
        align-items: center;
      }

      .today-title {
        font-family: "Playfair Display", serif;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.25;
        margin: 0 0 4px;
        color: var(--ink);
      }

      .today-foot {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--mute);
      }

      .today-cta {
        background: var(--ink);
        color: var(--paper);
        border: none;
        padding: 10px 16px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        border-radius: 2px;
        white-space: nowrap;
      }

      .today-cta:hover { background: var(--accent); }

      .today-empty {
        background: var(--paper2);
        border: 1px dashed var(--paper-dark);
        border-radius: 4px;
        padding: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--mute);
        font-family: "Inter", sans-serif;
        margin-bottom: 28px;
      }

      .today-empty strong {
        color: var(--ink);
        font-family: "Playfair Display", serif;
        font-size: 18px;
        display: block;
        margin-bottom: 8px;
      }

      /* ===================== SECONDARY ACTIONS ===================== */
      .secondary-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 36px;
      }

      .secondary-btn {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        padding: 10px 18px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        border-radius: 2px;
      }

      .secondary-btn:hover { background: var(--ink); color: var(--paper); }

      /* ===================== UTILITY BAR ===================== */
      .util-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding-top: 24px;
        border-top: 1px dashed var(--paper-dark);
        align-items: center;
      }

      .util-btn {
        background: transparent;
        color: var(--mute);
        border: 1px solid var(--paper-dark);
        padding: 6px 12px;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        border-radius: 2px;
      }

      .util-btn:hover { color: var(--ink); border-color: var(--ink); }

      /* ===================== BADGES ===================== */
      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
        display: inline-block;
      }

      .badge-lesson { background: var(--ink); color: var(--paper); }
      .badge-type[data-type="warmup"] { background: var(--t-warmup); color: white; }
      .badge-type[data-type="voice"] { background: var(--t-voice); color: white; }
      .badge-type[data-type="breath"] { background: var(--t-breath); color: white; }
      .badge-type[data-type="structure"] { background: var(--t-structure); color: white; }
      .badge-type[data-type="presence"] { background: var(--t-presence); color: white; }
      .badge-type[data-type="articulation"] { background: var(--t-articulation); color: white; }
      .badge-type[data-type="rhythm"] { background: var(--t-rhythm); color: white; }
      .badge-type[data-type="reflection"] { background: var(--t-reflection); color: white; }
      .badge-type[data-type="other"] { background: var(--t-other); color: white; }

      .badge-diff {
        background: transparent;
        color: var(--mute);
        border: 1px solid var(--paper-dark);
      }

      /* ===================== ALL VIEW ===================== */
      .all-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .back-btn {
        background: transparent;
        color: var(--mute);
        border: none;
        font-size: 13px;
        font-family: "JetBrains Mono", monospace;
        cursor: pointer;
        padding: 4px 8px;
        margin-left: -8px;
      }

      .back-btn:hover { color: var(--accent); }

      .all-filters {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        padding: 12px 14px;
        background: var(--paper2);
        border-radius: 4px;
        border: 1px solid var(--paper-dark);
        align-items: center;
      }

      .filter-chip-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .filter-label-small {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mute);
        margin-right: 2px;
      }

      .filter-select {
        background: var(--paper);
        border: 1px solid var(--paper-dark);
        padding: 5px 10px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        color: var(--ink-soft);
        border-radius: 2px;
        cursor: pointer;
      }

      .filter-pill {
        background: transparent;
        border: 1px solid var(--paper-dark);
        padding: 5px 12px;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        color: var(--ink-soft);
        cursor: pointer;
        border-radius: 12px;
        transition: all 0.15s;
      }

      .filter-pill:hover { border-color: var(--accent-soft); }

      .filter-pill.active {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }

      .all-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .row-item {
        display: grid;
        grid-template-columns: 32px 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        background: #fbf8f1;
        border: 1px solid var(--paper-dark);
        border-radius: 3px;
        min-height: 48px;
        cursor: pointer;
        transition: background 0.1s, border-color 0.1s;
      }

      .row-item:hover { background: var(--paper); border-color: var(--accent-soft); }
      .row-item.hidden { display: none; }

      .row-item[data-status="done"] {
        border-left: 3px solid var(--t-presence);
        background: rgba(45, 106, 62, 0.04);
      }

      .row-item[data-status="in_progress"] {
        border-left: 3px solid var(--t-warmup);
        background: rgba(194, 105, 31, 0.04);
      }

      .row-status { font-size: 16px; text-align: center; }

      .row-mid { min-width: 0; }

      .row-title {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        margin: 0;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--mute);
        margin-top: 2px;
      }

      .row-badges {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .row-cta {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        padding: 5px 12px;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        border-radius: 2px;
      }

      .row-cta:hover { background: var(--ink); color: var(--paper); }

      .all-empty {
        padding: 30px;
        text-align: center;
        color: var(--mute);
        font-size: 14px;
      }

      /* ===================== FOCUS VIEW ===================== */
      .focus {
        max-width: 740px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }

      .focus-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--mute);
      }

      .focus-session-pos { letter-spacing: 0.06em; }

      .focus-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 16px;
        align-items: center;
      }

      .focus-meta-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--mute);
      }

      .focus-title {
        font-family: "Playfair Display", serif;
        font-size: 36px;
        font-weight: 900;
        line-height: 1.15;
        margin: 0 0 16px;
        color: var(--ink);
        letter-spacing: -0.01em;
      }

      .focus-refs {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mute);
        margin: 0 0 20px;
      }

      /* ===================== CONTENT SECTIONS ===================== */
      .focus-h2 {
        font-family: "Playfair Display", serif;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink);
        margin: 28px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--paper-dark);
      }

      .focus-meta-text-block {
        font-family: "Inter", sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        background: var(--paper2);
        border-left: 3px solid var(--t-presence);
        padding: 14px 18px;
        margin: 0 0 18px;
        border-radius: 0 2px 2px 0;
      }

      .focus-instruction {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink);
        white-space: pre-wrap;
        background: #fbf8f1;
        border: 1px solid var(--paper-dark);
        padding: 16px 20px;
        border-radius: 3px;
      }

      .focus-instruction strong { font-weight: 600; color: var(--ink); }
      .focus-instruction em { font-style: italic; color: var(--ink-soft); }
      .focus-instruction h3 {
        font-family: "Playfair Display", serif;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin: 16px 0 6px;
      }
      .focus-instruction h4 {
        font-family: "Playfair Display", serif;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        margin: 12px 0 4px;
      }
      .focus-instruction blockquote {
        margin: 12px 0;
        padding: 8px 14px;
        background: var(--paper);
        border-left: 2px solid var(--accent-soft);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink-soft);
      }

      .focus-criteria, .focus-mistakes, .focus-adaptations {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink);
        white-space: pre-wrap;
        padding: 12px 16px;
        background: #fbf8f1;
        border: 1px solid var(--paper-dark);
        border-radius: 3px;
      }

      .focus-adaptations strong { font-weight: 600; color: var(--ink); }

      details.collapsible {
        margin: 0 0 18px;
        border: 1px solid var(--paper-dark);
        border-radius: 3px;
        background: #fbf8f1;
      }

      details.collapsible summary {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 12px 16px;
        cursor: pointer;
        list-style: none;
        color: var(--ink);
        font-weight: 600;
        position: relative;
      }

      details.collapsible summary::-webkit-details-marker { display: none; }

      details.collapsible summary::after {
        content: "▼";
        font-size: 10px;
        color: var(--mute);
        margin-left: 8px;
        transition: transform 0.2s;
        display: inline-block;
      }

      details.collapsible[open] summary::after {
        transform: rotate(180deg);
      }

      details.collapsible summary:hover { color: var(--accent); }

      details.collapsible > div {
        padding: 0 16px 14px;
      }

      .focus-verbatim {
        padding: 14px 16px;
        background: var(--paper2);
        border-left: 3px solid var(--accent-soft);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-soft);
        white-space: pre-wrap;
        margin: 0;
        border-radius: 0 2px 2px 0;
      }

      .focus-section-divider {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--mute);
        text-align: center;
        margin: 36px 0 20px;
        position: relative;
      }

      .focus-section-divider::before,
      .focus-section-divider::after {
        content: "";
        display: inline-block;
        width: 60px;
        height: 1px;
        background: var(--paper-dark);
        vertical-align: middle;
        margin: 0 12px;
      }

      .focus-field-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mute);
        display: block;
        margin: 16px 0 6px;
      }

      .focus-input {
        width: 100%;
        border: 1px solid var(--paper-dark);
        background: #fbf8f1;
        padding: 10px 12px;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink);
        border-radius: 2px;
        resize: vertical;
        margin: 0 0 8px;
      }

      .focus-input.transcript {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        min-height: 120px;
      }

      .focus-input.notes { min-height: 80px; }

      .focus-input:focus {
        outline: none;
        border-color: var(--accent-soft);
        background: var(--paper);
      }

      .focus-rating-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
      }

      .focus-rating-row .focus-field-label { margin: 0; }

      .rating-slider { flex: 1; accent-color: var(--accent); }

      .rating-value {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--ink);
        font-weight: 600;
        min-width: 44px;
      }

      .focus-copy-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 16px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 2px;
        width: 100%;
        margin: 12px 0 24px;
      }

      .focus-copy-btn:hover { background: var(--accent-soft); }

      .focus-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 2px solid var(--paper-dark);
      }

      .focus-controls .focus-control-primary { grid-column: 1 / -1; }

      .focus-control {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--paper-dark);
        padding: 12px 16px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        border-radius: 2px;
      }

      .focus-control:hover { border-color: var(--ink); background: var(--paper); }

      .focus-control-primary {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
        font-weight: 500;
      }

      .focus-control-primary:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .focus-date-stamp {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--mute);
        margin-top: 16px;
        text-align: right;
      }

      /* ===================== SESSION END BANNER ===================== */
      .session-end-banner {
        background: linear-gradient(135deg, rgba(45, 106, 62, 0.12), rgba(45, 106, 62, 0.03));
        border: 1px solid var(--t-presence);
        border-left: 4px solid var(--t-presence);
        padding: 20px 24px;
        margin: 0 0 28px;
        border-radius: 4px;
      }

      .session-end-banner h2 {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 4px;
        color: var(--ink);
      }

      .session-end-banner p {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink-soft);
        margin: 0;
      }

      /* ===================== TOAST ===================== */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--ink);
        color: var(--paper);
        padding: 12px 24px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        border-radius: 2px;
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 100;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ===================== STAMP ===================== */
      .stamp {
        text-align: right;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--mute);
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid var(--paper-dark);
      }

      /* ===================== RESPONSIVE ===================== */
      @media (max-width: 700px) {
        .app, .focus { padding: 20px 14px 60px; }
        .focus-title { font-size: 28px; }
        .app-title { font-size: 22px; }
        .today-card { grid-template-columns: auto 1fr; }
        .today-cta { grid-column: 1 / -1; width: 100%; }

 плавно завершуй, без ритуальності. Просто є, як є.»\n\n11. **Юрій робить**: фінальні дихання, повідомляє про завершення.\n\n12. **Я кажу**: «Як ти зараз? Що змінилося в твоєму відчутті простору?»\n\n13. **Юрій робить**: коротко описує стан (1-2 речення).",

    "instruction": "Це warmup-вправа. Я ставлю 4 питання послідовно, чекаючи відповіді на кожне.\n\n1. **Я кажу Юрію**: «Зараз ми зробимо маленьку самопрезентацію — як на початку тренінгу. Це warmup, без перфекціонізму. 30-60 секунд. Я задам 4 питання, ти відповіси на кожне коротко. Готовий?»\n\n2. **Юрій робить**: «Готовий».\n\n3. **Я кажу**: «Питання 1 — Хто ти? Як тебе звуть, хто ти є зараз — буквально одне-два речення.»\n\n4. **Юрій робить**: текст/аудіо ~10-15 сек.\n\n5. **Я кажу**: «Питання 2 — Чим ти займаєшся і в чому допомагаєш іншим? Одне-два речення про твою професійну/ціннісну роль.»\n\n6. **Юрій робить**: текст/аудіо ~15-20 сек.\n\n7. **Я кажу**: «Питання 3 — Які труднощі ти зараз маєш з публічними виступами або з проявленістю? Якщо таких немає — так і скажи.»\n\n8. **Юрій робить**: текст/аудіо ~15-30 сек.\n\n9. **Я кажу**: «Питання 4 — Яку користь ти хочеш отримати від цього модуля чи від нашої роботи?»\n\n10. **Юрій робить**: текст/аудіо ~10-20 сек.\n\n11. **Я кажу**: «Дякую. Тепер давай подивимось разом — який центральний запит проявився у твоїх відповідях. Це буде нашою opportunity-точкою на цей урок.»\n\n12. **Я роблю**: summary 2-3 речення про основний запит, який почув. Зв'язую із одним із принципів уроку (наприклад, ХТО Я/ДЛЯ КОГО/ДЛЯ ЧОГО, страх скептиків, проявленість як форма цінностей).",

    "mistakes": "- ❌ Перетворити на повноцінне «знайомство-сторі» 5-7 хв — це warmup, не глибока розповідь\n- ❌ Юрій відповідає «по бренду» / «по позиціонуванню» — пропускає реальні труднощі. Перепитати: «А що болить насправді?»\n- ❌ Запит формулюється абстрактно — «хочу стати впевненішим». Запросити конкретику: «Коли востаннє було страшно? Що саме?»\n- ❌ Coach сам пише summary без перевірки з Юрієм. Запросити: «Я правильно почув твій запит, чи додамо щось?»",
    "adaptations": "- **Текст**: Юрій пише 4 пронумерованих відповіді. Я перевіряю, чи кожна відповідь стоїть на своєму місці.\n- **Голос (Wispr/audio)**: слухаю темп — якщо швидко-поверхнево → запропонувати ще раз, повільніше. Слухаю інтонацію на питанні 3 — там часто з'являється напруга/стид.\n- **Відеозапис**: дивлюся на тіло — як змінюється поза при різних питаннях. Часто третє питання («труднощі») викликає сідіння глибше у крісло, відведення погляду.",
    "verbatim": "> \"Хто ви, як вас звуть, що ви любите, що ви не любите, які складності у вас зараз є з публічними виступленнями, з проявленістю, якщо такові взагалі є, і яку пользу ви хочете отримати від наших зустрічей.\" — [video 06:48]\n\n> \"Тобто, хто ви, чим займаєтесь, чим ви допомагаєте іншим, і які складності у вас зараз відбуваються з публічними виступленнями, з проявленостю, з соціальними сетями, з сценою, в двох словах.\" — [video 07:29]"

    "meta": "За 1-2 хв перед виходом на сцену (або камеру) увійти в стан публічної самотності — спокою, цілісності, опертості на сенс. Зібрати тіло, голос, погляд через відповіді на три якоря: роль / служіння / зміна.",
    "instruction": "Це швидкий ritual перед виступом. Я ставлю 3 питання, Юрій дає коротку конкретну відповідь по кожному. ВАЖЛИВО: відповіді мають бути на конкретний майбутній виступ, не абстрактні.\n\n1. **Я кажу Юрію**: «Перед нами — твій майбутній виступ. Який саме? Дай мені 1 речення про контекст: де, скільки людей, скільки хвилин.»\n\n2. **Юрій робить**: одне речення (наприклад: «Завтра 30 хв на Статусі, ~80 людей, тема — AI для коучів»).\n\n3. **Я кажу**: «Добре. Зараз — три якоря. Дай мені коротку конкретну відповідь по кожному.»\n\n4. **Я кажу**: «Якір 1 — У якій ролі ти зараз перед ними? НЕ \"хто ти як особистість\" — це філософія. На цьому виступі ти хто? Експерт? Наставник? Друг? Людина з історією? Провідник? Сформулюй одним словом-роллю.»\n\n5. **Юрій робить**: одне слово/коротка фраза.\n\n6. **Я кажу**: «Якір 2 — Кому ти зараз корисний? НЕ \"для всіх у залі\". Назви одну конкретну людину в залі — її страх, її біль, її запит. Якщо не знаєш конкретно — змалюй типаж: «Це жінка-психолог 35-45 років, яка боїться камери і хоче запустити блог».»\n\n7. **Юрій робить**: 1-2 речення про конкретну людину/типаж.\n\n8. **Я кажу**: «Якір 3 — Що ти хочеш, щоб змінилося в цій людині після твоїх слів? НЕ \"щоб усі усе зрозуміли\". Конкретний бажаний результат: розуміння, стан, погляд на себе, маленька сміливість, новий сенс, нова звичка. Одне речення.»\n\n9. **Юрій робить**: 1 речення.\n\n10. **Я кажу**: «Запам'ятай ці три відповіді. Зараз ти можеш проговорити їх вголос ще раз — як заклинання-якор. Це збере тіло, голос, погляд.»\n\n11. **Юрій робить**: повторює всі 3 відповіді одним блоком (audio або текст).\n\n12. **Я кажу**: «Тепер ти можеш заходити на сцену з цим». (Якщо є реальний виступ далі — фіналізую тут. Якщо це тренувальна сесія — переходжу до фідбеку.)",

    "mistakes": "- ❌ Якір 1 формулюється філософськи («я — людина, яка несе світ») — повернути до конкретної ролі ТУТ І ЗАРАЗ. «Експерт» чи «друг»?\n- ❌ Якір 2 — «для всіх у залі» / «для всіх коучів». Денис прямо забороняє: «Не «для всього світу». Не «для всіх людей у залі»».\n- ❌ Якір 3 — абстрактне «змінити життя на краще». Запросити: «Конкретно — що людина зробить ПІСЛЯ? Подумає інакше? Запише фразу? Запишеться на сесію?»\n- ❌ Робити якоря НЕ безпосередньо перед виступом, а «на всякий випадок раніше». Сенс — у моменті, 1-2 хв до сцени.\n- ❌ Пропустити крок 11 (повтор-заклинання) — а саме воно зіщеплює тіло/голос/погляд.",

    "meta": "Навчитися дивитися на світ з очей іншого (буквально — стати об'єктом, подивитися на себе з його позиції). Натренувати побудову завершеної історії за 6-крок-структурою: пролог → шлях → конфлікт → кульмінація → розв'язка → фінал. Це ОБОВ'ЯЗКОВИЙ передкрок до Арки Героя (ex-07), бо «олівець» легше будувати, ніж власну глибину.",
    "instruction": "Вправа має 3 фази: (А) занурення в предмет як особистість, (Б) перевтілення у предмет з поглядом на себе, (В) розповідь історії предмета за 6 пунктами.\n\n**ФАЗА А — занурення в предмет (5-7 хв)**\n\n1. **Я кажу Юрію**: «Зараз проведемо практику \"Історія предмета\". Це передкрок до власної історії за Аркою Героя. На предметі легше тренувати структуру. Вибери один конкретний предмет навколо себе. Щось одне і щось конкретне. Це може бути ручка, телефон, книга, лампа, стіна, ігрушка — будь-що. Назви.»\n\n2. **Юрій робить**: називає предмет.\n\n3. **Я кажу**: «Тепер дивись на цей предмет безперервно. Уяви, що він живий. Що він — особистість. І що він якось десь був народжений. До тебе зараз прийдуть відповіді на кілька питань — у форматі картинок на \"кіноленті уму\". Просто бачиш ці картинки.»\n\n4. **Я кажу** (одне питання за раз, пауза 10-15 сек між): «Хто створив цей предмет, у якому стані, в якому місці?»\n\n5. **Юрій робить**: візуалізує, коротко описує (1-2 речення).\n\n6. **Я кажу**: «Як він потрапив у твій простір?»\n\n7. **Юрій робить**: відповідає.\n\n8. **Я кажу**: «Яке головне призначення цього предмета у твоєму просторі? Що його зв'язує з тобою — спільна ціль, спільні цінності?»\n\n9. **Юрій робить**: відповідає.\n\n10. **Я кажу**: «Що він більше за все любить робити? Від чого йому екстатично, класно? Що його найбільше надихає?»\n\n11. **Юрій робить**: 2-3 пункти.\n\n12. **Я кажу**: «А що він не хоче і не любить робити? За своєю свободою волі він каже \"ні\" на що?»\n\n13. **Юрій робить**: 1-2 пункти.\n\n14. **Я кажу**: «У чому його суперсила, його унікальне призначення? І як він цією суперсилою сьогодні служить тобі або простору?»\n\n15. **Юрій робить**: 1-2 речення.\n\n16. **Я кажу**: «Може йому чогось не вистачає? Може з ним зробили щось не так?»\n\n17. **Юрій робить**: 1-2 речення.\n\n**ФАЗА Б — переміщення в предмет (3-5 хв)**\n\n18. **Я кажу**: «Тепер — заведи з предметом живий діалог. У себе в умі. Поздоровайся. Поспілкуйся з ним, як піде. Узнай його як особистість. Пусть він тобі щось розкаже про свої поточні життєві періоди. 40 секунд – 1 хвилина.»\n\n19. **Юрій робить**: внутрішній діалог 40-60 сек.\n\n20. **Я кажу**: «А тепер — плавно, по-акторськи, перемістись у цей предмет. Стань їм. Подивись на простір з його позиції, з його тіла. Подивись на того себе, який навпроти, з його очей. Що ти бачиш про себе? Що ти відчуваєш про себе? З якою енергетикою, з якими цілями цей \"ти\" з тобою взаємодіє?»\n\n21. **Юрій робить**: 30-60 сек тиші + опис того, що побачив.\n\n22. **Я кажу**: «Будучи цим предметом — скажи щось тому собі, який навпроти. Дай якусь пораду, комплімент, рекомендацію або напутствіе на найближчий час.»\n\n23. **Юрій робить**: 1-3 речення від імені предмета.\n\n24. **Я кажу**: «Плавно повернись до себе. Поблагодарити предмет за взаємодію.»\n\n**ФАЗА В — розповідь історії за 6 пунктами (5-10 хв)**\n\n25. **Я кажу**: «Тепер — спробуй розповісти історію цього предмета як короткий виступ. Уяви, що предмет виступає на сцені перед людьми. Будуй за 6 пунктами:\n1. **Пролог**: я + походження («Я — олівець, я народився на фабриці в…»)\n1. **Шлях**: як я сюди потрапив (магазин, упаковка, дівчинка, сумочка…)\n1. **Конфлікт**: точка напруги (мене забули / зламали / поклали в шуфляду)\n1. **Кульмінація**: момент істини (я усвідомив, що моє призначення — не бути ідеальним)\n1. **Розв'язка**: новий стан (нова дівчинка, нова господиня)\n1. **Фінал**: подарунок слухачеві (урок: «Не бійтеся бути неідеальними. Головне — залишати слід.»)\n   Розповідай вільно, без перфекціонізму. 2-5 хвилин.»\n\n1. **Юрій робить**: розповідь (текст або аудіо).\n\n1. **Я кажу**: «Дякую. Тепер давай разом подивимось — чи витримана структура? Поговоримо про кожен пункт.»\n\n1. **Я перевіряю** по 6 пунктах: пролог/шлях/конфлікт/кульмінація/розв'язка/фінал — назвати які є чітко, які бракують. Дати конкретний фідбек.",
    "criteria": "- [ ] Юрій вибрав ОДИН конкретний предмет, не «щось»\n- [ ] Фаза А: візуалізація йшла повільно, з паузами (не proxy «всі питання за 30 сек»)\n- [ ] Фаза Б: при переміщенні у предмет — реально був «погляд звідти», з'явилось щось НОВЕ про себе (не повторив свої думки)\n- [ ] Фаза В: усі 6 пунктів структури присутні (хоча б по 1-2 реченням)\n- [ ] Фінал містить «дар слухачеві» — конкретний урок, не просто опис\n- [ ] Загальна тривалість 15-25 хв (НЕ 5 хв — це не warmup)",
    "mistakes": "- ❌ Юрій вибирає абстракт («моя кімната»). Повернути: «ОДИН конкретний предмет, не простір».\n- ❌ Перескакувати з питання на питання у Фазі А без пауз — це не картинки, це раціональні відповіді. Уповільнити.\n- ❌ У Фазі Б — «я не вмію перемикнутися у предмет». Допомогти: «Просто на 30 сек скажи \"я зараз — ця ручка. Що я бачу про того Юрія?\"».\n- ❌ У Фазі В — пропустити пункт 4 (кульмінація) або 6 (фінал-дар). Без них історія — просто опис, не Арка Героя.\n- ❌ Фінал виходить «опис без уроку» («…а потім мене викинули»). Запитати: «А ЯКИЙ урок цей предмет дав би слухачам?»\n- ❌ Робити цю вправу одразу із власною історією, без предмета-тренажера. Денис прямо: предмет — це передкрок.",
    "adaptations": "- **Текст**: Юрій пише історію як 6 нумерованих абзаців. Я перевіряю кожний.\n- **Голос (Wispr/audio)**: слухаю Фазу В. Чи змінюється тон по пунктах (тон конфлікту ≠ тон фіналу)? Якщо все одним тоном — нагадаю про 3 емоційні стани історії (ex-08 + C-l05-057).\n- **Відеозапис**: дивлюсь чи присутнє жестикулювання у кульмінації / фіналі. Часто live-розповідь активує тіло — це знак, що історія «своя».",
    "verbatim": "> \"виберіть якийсь один предмет, може бути на вашому робочому столі або деяк. Це має бути щось одне і щось конкретне... уявіть, що цей предмет живий, що він — особистість, і що він якось десь був народжений.\" — [video 01:08:58]\n\n> \"зараз плавненько, по-актерськи, перемістіться в цей предмет. Станьте їм, а це значить, подивіться на це пространство, на вашу кімнату з його глибин, з його тіла. І подивіться на того себе, яке навпроти, з його особи. І що ви бачите, що ви відчуєте про себе, яке навпроти, коли ви є вашим живим предметом.\" — [video 01:13:43]\n\n> \"1 Пролог (я + походження). 2 Шлях (як я сюди потрапив). 3 Конфлікт (внутрішній або зовнішній). 4 Кульмінація (прорив, момент істини). 5 Розв'язка (новий стан). 6 Фінал (подарунок слухачеві).\" — [slide 28]"

    "meta": "Підготуватися до написання Арки Героя (ex-07) — заздалегідь відповісти на три фундаментальні питання, які складуть пункти 0/1, 2/5 та 6 Арки. Це аналог якорів оратора (ex-03), але для написання історії, а не виходу на сцену.",
    "instruction": "Це письмова рефлексивна вправа. Я задаю 3 питання послідовно, чекаю на розгорнуту відповідь по кожному. Кожне питання має 2-3 підпункти-направляючі.\n\n1. **Я кажу Юрію**: «Зараз ми підготуємо фундамент для твоєї особистої історії за Аркою Героя. Три питання — три блоки. Запиши собі відповіді (або надішли тут). Без перфекціонізму, як виходить. Готовий?»\n\n2. **Юрій робить**: «Готовий».\n\n3. **Я кажу**: «**Питання 1 — Хто ти зараз?** Два підпункти:\n   (а) як ти позиціонуєш себе в суспільстві / професійно;\n   (б) як ти хочеш, щоб тебе сприймали інші люди.\n   Відповідь на обидва підпункти. Це твоя точка Б — куди ти прийшов.»\n\n4. **Юрій робить**: 2-4 речення (по 1-2 на підпункт).\n\n5. **Я кажу**: «**Питання 2 — Шлях (як я сюди потрапив):**\n   (а) яка була твоя головна проблема в минулому?\n   (б) як її вирішення привело тебе в нинішню точку Б?\n   Виділи 1-2 ключових кризові моменти, які тебе сформували. Можеш тезисно. Наприклад — як не поїхав на чемпіонат, як розтався з дівчиною, як проживав страх відкрити бізнес.»\n\n6. **Юрій робить**: 3-6 речень. Виділяє 1-2 ключових кризи.\n\n7. **Я кажу**: «**Питання 3 — Що я несу?**\n   Які головні цінності, стани, повідомлення ти хочеш передати через всі форми своєї проявленості — через проєкти, продукти, виступи, відносини?\n   Не загальне (любов, повага). Конкретне для ТЕБЕ.»\n\n8. **Юрій робить**: 3-5 речень з конкретикою.\n\n9. **Я кажу**: «Дякую. Тепер у тебе є три точки: де ти зараз, що тебе сюди привело, що ти хочеш транслювати. Це — каркас твоєї майбутньої історії за Аркою Героя. Хочеш переходити до повної Арки (ex-07), чи спочатку доопрацюємо ці три відповіді?»\n\n10. **Юрій робить**: рішення.",

    "mistakes": "- ❌ Юрій пише «брендовану» позицію (як на сайті, у LinkedIn). Запитати: «А що ти про себе знаєш, чого на сайті немає?»\n- ❌ Питання 2 — «у мене не було кризи». Майже завжди є — переформулювати: «А що було найбільшим challenges-моментом?»\n- ❌ Цінності формулюються як іменники (любов, повага, дружба). Денис цитує **Олега Чабана** [C-l05-029]: цінності — це дієслова. Переписати в дієсловах: «любити», «поважати», «дружити» — або ще конкретніше «бути присутнім», «дотримуватися слова».\n- ❌ Юрій намагається відповісти за 2 хвилини (галопом). Запросити: «Це фундамент, дай собі 10-15 хв. Можна повернутися завтра.»\n- ❌ Пропустити підпитання (б) в Питанні 1 — як хочеш, щоб тебе сприймали. А це часто розкриває розрив між «маю» і «хочу».",

    "instruction": "Це коротка медитативна заставка перед роботою з власною історією. Я веду голосом-провідником, паузи 3-5 сек між фразами.\n\n1. **Я кажу Юрію**: «Перед тим, як писати свою Арку Героя, давай налаштуємось. 2-3 хвилини. Сядь зручно, можеш закрити очі.»\n\n2. **Юрій робить**: налаштовується.\n\n3. **Я кажу** (пауза 3 сек): «Зроби 2-3 глибокі вдихи-видихи. Спокійно, без зусиль. Видих трохи довший за вдих.»\n\n4. **Юрій робить**: дихає (15-30 сек).\n\n5. **Я кажу** (пауза 3 сек): «А тепер — уяви, що твоє життя — це фільм. Великий, повний, твій. Він йде вже багато років. У ньому багато сцен.»\n\n6. **Я кажу** (пауза 5 сек): «І зараз ми знайдемо ту сцену, з якої почнеться твоя історія. Це може бути сцена твого життя в цілому. А може — сцена з конкретного періоду, який стосується конкретної кризи, конкретної трансформації, через яку ти пройшов.»\n\n7. **Я кажу** (пауза 10 сек): «Просто бачи ту сцену, що приходить. Не обирай раціонально. Перша, яка з'являється у пам'яті — і є та.»\n\n8. **Юрій робить**: бачить сцену (30-60 сек тиші).\n\n9. **Я кажу**: «Коли побачив — м'яко відкрий очі. І перш ніж ми перейдемо до написання — скажи мені одним реченням: яку сцену ти побачив? Який період? Що відбувається у тій сцені?»\n\n10. **Юрій робить**: 1-3 речення опис сцени.\n\n11. **Я кажу**: «Чудово. Це — точка, з якої почнемо твою Арку Героя. Готовий перейти до повної структури (ex-07)?»\n\n12. **Юрій робить**: рішення.",
    "criteria": "- [ ] Юрій реально провів дихання (3+ цикли, не пропустив «бо «знає»»)\n- [ ] У описі сцени є КОНКРЕТИКА — місце, рік (приблизно), хто там, що відбувається\n- [ ] Сцена не «логічно вибрана» з кар'єрного шляху, а саме спливла перша (часто — це не та, яку Юрій очікує)\n- [ ] Час укладається в 2-4 хв (це не повноцінна медитація)\n- [ ] Після — є відчуття зануреності, готовності писати (не «о, ще треба думати»)",
    "mistakes": "- ❌ Пропустити дихання («у мене вже спокійно»). Денис підкреслює: дихання — не для спокою, для переходу зі стану «голова» в стан «тіло».\n- ❌ Юрій раціонально обирає «правильну» сцену зі своєї біографії. Звернути увагу: «Перша, що спливла, не та що вирахував».\n- ❌ Затягнути медитацію на 10+ хвилин. Це warmup, не глибока внутрішня робота. Хочемо тільки знайти точку входу.\n- ❌ Не запитати у Юрія, що він побачив — перейти одразу до писання. Без вербалізації сцена «вислизає».\n- ❌ Робити цю вправу окремо від ex-07 (Арки Героя) — вона має сенс саме як вступна, не самостійна.",
    "adaptations": "- **Текст**: Юрій пише «Зробив дихання. Побачена сцена: …». Я перевіряю на конкретику.\n- **Голос (Wispr/audio)**: слухаю темп опису сцени. Якщо повільно, з образами — добре. Якщо швидко, «правильно» структуровано — ймовірно з голови, не з пам'яті. Запросити: «Закрий очі ще раз — що дійсно спливло першим?»\n- **Відеозапис**: не критично. Якщо є — дивлюся на стан тіла (розслаблений vs напружений) — індикатор переходу у стан тіла.",
    "verbatim": "> \"Дві хвилини, давайте виділимо на це і настроїмося. Можете закрити очі, зробити два-три глибокі вдохи-видохи. І уявіть, що ваша життя – це фільм. І прямо зараз ми знайдемо ту сцену, з якої починається ваша історія.\" — [video 01:59:33]\n\n> \"Це може бути як ваша історія в цілому, ваша життя, так і історія якогось конкретного життєвого періоду, який стосується якогось конкретного кризу, конкретної трансформації.\" — [video 02:00:00]"
  },

    "meta": "Написати готову робочу версію особистої історії для виступу — 5-8 хв за 7-пунктною структурою Арки Героя. Це КОРОВА вправа уроку, ядро всієї методології. На неї опираються всі подальші вправи (ex-09 парний переказ, ex-10 5 повторів на камеру).",
    "instruction": "Це довга вправа — 30-45 хв. Я веду Юрія через 7 пунктів послідовно, ставлю наводящі питання, прошу конкретику. Якщо Юрій блокується — нагадую про lifehack 10-хвилинного таймера (C-l05-093).\n\n**ПЕРЕДУМОВА**: бажано спочатку зробити ex-06 (медитативне налаштування) і ex-05 (3 підготовчі запитання). Якщо вони готові — використовуємо їхні відповіді як сировину.\n\n1. **Я кажу Юрію**: «Зараз ми напишемо твою Арку Героя — повну особисту історію за 7 пунктами. Це робоча версія для виступу. Тривалість підсумкової історії — 5-8 хв. Працюватимемо ~30-40 хв. Готовий?»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу**: «Спочатку обери тему. Денис рекомендує брати не одну, а 2-3 теми, і з них — найстидніші, найболючіші. Бо вони найтерапевтичніші і найсильніше резонують. Яка тема в тебе зараз на серці?»\n\n4. **Юрій робить**: називає тему (можливо 1, можливо 2-3 варіанти).\n\n5. **Я кажу** (якщо 2-3): «Обери одну з них для зараз. Інші запишемо в чергу.»\n\n6. **Я кажу**: «Тепер — 7 пунктів структури. Я задам кожен послідовно, ти пишеш / надсилаєш по 2-5 речень з КОНКРЕТНИМИ прикладами. Без перфекціонізму, як виходить. Не зупиняйся, якщо не знаєш що писати — пиши \"не знаю що писати\" і продовжуй. Готовий?»\n\n7. **Я кажу**: «**Пункт 0 — Зараз я.**\n   Хто ти зараз? Які регалії, експертність, що зараз можеш, чого не можеш. (Цей пункт опційний — можна почати одразу з Пункту 1 «так було не завжди».)»\n\n8. **Юрій робить**: пише пункт 0.\n\n9. **Я кажу**: «**Пункт 1 — Хто я був \"до\" / так було не завжди.**\n   Якою людиною ти був до тих подій? У яких звичках, у якому стані, з якими переконаннями? Конкретний приклад: 1 річення про спосіб життя, 1 річення про головне переконання тоді.»\n\n10. **Юрій робить**: пише пункт 1.\n\n11. **Я кажу**: «**Пункт 2 — Що зламалось / перестало працювати.**\n    Що було тією кризою, тією тріщиною, тим болем? Конкретна подія чи внутрішнє відчуття. Не «я зрозумів, що щось не так» — а конкретно ЩО.»\n\n12. **Юрій робить**: пише пункт 2.\n\n13. **Я кажу**: «**Пункт 3 — Чому я чинив опір змінам.**\n    Які страхи, переконання, сумніви тримали тебе на старому місці? «Боявся втратити X», «вірив у Y», «не хотів визнати Z».»\n\n14. **Юрій робить**: пише пункт 3.\n\n15. **Я кажу**: «**Пункт 4 — Що мене розвернуло.**\n    Який інсайт, який наставник, яка зустріч, яке слово, яка подія, який вибір? Конкретно — людина, фраза, ситуація. Не «я зрозумів» — а ЩО саме змусило зрозуміти.»\n\n16. **Юрій робить**: пише пункт 4.\n\n17. **Я кажу**: «**Пункт 5 — Який шлях я пройшов.**\n    Які дії, які рішення, які внутрішні кроки тобі довелося зробити? А, Б, В — 3-5 конкретних кроків. Не «я почав працювати над собою» — а конкретно як.»\n\n18. **Юрій робить**: пише пункт 5.\n\n19. **Я кажу**: «**Пункт 6 — Що тепер я можу дати людям.**\n    Який дар, цінність, результат, продукт ти зараз можеш дати? Це твоя точка Б — і це твій оффер слухачу. У форматі «Я можу дати тобі: А, Б, В».»\n\n20. **Юрій робить**: пише пункт 6.\n\n21. **Я кажу**: «Дякую. Тепер — давай перечитаю те, що ти написав, і дам фідбек по структурі.»\n\n22. **Я роблю**: перевіряю по чек-листу:\n\n- [ ] Пункт 1 містить КОНКРЕТИКУ (звичка, стан, переконання)\n- [ ] Пункт 2 — конкретна точка зламу (не «настав час»)\n- [ ] Пункт 3 — назвав хоча б 1-2 страхи/переконання своєю мовою\n- [ ] Пункт 4 — назвав КОНКРЕТНУ людину/подію (не «зустріч із самим собою» якщо це не справді так)\n- [ ] Пункт 5 — 3+ конкретних кроки (не «йшов у терапію»)\n- [ ] Пункт 6 — конкретні дари, не «допомагаю людям»\n- [ ] Загальний обсяг 600-1200 слів (це ~5-8 хв у живому розповіданні)\n\n23. **Я кажу**: «Ось фідбек: …». Конкретно по кожному пункту — що сильно, де додати конкретики.\n\n24. **Я кажу**: «Тепер — варіанти подальшої роботи: (а) одразу йти у ex-09 (парний переказ) — потрібен партнер; (б) одразу йти у ex-10 (5 повторів на камеру) — само-репетиція; (в) зачекати день, перечитати, посилити конкретику. Що обираєш?»\n\n25. **Юрій робить**: вибирає.",
    "criteria": "- [ ] Усі 7 пунктів написані (а не «я перейшов одразу до 6»)\n- [ ] У кожному пункті є хоча б 1 конкретний приклад/ім'я/деталь\n- [ ] Пункт 1 і Пункт 0 (або один з них) задають «світ до»\n- [ ] Пункт 4 містить трігер (людину, подію, фразу), а не абстракт «настала криза»\n- [ ] Пункт 6 — конкретний оффер, не «допомагаю людям знаходити себе»\n- [ ] Дельта між Пунктом 1 і Пунктом 6 — реальна (це і є Арка)\n- [ ] Обсяг 600-1200 слів",
    "mistakes": "- ❌ Юрій пише історію як CV — список досягнень без внутрішньої дельти. Нагадати: «Це Арка — потрібна ВНУТРІШНЯ зміна, не зміна посад».\n- ❌ Пропустити Пункт 3 (опір змінам) — а саме він робить історію людською. Запитати: «А чому ти НЕ робив зміну раніше? Що тримало?»\n- ❌ Пункт 4 = «я просто зрозумів». Майже завжди є конкретний trigger — пошукати: книга, фраза близького, побачена сцена, втрата.\n- ❌ Пункт 5 формулюється як «я почав працювати над собою» — пусто. Потрібні А, Б, В: пішов у терапію (до кого?), почав читати (що?), почав щодня (що робити?).\n- ❌ Пункт 6 — занадто загальне «допомагаю людям бути собою». Запросити конкретики: «Які саме твої клієнти? Який саме формат? Як виглядає твій оффер?»\n- ❌ Юрій пише «гладко», без болю — обходить Пункт 2. Денис прямо: чим стидніше — тим краще резонує (C-l05-099). Запитати: «А що було по-справжньому боляче? Можеш не редагувати — потім доопрацюємо.»\n- ❌ Закінчити після Пункту 6 без фідбеку. Завжди ставимо перевірку по чек-листу.",
    "adaptations": "- **Текст**: Юрій надсилає 7 пронумерованих абзаців. Я перевіряю кожен по чек-листу.\n- **Голос (Wispr/audio)**: якщо Юрій надсилає аудіо — слухаю чи змінюється тон по пунктах (1 і 2 — описовий, 4 — з вдиханням, 6 — твердий/впевнений). Якщо все одним тоном — це індикатор що Арка ще не «своя», читається з листа.\n- **Відеозапис**: не критично для написання, але ВАЖЛИВО для подальших ex-10 (5 повторів на камеру). Зараз можна аудіо.",
    "verbatim": "> \"Третій пункт – це, якими ви були до, або, як зараз модно в блогі, так було не завжди, якими ви були до, яким людинам, з якими звичайами, в якому стані, що вийшло, що не вийшло і так далі. Третій пункт – це, що зламалося, що перестало працювати, тобто конфлікт, після якого вже не можна продовжувати, як раніше.\" — [video 01:48:24]\n\n> \"Арка Героя - це зміни, через які проходить персонаж в історії. На початку арки і в кінці герой буде відрізнятися, оскільки відбулася внутрішня зміна на основі пережитого. 0 Зараз я…. 4 Що мене развернуло? ... 5 Який шлях я пройшов? ... 6 Що тепер я можу дати людям?\" — [slide 33]\n\n> \"Ось виберіть 2-3 теми, 2-3 історії. Желательно ті, які вам стидніше розповісти, за які ви більше всього боїтеся.\" — [video 02:22:34]"

    "meta": "На прикладі однієї і тієї ж фрази відчути різницю між «текстом» і «станом». Аудиторія миттєво зчитує НЕ слова, а підтекст — енергію, бажання, стан. Це базова вправа з акторського майстерства, яка демонструє ключовий принцип уроку: «Оратор — це той, хто передає СТАН» (C-l05-061).",
    "instruction": "Це вправа для голосу/аудіо. Я задаю фразу + 4 стани, Юрій вимовляє у кожному стані. Потім — порівнюємо.\n\n1. **Я кажу Юрію**: «Зараз ми зробимо класичну вправу з акторського. Одну і ту ж фразу скажеш 4 рази — у 4-х різних станах. Між словами нічого не змінюється. Між станами — все. Готовий? Знадобиться можливість записати аудіо (можеш Wispr або відео).»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу**: «Фраза: **«Мені потрібна допомога»**. (Можна замінити на «Не підкажете, який зараз час?» або «Привіт, як справи?» — за бажанням.) Скажи її 4 рази, з паузою 3-5 сек між. Кожен раз — у новому стані.»\n\n4. **Я кажу**: «**Стан 1 — БЕЗ ЕМОЦІЇ, ЛОГІЧНО.** Просто констатуєш факт. Як читаєш заголовок у газеті. Скажи.»\n\n5. **Юрій робить**: вимовляє фразу (audio/video).\n\n6. **Я кажу**: «**Стан 2 — ЗІ СТРАХОМ І ВРАЗЛИВІСТЮ.** Так, ніби ти зараз справді запутався, не знаєш що далі, тобі дуже потрібна допомога. З ранімістю, з полу-жалістю.»\n\n7. **Юрій робить**: вимовляє.\n\n8. **Я кажу**: «**Стан 3 — З УПЕВНЕНІСТЮ.** Так, ніби ти знаєш чого хочеш, відверто запитуєш, без стиду, без знижених інтонацій. Як рівний до рівного.»\n\n9. **Юрій робить**: вимовляє.\n\n10. **Я кажу**: «**Стан 4 — З ВДЯЧНІСТЮ.** Так, ніби ти вже отримав цю допомогу, або наперед вдячний. Тепло, м'яко, відкрито.»\n\n11. **Юрій робить**: вимовляє.\n\n12. **Я кажу**: «Дякую. Тепер прослухай свої 4 версії підряд. Підтвердь — чи відчуваєш сам різницю? Чи всі 4 звучать однаково?»\n\n13. **Юрій робить**: прослуховує, дає self-фідбек.\n\n14. **Я кажу**: «Тепер мій фідбек: …». Я даю конкретику по кожному з 4-х станів — що в голосі, темпі, інтонації відрізнялося / було однаковим.\n\n15. **Я кажу**: «Висновок Дениса: «Ви почули не текст. Ви почули стан людини». Це — основа того, що оратор передає СТАН, а не слова. Якщо твої 4 версії звучать одинаково — це сигнал, що стан \"застряг\" і потребує розшарування.»",
    "criteria": "- [ ] Усі 4 версії записані як окремі дублі (з паузами між)\n- [ ] У версіях 2 і 3 — реально протилежні енергії (НЕ обидві з невпевненістю)\n- [ ] Темп: версія 1 — нейтральна, версія 2 — повільніше або переривчасто, версія 3 — рівна/тверда, версія 4 — м'якша і повільніша\n- [ ] Тонна голосу змінюється помітно у кожній версії\n- [ ] Юрій сам зміг відрізнити стани при прослуховуванні (self-фідбек збіглося з моїм)",
    "mistakes": "- ❌ Юрій вимовляє всі 4 «театрально» з пафосом. Запросити: «Версія 1 — просто плоска констатація, без зусилля».\n- ❌ Версії 2 і 3 звучать схоже — обидві з невпевненістю. Денис прямо: страх ≠ упевненість, це протилежні стани. Перезаписати версію 3.\n- ❌ Версія 4 (вдячність) забуває включити тіло — вимовляється раціонально. Запропонувати: «Уяви що ти подяку обіймом передаєш».\n- ❌ Слова змінюються між версіями («Мені дуже потрібна твоя допомога» замість «Мені потрібна допомога»). Не критично, але рекомендую дотримуватися тієї самої фрази — щоб різниця була тільки у стані.\n- ❌ Юрій робить вправу подумки, без запису. Тоді self-фідбек неможливий. Просити: «Запиши Wispr — і ми разом послухаємо».",
    "adaptations": "- **Текст**: не працює. Це вправа на голос — НЕ робити текстом.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ формат. Слухаю 4 версії окремо. Перевіряю темп (BPM приблизно), діапазон інтонацій, додатки (видих перед/після, паузи).\n- **Відеозапис**: бонусний рівень. Якщо є відео — дивлюсь на мімику і тіло. Часто версія 2 (страх) активує плечі вгору, версія 3 (упевненість) — рівні плечі, прямий погляд, версія 4 (вдячність) — м'який погляд, легка посмішка.",
    "verbatim": "> \"Скажіть одну фразу: «Мені потрібна допомога» 1 Без емоції, логічно. 2 Із страхом та вразливістю. 3 З упевненістю. 4 З вдячністю. Аудиторія миттєво відчує 4 різні світи. Хоча слова НЕ змінилися. Висновок: «Ви почули не текст. Ви почули стан людини.»\" — [slide 45]\n\n> \"Звичайно ми говоримо одну і ту ж фразу, можливо я зараз не дуже добре по-актерськи це все зіграв, одна і та ж фраза, але це абсолютно різна енергія під цією фразою.\" — [video 02:13:01]"

    "meta": "Перевірити свою Арку Героя (ex-07) на реальному слухачі. Отримати конкретний структурований фідбек по 6 пунктах чек-листа — чи був «світ до» зрозумілий, чи прозвучав поворотний момент, чи трансформація була живою. Це обов'язковий перехід між «написав на папері» (ex-07) і «відрепетував на камеру» (ex-10). Денис: 20-25 хв на пару, виконати в найближчі 2-3 дні після написання.",
    "instruction": "Ця вправа потребує ПАРТНЕРА. Якщо я (coach-agent) у ролі партнера-слухача — я імітую роль і даю фідбек по чек-листу. Якщо Юрій працює з реальною людиною — я тоді координатор: даю інструкцію партнеру і пересилаю чек-лист.\n\n**Сценарій А — я виступаю партнером-слухачем для Юрія:**\n\n1. **Я кажу Юрію**: «Зараз я буду в ролі твого партнера-слухача. Розкажи мені свою Арку Героя голосом — як на сцені. 5-8 хвилин. Я не перериватиму. Після — дам фідбек по 6-пунктному чек-листу слухача.»\n\n2. **Юрій робить**: розповідає Арку Героя (audio/video).\n\n3. **Я роблю** (мовчки під час): фіксую для себе по 6 пунктах чек-листа:\n   - (1) Чи був мені зрозумілий «світ ДО»?\n   - (2) Чи я відчув кризу?\n   - (3) Чи було ясно, у чому був страх?\n   - (4) Чи я почув поворотний момент?\n   - (5) Чи трансформація була живою, не абстрактною?\n   - (6) Чи дар прозвучав чітко?\n\n4. **Я кажу** (після завершення): «Дякую. Тепер мій фідбек по чек-листу слухача. По кожному пункту — мій конкретний відгук, не \"так/ні\", а ЩО саме я почув або не почув.»\n\n5. **Я роблю**: проходжу по 6 пунктах послідовно:\n   - «(1) Світ ДО — почув: …. / Не почув: ….»\n   - «(2) Криза — почув / не почув. Якщо ні — конкретно: я не зрозумів, ЩО саме було тією кризою.»\n   - … і так далі до (6).\n\n6. **Я кажу**: «Загальне враження: …». Одне-два речення про emotional impact.\n\n7. **Я кажу**: «Тепер давай поміняємось — якщо хочеш, я розповім тобі свою імпровізовану історію (не для серйозного фідбеку, а просто щоб ти теж побув у ролі слухача — це інший досвід).»\n\n8. **Юрій робить**: вибирає.\n\n9. **Я кажу**: «На основі цього фідбеку — переходь до ex-10 (5 повторів на камеру). Або зачекай день, перепиши слабкі пункти, і потім.»\n\n**Сценарій Б — Юрій працює з реальним партнером (інша людина):**\n\n1. **Я кажу Юрію**: «У вас з партнером 20-25 хв на пару. Один розповідає, інший слухає мовчки. Потім слухач дає фідбек за чек-листом. Потім міняєтеся ролями.»\n\n2. **Я надсилаю** Юрію інструкцію для партнера + 6-пунктний чек-лист (як окремий текст).\n\n3. **Я кажу**: «Після парного фідбеку напиши мені — що партнер сказав по кожному з 6 пунктів. Я допоможу опрацювати.»\n\n4. **Юрій робить**: проводить парний сеанс.\n\n5. **Юрій робить**: надсилає підсумок фідбеку.\n\n6. **Я кажу**: «Тепер на основі цього — підсилюємо слабкі пункти. Конкретно: що в пункті X треба переписати?»",
    "criteria": "- [ ] Юрій розповів Арку Героя голосом (не читав з листа, не текстом)\n- [ ] Я зміг написати фідбек по ВСІХ 6 пунктах чек-листа конкретно (не «все ок»)\n- [ ] У 4-5 із 6 пунктів — я почув що очікувалося (якщо в 3+ не почув — Арка потребує перероблення)\n- [ ] Тривалість оповідання 5-8 хв (не 2 хв, не 15)\n- [ ] Юрій НЕ виправдовував Арку у відповідь на фідбек, а почув його\n- [ ] Є конкретна наступна дія (переписати пункт X, перейти до ex-10, тощо)",
    "mistakes": "- ❌ Юрій читає Арку з листа замість розповідати. Денис підкреслює: розповідати, не читати. Якщо читає — слухач почує текст, не стан.\n- ❌ Coach (я) дає загальне «класно!» замість конкретного фідбеку по 6 пунктах. Чек-лист — це конкретна tool. Денис прямо: 6 нумерованих пунктів.\n- ❌ Юрій починає виправдовуватися «ні, я хотів сказати, що…» — а слухач почув що почув, це і є feedback. Запросити: «Запиши що слухач почув, не виправдовуйся. Це сировина для покращення.»\n- ❌ Пропустити цей крок і піти одразу до ex-10 (5 повторів на камеру). Без зовнішнього вуха легко закріпити сліпу зону.\n- ❌ Партнер під час розповіді коментує / перериває. Інструкція: слухати мовчки, фідбек тільки після завершення.\n- ❌ Перетягувати парне заняття на 1+ годину. 20-25 хв на пару — максимум, інакше втрачається свіжість фідбеку.",
    "adaptations": "- **Текст**: працює як перехідна форма, якщо немає можливості аудіо. Юрій пише історію текстом, я прочитую і даю фідбек по 6 пунктах. Але це слабша адаптація — слухати краще ніж читати.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ формат для цієї вправи. Слухаю інтонації, паузи, темп — те, що не передає текст.\n- **Відеозапис**: бонус. Якщо є — додатково оцінюю мову тіла (відкритість vs закритість при відверто кризових моментах).",
    "verbatim": "> \"Один розповідає — другий слухає і дає зворотний зв'язок за чек-листом. Чек-лист слухача: Зрозуміло, яким був «світ до»? Я відчув кризу? Було ясно, у чому був страх? Я почув поворотний момент? Трансформація була живою, не абстрактною? Дар прозвучав чітко?\" — [slide 48]\n\n> \"Буквально вам треба для цього зазвону 20-25 хвилин, щоб в одну історію розповісти, отримати поверну зв'язку, і в іншу історію розповісти, отримати повертальну зв'язку.\" — [video 02:23:47]"

    "meta": "Перетворити написану Арку Героя (ex-07) + парний фідбек (ex-09) на робочу версію виступу. Через 5 повторів на селфі-камеру (без правок, без зупинок) — текст стає вашим, ви можете імпровізувати в межах структури. Це фінальний крок підготовки.",
    "instruction": "Ця вправа РОЗТЯГНУТА в часі — оптимально по 1 повтор на день, протягом 5 днів. Або компактно — 2-3 повтори в один день з паузами між. Я координую, не присутній у момент записи.\n\n**ПЕРЕДУМОВА**: бажано, щоб уже були готові ex-07 (текст Арки) + ex-09 (парний фідбек, історія переписана).\n\n1. **Я кажу Юрію**: «Зараз твоя задача — записати 5 повторів своєї історії на камеру. Перед цим — переписати її коротше, чесніше, сміливіше після парного фідбеку. Денис: жодних правок під час запису, жодних зупинок. Якщо забуваєш — продовжуй. 5 разів, 5-8 хв кожен. Готовий?»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу**: «Крок 1 — зжати/конкретизувати текст. Викинь \"лишнє\", залиш суть, найяскравіші приклади і образи. Перечитай і скороти на 20-30%. Готово?»\n\n4. **Юрій робить**: переписує (10-15 хв).\n\n5. **Я кажу**: «Крок 2 — налаштування простору для запису. Селфі-камера (телефон/комп). Місце з нейтральним фоном. Звук перевір. Готово?»\n\n6. **Юрій робить**: налаштовує.\n\n7. **Я кажу**: «**Повтор 1 — сьогодні.** Запиши історію від початку до кінця. Без зупинок. Якщо забуваєш — кажи \"забув що далі\" і йди далі. Не редагуй. 5-8 хв. Після — НЕ переглядай, не перезаписуй. Збережи цей файл. Готовий записати?»\n\n8. **Юрій робить**: записує Повтор 1.\n\n9. **Я кажу**: «Як було? Що відчув? (Без розбору якості — лише про процес.)»\n\n10. **Юрій робить**: 1-2 речення.\n\n11. **Я кажу**: «**Повтор 2 — завтра (або через 2-4 години).** Той самий протокол. Не переглядай Повтор 1 перед Повтором 2. Просто розкажи знову. Запиши.»\n\n12. **Юрій робить**: записує Повтор 2 у заплановий час.\n\n13. **Я кажу**: «Так само з Повторами 3, 4, 5. По одному на день (або 2-3 з паузами). Через 5 днів — у тебе буде 5 версій.»\n\n14. **Юрій робить**: записує всі 5.\n\n15. **Я кажу** (після завершення всіх 5): «Тепер — перегляньмо разом. Не дивись усі 5 поспіль (це довго). Подивись Повтор 1 і Повтор 5. Помічаєш різницю? Що змінилося — у темпі, у впевненості, у наповненні?»\n\n16. **Юрій робить**: дивиться 1 і 5, дає фідбек.\n\n17. **Я кажу**: «Тепер обери — який з 5 повторів буде твоєю робочою версією? Або, можливо, ти просто запам'ятав структуру і тепер можеш імпровізувати?»\n\n18. **Юрій робить**: вибирає.\n\n19. **Я кажу**: «Ця версія тепер у твоєму арсеналі. На будь-якому виступі ти можеш її розгорнути або стиснути за регламентом часу.»",
    "criteria": "- [ ] Усі 5 повторів записані (не 1-2 «бо вже норм»)\n- [ ] Тривалість кожного повтору 5-8 хв (не 2 хв, не 15)\n- [ ] У Повторі 5 видно різницю від Повтору 1: менше «е-е», менше пауз через забування, більше живої інтонації\n- [ ] Юрій НЕ переглядав Повтор N-1 перед Повтором N (це створило би перфекціонізм)\n- [ ] Юрій сам помітив дельту між 1 і 5 (це індикатор, що репетиція спрацювала)\n- [ ] Є чітка фінальна робоча версія, з якою Юрій готовий виходити на сцену",
    "mistakes": "- ❌ Записати один «ідеальний» повтор і вирішити «все, готово». Денис прямо: 5 разів, без правок. Сенс — у накопиченні внутрішнього темпу.\n- ❌ Робити правки між повторами («о, я тут забув, додам у текст»). НІ — кожен повтор окремий перформанс. Текст не змінюється.\n- ❌ Зупинятися посередині повтору («о, я заплутався, перезапишу»). Денис прямо: без зупинок. Сенс — тренування продовжувати при збоях, як на реальній сцені.\n- ❌ Пропустити крок порівняння Повтору 1 і Повтору 5. Без рефлексії дельти — Юрій не побачить власне зростання.\n- ❌ Чекати «надхнення» перед кожним повтором. Денис: «без перфекціонізму, як можете, як виходить». Просто робити.\n- ❌ Записати 5 повторів за 30 хвилин підряд. Втрачається сенс — потрібен час для «відстояння» між повторами. Краще на 2-5 днях.",

    "instruction": "Це швидка тілесна вправа. Я даю чітку покрокову інструкцію, Юрій виконує синхронно.\n\n1. **Я кажу Юрію**: «Зараз — швидке дихання перед сценою. 1-2 хвилини. 3 глибоких видихи + 3 спокійних вдихи, з ключовим принципом: видих ЗАВЖДИ довший за вдих. Готовий? Стань зручно (стоячи або сидячи рівно), руки вільно.»\n\n2. **Юрій робить**: налаштовується.\n\n3. **Я кажу**: «**Цикл 1.** Зроби глибокий видих — ротом або носом, як зручно, але повний, до кінця. Видихаємо 5-6 секунд. Тепер спокійний вдих носом — 3-4 секунди. Все.»\n\n4. **Юрій робить**: 1 цикл (видих 5-6 сек, вдих 3-4 сек).\n\n5. **Я кажу**: «**Цикл 2.** Знову — повний глибокий видих. Видих довший. І спокійний вдих.»\n\n6. **Юрій робить**: 2-й цикл.\n\n7. **Я кажу**: «**Цикл 3.** Останній. Найповніший видих з трьох. І останній спокійний вдих.»\n\n8. **Юрій робить**: 3-й цикл.\n\n9. **Я кажу**: «Дай тілу 5-10 секунд після — просто стоянка / сидіння в тиші. Не одразу починай говорити.»\n\n10. **Юрій робить**: 5-10 сек тиша.\n\n11. **Я кажу**: «Як ти зараз? Що змінилося в тілі / голові / диханні?»\n\n12. **Юрій робить**: 1-2 речення self-фідбек.\n\n13. **Я кажу**: «Це переключило тебе зі стану страху в стан зібраності. Якщо є час 1-2 хв до виступу — можна додати ex-01 (Оживлення сцени), там ще візуалізація і світло.»",

    "meta": "За 30-60 секунд зняти м'язові затиски, відкрити голос і дихання. Розігнати кортизол, який фігачить по тілу перед виступом. Тіло — інструмент оратора; затиснуте тіло = затиснутий голос.",
    "instruction": "4-зонна розминка + простукування тіла. Я веду по зонах, Юрій виконує синхронно. Можна стоячи або у вільному просторі.\n\n1. **Я кажу Юрію**: «Зараз — міні-розтяжка перед виходом. 30-60 секунд, 4 зони: шия, плечі, грудна клітка, щелепа. Плюс — простукати тіло. Це знімає затиски, відкриває голос. Стань зручно. Готовий?»\n\n2. **Юрій робить**: налаштовується.\n\n3. **Я кажу**: «**Зона 1 — Шия.** Повільно нахили голову вперед-назад 2-3 рази. Потім ліворуч-праворуч 2-3 рази. Без різких рухів, в комфортному діапазоні.»\n\n4. **Юрій робить**: 10-15 сек шия.\n\n5. **Я кажу**: «**Зона 2 — Плечі.** Підніми плечі до вух і опусти, 3-4 рази. Потім — кругові рухи плечима вперед і назад, по 3 кола в кожен бік.»\n\n6. **Юрій робить**: 10-15 сек плечі.\n\n7. **Я кажу**: «**Зона 3 — Грудна клітка.** Розведи руки в боки і трохи назад, відкриваючи груди. Дихни глибоко 2-3 рази у цій позі. Потім обніми сам себе — закриваючи грудну клітку. І знову розведи. Кілька разів.»\n\n8. **Юрій робить**: 10-15 сек груди.\n\n9. **Я кажу**: «**Зона 4 — Щелепа.** Відкрий рот максимально широко, потім стисни щелепу. 3-4 рази. Потім порухай щелепою ліворуч-праворуч. Кругові рухи нижньою щелепою. Це часто найзатисненіша зона у спікерів.»\n\n10. **Юрій робить**: 10-15 сек щелепа.\n\n11. **Я кажу**: «**Бонус — Простукати тіло.** Долонями постукай по грудях, плечах, рукам — як «оживлюєш» тіло. 10-15 секунд.»\n\n12. **Юрій робить**: простукування.\n\n13. **Я кажу**: «Готово. Як зараз тіло? Помічаєш зміну?»\n\n14. **Юрій робить**: 1-2 речення.",
    "criteria": "- [ ] Усі 4 зони пройдено (не пропущена щелепа — вона найважливіша для голосу)\n- [ ] Простукування зроблено (опційно, але дуже корисно)\n- [ ] Загальна тривалість 30-90 сек (не 5 сек, не 5 хв)\n- [ ] У self-фідбеку Юрій згадує тілесну зміну (легше дихати / плечі опустилися / щелепа розслабилася)\n- [ ] Рухи без болю, у комфортному діапазоні",

    "adaptations": "- **Текст**: Юрій пише «Зробив 4 зони. Стан: …». Достатньо.\n- **Голос (Wispr/audio)**: не потрібно — це тіло, не голос. Хіба що Юрій коментує паралельно.\n- **Відеозапис**: ідеальний формат. Бачу чи реально були рухи, чи це 5-секундна імітація.",
    "verbatim": "> \"3 Міні-розтяжка 30–60 секунд. Шия, плечі, грудна клітка, щелепа. Простукати тіло. Знімає затиски, відкриває голос і дихання.\" — [slide 52]\n\n> \"Також, коли у нас кортизол по тілу фігачить, ви можете його розмінати, присідати, якось прохлопати, потягнутися, збросити якісь зажими. Не вирішує в корінь проблему страху публічних виступлень проявленості, але, по крайній мере, в моменті ви трохи можете розгнати енергію, уші пом'ять, мочку там якось, щось тут зробити. Не замикайтеся, дайте тілу життя, дайте тілу рухання.\" — [video 02:39:23]"

    "meta": "При виступі перед групою / у великому залі (особливо коли прожектор не дозволяє бачити обличчя) — створювати ефект «персонального зв'язку з кожним» через систематичне переміщення погляду по трьох точках: лівій, центральній, правій.",
    "instruction": "Це техніка-навичка для тренування. Я даю інструкцію + кейс для проти-тренування (з імітацією аудиторії). Можна тренувати окремо або вбудувати в репетицію Арки Героя (ex-10).\n\n**ВАРІАНТ А — окрема тренувальна сесія:**\n\n1. **Я кажу Юрію**: «Зараз — техніка зорового контакту. У великому залі / при прожекторі ти не бачиш обличчя. Правило Дениса: один погляд зліва, один у центрі, один справа. Поглядом переміщайся між цими трьома точками. Створюється ефект, ніби ти спілкуєшся з кожним. Натренуємось.»\n\n2. **Я кажу**: «Уяви, що перед тобою — зал на 100 людей. Постав уявно три точки в просторі: одну ліворуч (на ~30°), одну прямо перед собою (центр), одну праворуч (на ~30°). Бажано трохи вище горизонту — щоб погляд не падав на «перші ряди», а охоплював всю глибину залу.»\n\n3. **Юрій робить**: візуалізує / встановлює точки.\n\n4. **Я кажу**: «Тепер — почни говорити будь-який текст. Будь-яку 30-секундну розповідь. Під час говоріння переміщай погляд: 5-7 секунд на лівій точці, 5-7 секунд у центрі, 5-7 секунд на правій. І знову зліва. Поговори 1-2 хвилини.»\n\n5. **Юрій робить**: говорить + переміщає погляд.\n\n6. **Я кажу** (якщо є відео): «Тепер подивись запис. Помічаєш, як ти переміщав погляд? Чи плавно, чи стрибками? Чи рівномірно за часом?»\n\n7. **Юрій робить**: дивиться, self-фідбек.\n\n**ВАРІАНТ Б — вбудовано в репетицію Арки Героя:**\n\n1. **Я кажу Юрію**: «Цього разу при репетиції Арки Героя (ex-10) — додай елемент зорового контакту. Уяви 3 точки: ліво / центр / право. Під час розповіді — переміщай погляд між ними, орієнтовно 5-7 сек на кожній. Не рахуй секунди — просто природно гуляй поглядом.»\n\n2. **Юрій робить**: проводить ex-10 з цим додатком.\n\n3. **Я кажу** (після відео): «Подивись запис. Тепер дві речі: (1) чи витримана структура Арки Героя, (2) чи був зоровий контакт по 3 точках. Дай self-фідбек.»",
    "criteria": "- [ ] Юрій реально перемістив погляд між 3 точками (не «прилип» до однієї)\n- [ ] Час на кожній точці плюс-мінус рівний (не 30 сек на одній, 2 сек на іншій)\n- [ ] Погляд НЕ блукає хаотично (це не природний контакт — це індикатор тривоги)\n- [ ] Погляд НЕ падає на стелю / підлогу (Денис прямо забороняє: «не в потолок, не в пол»)\n- [ ] При використанні в ex-10: зоровий контакт не порушив потоку розповіді\n- [ ] У self-фідбеку Юрій бачить різницю між «звичайним» і «з 3-точковою системою»",
    "mistakes": "- ❌ Дивитися весь час в один бік (часто в напрямок камери). Це звужує контакт до 30% залу.\n- ❌ Стрибати поглядом хаотично — індикатор тривоги. Має бути «гуляюче» спокійне переміщення.\n- ❌ Зменшити час на кожній точці до 1-2 сек («бо я думаю про текст»). Тоді ефект зв'язку не виникає. 5-7 сек — мінімум.\n- ❌ Дивитися на стелю «бо там світло». Денис прямо забороняє — і пол.\n- ❌ Додавати у момент виступу, без репетиції. Тоді мозок не справляється паралельно з текстом + контактом. Спочатку — окрема тренувальна сесія.",
    "adaptations": "- **Текст**: не працює — це візуальна техніка, тільки відео.\n- **Голос (Wispr/audio)**: майже не працює. Можна почути паузи коли Юрій «загубив» думку при переміщенні погляду.\n- **Відеозапис**: ОБОВ'ЯЗКОВИЙ формат. Без відео техніку оцінити неможливо.",
    "verbatim": "> \"8 Встанови зоровий контакт із трьома людьми. Один справа, один у центрі, один зліва. Так створюється ефект зв'язку з усім залом.\" — [slide 53]\n\n> \"Дуже важливо, що ми дивимося не в потолок, не в пол, ми дивимося глядачу в очі. Якщо прожектор, ви нікого не бачите, один зліва, точка, один справа, один в центрі, трохи поверх залу, тоді стаєся ефект, що ви на зв'язку з усім залом, особисте присутнє.\" — [video 02:42:55]\n\n> \"У нас є на сцені таке правило, ми, як би, дивимося наліво, направо і посерединку. І так, дивовий контакт у нас переміщається, тому що, коли велика сцена, прожектор, особливо нікого не видно. І коли ви з дивовим контактом гуляєте сліва-направо, в центрі стає впечатлення, що ви особисто з кожним спілкуєтесь.\" — [video 53:25]"

    "meta": "Розблокувати написання історії, коли «не пишеться» — стихи фонять, проза не йде, голова пуста. Технічна вправа: 10 хв безупинного письма, договір з умом «не зупиняюся, навіть якщо пишу \"не знаю що писати\"». Запропонована Денисом як 4-й лайфхак конкретно учасниці Оксані, у якої були блоки.\n\n**ЦЯ ВПРАВА НЕ БУЛА У PRELIMINARY** (preliminary_id: none) — Денис ввів її ad hoc у відповідь на питання учасниці. Але це повноцінна standalone-вправа, тому додано як ex-14.",
    "instruction": "Це самостійна письмова вправа з простим таймером. Я даю інструкцію, Юрій робить, потім ділимось результатом.\n\n1. **Я кажу Юрію**: «Якщо Арка Героя (ex-07) не пишеться — застрягаєш, в'ялий, нудно, голова порожня — використай лайфхак Дениса. 10-хвилинний таймер. Жодних правил, крім одного: НЕ ЗУПИНЯТИСЯ. Готовий?»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу**: «Підготовка. Візьми листик і ручку (або порожній doc на комп'ютері — це менш ефективно, ручка краще). Вимкни ВСІ відволікальні фактори. Сповіщення off. Закрий вкладки. На стіл нічого не клади крім листа.»\n\n4. **Юрій робить**: налаштовує простір.\n\n5. **Я кажу**: «Договір зі своїм умом — проголоси його вголос або про себе: \"Я 10 хвилин не займаюся нічим іншим. Я пишу тільки текст. Я не зупиняюся. Якщо я не знаю, що писати — я так і пишу: «не знаю що писати, не знаю що писати», поки не прийдуть інші слова. Таймер запиликав — все, я виходжу. До тих пір — не виходжу.»\n\n6. **Юрій робить**: погоджується / проголошує.\n\n7. **Я кажу**: «Постав таймер на 10 хвилин. Тема — твоя Арка Героя (або один конкретний пункт). Кнопка \"Старт\". І пиши.»\n\n8. **Юрій робить**: пише 10 хвилин (мовчки, без коментарів мені).\n\n9. **Я кажу** (після того як Юрій повертається): «Таймер запиликав. Не редагуй те, що написав. Не оцінюй. Просто розкажи — скільки відсотків часу йшов потік, а скільки писав \"не знаю\"?»\n\n10. **Юрій робить**: коротка оцінка («70% потік / 30% не знаю», або «50/50»).\n\n11. **Я кажу**: «Тепер прочитай мені те, що написав (або перешли тексту). Якщо там є зерна для Арки Героя — виділимо їх. Якщо це чистий потік без структури — це теж сировина, з якої можна почати.»\n\n12. **Юрій робить**: ділиться написаним.\n\n13. **Я роблю**: швидко сканую — підкреслюю ті фрагменти, які можна вставити у конкретні пункти Арки Героя (ex-07).",
    "criteria": "- [ ] Юрій реально витримав 10 хв (не зупинився на 3-й хвилині)\n- [ ] У тексті є хоча б 30% «потоку» (не 100% «не знаю що писати»)\n- [ ] Юрій НЕ редагував під час писання\n- [ ] У сировинному тексті знайдено хоча б 1-2 фрагменти для Арки Героя\n- [ ] Після — стан «розблокувався», є енергія продовжувати",
    "mistakes": "- ❌ Зупинитися на 3-5 хв «бо нічого не пишеться». Денис прямо: ДО ТАЙМЕРА не зупиняєшся. Сенс саме у проживанні мертвої зони.\n- ❌ Редагувати під час писання («о, не так сказав, перепишу»). Це включає внутрішнього критика і блокує потік. Тільки після таймера.\n- ❌ Працювати на комп'ютері з відкритими вкладками. Сповіщення, перевірка пошти — таймер прерваний.\n- ❌ Не написати «не знаю що писати» — а просто сидіти і думати. Це порушує договір. Денис прямо: ПИШИ навіть фразу «не знаю».\n- ❌ Очікувати «гідний результат» за 10 хв. Сенс не у гідному результаті — а у розблокуванні.\n- ❌ Робити вправу регулярно як заміну Арці Героя. Це разовий unlock-tool. Після — повертаєшся до ex-07.",

    "verbatim": "> \"ви берете листик, ви берете ручку, і ви виключаєте всі відвіляючі фактори. І ви ставите таймер, наприклад, на 10 хвилин. Слухайте всі, будь ласка, це важливо. Ви ставите таймер на 10 хвилин і договарюєтеся зі своїм умом. Я 10 хвилин не займаюся нічим іншим, я пишу тільки текст. Я не зупиняюся. Якщо я не знаю, що писати, я так і пишу. Не знаю, що писати, не знаю, що писати, але я не зупиняюся.\" — [video 02:58:25]"
