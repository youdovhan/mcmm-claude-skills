    "meta": "Натренувати базовий каркас виступу під 5-7 хвилин — від «привітання + хук» до «підсумок». Це універсальна структура для прямого ефіру, Reels, TEDx-формату, виступу на конференції. Юрій отримує 6-7 хвилин виступу на конкретну тему «закохати аудиторію у звичку/практику», а я веду його через всі 6 пунктів каркасу + фідбек за технікою «Бутерброд» ([exercises/ex-02.md]).",
    "instruction": "Це майстер-вправа уроку. Я не просто слухаю Юрія, я ВЕДУ його через підготовку (5-7 хв), потім приймаю виступ (6-7 хв), потім даю фідбек (1-2 хв).\n\n### Підготовка (5-7 хв)\n\n1. **Я кажу Юрію**: «Зараз ми натренуємо ядро ораторського — виступ 6-7 хвилин за структурою з 6 пунктів. Спочатку — вибір теми. Тобі треба влюбити аудиторію в одну корисну звичку або практику. Не вчити, не показувати експертизу — а вдохнути. Що це може бути для тебе? Назви одну.»\n\n2. **Юрій робить**: пропонує тему (наприклад: ранкові ритуали, читання книг, медитація, фізична активність, ведення щоденника).\n\n3. **Я кажу**: «Окей. Тепер контекст. Уявляємо що ти виступаєш на закритому MCMM-зборі. Це не TEDx з 1000 людей, не корпоратив у смокінгу. Це твої колеги, друзі-коучі. Формат — кежуал, аутентичний. Чи ОК такий контекст?»\n\n4. **Юрій робить**: підтверджує контекст або корегує (наприклад: «ні, я хочу для MAYSTERNYA — психологи»).\n\n5. **Я кажу**: «Тепер пройдемо 6 пунктів структури. Ти не пишеш повний текст, а робиш 1-2 речення на кожен пункт. Я зачитую — ти імпровізуєш у відповідь. (1) ПРИВІТАННЯ — щире, просте. Можеш додати хук — наприклад провокативне запитання, статистика, особиста історія в 1 фразу. Що скажеш?»\n\n6. **Юрій робить**: дає привітання + опційно хук.\n\n7. **Я кажу**: «(2) ТРИ ФАКТИ ПРО СЕБЕ. Або 3 факти не пов'язані з темою (кошка серого цвіта, переїзд 2 тижні тому), або 3 факти пов'язані з темою. Виберіть який варіант працює на твою тему — зазвичай related факти краще, але опційно. Назви.»\n\n8. **Юрій робить**: дає 3 факти.\n\n9. **Я кажу**: «(3) ПЛАН — чітке речення-анонс. Як «Я розкажу 3 секрети раннього пробудження» або «Ми розглянемо 1 практику + 2 ризики». Що скажеш?»\n\n10. **Юрій робить**: дає план одним реченням.\n\n11. **Я кажу**: «(4) ОСНОВНА ЧАСТИНА — метод/ідея + особиста історія. Це 60-70% часу. Тут треба сформувати ПОТРЕБИ ([C-l07-048]) перед тим, як піднести рішення. Розкачай біль, чому ця звичка важлива. Потім — рішення. Опиши за 30 секунд.»\n\n12. **Юрій робить**: дає основну частину коротко.\n\n13. **Я кажу**: «(5) ВЗАЄМОДІЯ З АУДИТОРІЄЮ — 1 питання. Не риторичне, а активне — «поставте лайки якщо у вас теж», «напишіть у чат». Яке буде питання?»\n\n14. **Юрій робить**: формулює питання.\n\n15. **Я кажу**: «(6) ПІДСУМОК — повтор плану в 1 реченні + кульмінація. Не просто «дякую за увагу», а сильна фраза, яка резюмує. Наприклад «Як казав мій вчитель — і це робить весь день інакше». Яка буде кульмінація?»\n\n16. **Юрій робить**: формулює кульмінацію.\n\n17. **Я кажу**: «Окей, тепер виступ. Засікаю 7 хвилин. Можеш читати з нотаток, можеш імпровізувати. Якщо читаєш — клади текст ближче до камери ([C-l07-008]). Я роблю засічку. Готовий?»\n\n### Виступ (6-7 хв)\n\n18. **Юрій робить**: виступає 5-7 хвилин (текст / аудио / відео).\n\n19. **Я роблю**: засікаю час, не перебиваю.\n\n### Фідбек (3-5 хв)\n\n20. **Я кажу**: «Виступ закінчено. Перш ніж я дам зворотний зв'язок — як ти зараз почуваєшся? НЕ що ти ДУМАЄШ, а що в тілі? ([C-l07-065])»\n\n21. **Юрій робить**: ділиться відчуттями (1-2 речення).\n\n22. **Я роблю**: фідбек за технікою «Бутерброд» (1-2 хвилини, див. [exercises/ex-02.md]). Структура: (1) ВИЗНАННЯ — 2-3 конкретні плюси, (2) ТОЧКА РОСТУ за формулою X→Y→Z, (3) ЗАКРІПЛЕННЯ — найсильніша сторона.",
    "criteria": "- [ ] Юрій пройшов усі 6 пунктів структури (нічого не пропустив)\n- [ ] Привітання + хук — є зачіп уваги в перші 20 секунд\n- [ ] 3 факти про себе — конкретні, не абстракції типу «я багато займався»\n- [ ] План — одне чітке речення «що нас чекає» (не «я розкажу про різне»)\n- [ ] Основна частина — є сформована потреба + рішення (не просто «робіть це»)\n- [ ] Взаємодія — реальне питання, не риторика\n- [ ] Кульмінація — є сильний фінал, не просто «дякую за увагу»\n- [ ] Тривалість 5-7 хв (не 3, не 10)\n- [ ] У тілі після виступу — є енергетична зарядка, не виснаження",
    "mistakes": "- ❌ Почати з оправдань ([C-l07-091]) — «я не готувався», «погано спав». Аудиторія не помітить, поки сам не озвучиш. Це знижує авторитет.\n- ❌ Перевантажити основну частину 5-7 пунктами ([C-l07-049]). На 7 хвилин — 2-3 пункти максимум.\n- ❌ Прочитати чужий GPT-текст без редагування ([C-l07-036]). Фрази «Це про це, це не те, це те» — банерна слепота, миттєво знижує авторитетність.\n- ❌ Не сформувати потребу перед закликом ([C-l07-048]). «Ось 3 секрети» без розкачаної болі — продаж без потреби.\n- ❌ Завершити з низькою енергією. Кульмінація має бути ярче за середину виступу ([C-l07-047]).\n- ❌ Розслабити темп через те що «маю мало часу» ([C-l07-031]). Темп — наслідок, причина у відсутньому персональному адресаті ([exercises/ex-04.md]).\n- ❌ Закінчити за 3.5 хв ([C-l07-062]). У тебе є 7 хв — займай повністю.",
    "adaptations": "- **Текст**: Юрій пише чорнетку виступу за 6 пунктами + надсилає мені 1-2 речення на кожен. Я перевіряю наявність всіх пунктів + якість хука/кульмінації. Не оцінюю темп/енергію — їх немає в тексті.\n- **Голос (Wispr/audio)**: Юрій надсилає аудіо 5-7 хв. Слухаю: (1) темп — рівний чи рвучкий, (2) паузи — є чи немає, (3) енергія — піднята чи плата, (4) кульмінація — чи відчувається крещендо в кінці. Не бачу мову тіла.\n- **Відеозапис**: Юрій записує на камеру 5-7 хв. Додатково оцінюю: (1) зоровий контакт з камерою (чи дивиться кудись убік), (2) положення тексту якщо читає (ближче до камери — добре), (3) мова тіла — затиснутий чи відкритий, (4) мімика — жива чи зморожена.",
    "verbatim": "> \"привітання, звичайне, простое, можна навіть додати якийсь хук, привлечення уваги, але це не обов'язково. Далі ви можете розказати 2-3 факти про себе в контексті цієї теми... Далі, у нас є план, і ми його озвучуємо нашій аудиторії. Тобто ви кажете, що конкретно вас зараз чекає... Ви сказали людям, що їх чекає, ввели їх в контекст і потім переходите до основної частини, наприклад, коли ви розповідаєте про саму головну ідею... ви можете повзаємодіятися з людьми, спитати у них якісь питання, відповіді... Пообщатися трохи з аудиторією, одну-дві хвилини, і далі завершити виводом, Чітким і конкретним.\" — [video 10:32-12:50]"

    "meta": "Натренувати техніку конструктивного фідбеку, який підсилює, а не ламає людину. 3-частинна структура (визнання → точка росту → закріплення сили) застосовується після будь-якого виступу клієнта, учня, колеги, дитини. Ціль — щоб людина після нашого фідбеку винесла «я росту, я можу», а не «я поганий». Також можна давати фідбек собі — тоді теж «у бутерброді», не тільки критика.",
    "instruction": "Це вправа на формування фідбеку — або на чужий виступ, або на власний (Юрієвий). Я або (а) показую як я формую фідбек на його виступ, або (б) допомагаю йому сформувати фідбек на чужий виступ за цією структурою.\n\n### Варіант А: Юрій після свого виступу, я даю фідбек\n\n1. **Я кажу Юрію**: «Перш ніж даю зворотний зв'язок, нагадаю формулу. Тривалість — 1-2 хвилини максимум ([C-l07-089]). 3 частини. Готовий?»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу — ВИЗНАННЯ (нижня булочка) — 15-30 сек**: «(а) Я бачу і визнаю — конкретно — [плюс 1], [плюс 2], [плюс 3]. Не «класно загалом», а конкретно: «ти вийшов впевнено», «структура чітка», «контакт із залом живий», «голос тепер не дрижав» ([C-l07-011] [C-l07-012]).\n\n4. **Юрій робить**: приймає визнання, відчуває «поле безпеки» ([C-l07-011]).\n\n5. **Я кажу — ТОЧКА РОСТУ (начинка) — 30-45 сек**: «Тепер точка росту. Не критика особистості. Конкретна ДІЯ + формула X→Y→Z ([C-l07-015]). НЕ «ти був затиснутий» / «треба впевненіше». А: «Якщо ти зробиш Х (додаси паузу 2-3 сек на моменті ціни) → аудиторія відчує Y (увагу, довіру) → результат буде Z (підвищена конверсія / залученість)».\n\n6. **Я кажу — ЗАКРІПЛЕННЯ СИЛИ (верхня булочка) — 15-30 сек**: «При цьому твоя сильна сторона — ось тут… ([C-l07-016]). Це НЕ повтор першої похвали. Це найсильніша сторона: твоя харизма / енергетика / унікальна подача. Може бути не пов'язано з виступом — а з природою тебе самого.»\n\n7. **Я кажу**: «Як ти прийняв цей фідбек? Що з нього хочеться забрати у завтра? ([C-l07-066])»\n\n8. **Юрій робить**: ділиться що з фідбеку забирає (1-2 речення).\n\n### Варіант Б: Юрій формує фідбек на чужий виступ\n\n9. **Я кажу Юрію**: «Зараз потренуємось формувати «Бутерброд» — як coach до людини. Я опишу тобі гіпотетичний виступ або реальний, і ти даси фідбек за 3-частинною структурою.»\n\n10. **Я даю опис**: «Уяви — Анна виступила про продуктивність. Вступ — сильний хук, представилась добре. Основна частина — 5 пунктів за 5 хв (перевантажила), на 3-му пункті заплуталась і прочитала з аркушу. Кульмінація — повтор плану, без сильної фінальної фрази. Сама вона — харизматична, з природним голосом.»\n\n11. **Юрій робить**: формує «Бутерброд» на гіпотетичний виступ Анни (3 частини: визнання — точка росту X→Y→Z — закріплення).\n\n12. **Я роблю**: оцінюю чи Юрій (а) використовує конкретику замість абстракції, (б) у точці росту говорить про ДІЇ, не про особистість, (в) використовує формулу X→Y→Z, (г) у закріпленні відмічає окрему сильну сторону (не повторює п.1).\n\n### Самофідбек (опційно)\n\n13. **Я кажу**: «Тепер уяви — ти сам після власного виступу скочуєш у «я не готувався, я погано говорив». Це антипатерн ([C-l07-061] [C-l07-091]). Запакуй цей фідбек у «Бутерброд». Дай собі: визнання — точка росту — закріплення.»\n\n14. **Юрій робить**: формулює самобутерброд (3 фрази).",
    "criteria": "- [ ] Юрій використав конкретику в усіх 3 частинах (немає «загалом нормально»)\n- [ ] У ВИЗНАННІ — 2-3 конкретні плюси, не один загальний\n- [ ] У ТОЧЦІ РОСТУ — формула X→Y→Z присутня, точка стосується ДІЇ, не особистості\n- [ ] У ЗАКРІПЛЕННІ — окрема сильна сторона (не повтор п.1)\n- [ ] Тривалість 1-2 хв загалом ([C-l07-089])\n- [ ] Тон — Любов, а не «треба покритикувати щоб самоутвердитися» ([C-l07-013])\n- [ ] Якщо самобутерброд — звертає увагу на сильну сторону, не тільки на провал",
    "mistakes": "- ❌ Фальшива похвала — «ти прекрасний, все було супер» ([C-l07-020] помилка 1). Люди відчувають мить.\n- ❌ Перевантажена начинка — 10 пунктів критики ([C-l07-020] помилка 2). Дати 2-3, інше — наступного разу.\n- ❌ Загальні фрази — «треба краще», «будь упевненіше», «попрацюй над подачею» ([C-l07-020] помилка 3). Це не фідбек.\n- ❌ Критика особистості — «ти зажат», «ти невпевнений», «слабовато» ([C-l07-014]). Тільки про ДІЇ.\n- ❌ Глибока корекція ПУБЛІЧНО ([C-l07-020] помилка 4). Публічно — тільки визнання + точка росту. Глибокі речі — приватно або у довірливому полі (12-20 людей).\n- ❌ Закріплення = повтор визнання. У ВЕРХНІЙ булочці — інша річ, окрема сила людини.\n- ❌ Самофідбек тільки негатив. Юлія сама собі: «я хвилювалась, я читала». Денис: «упакуй у бутерброд — це про любов до себе» ([C-l07-064]).",
    "adaptations": "- **Текст**: Юрій пише фідбек 3-частинний (text) або скопіює мою відповідь і переформулює. Перевіряю: конкретика? X→Y→Z формула? окрема сильна сторона у п.3?\n- **Голос (Wispr/audio)**: Юрій надсилає аудіо 1-2 хв з фідбеком на свій виступ або чужий. Слухаю: тон Любові чи самоутвердження? Чи звучить як «дав мені пораду» чи як «вирізав мене»?\n- **Відеозапис**: Юрій записує фідбек на камеру (тренування coach-presence). Дивлюся: міміка під час «точки росту» — чи м'яка, чи проявляється злість? Очі — на людину, не вниз/убік.",
    "verbatim": "> \"І класична схема бутерброду, вона состоїть з трьох частин. Булочка, начинка і верхня булочка. Тобто похвала, корекція і похвала... признання – це коли ми чітко відмічаємо, що у людину вийшло... Ми кажемо, що якщо ти зробиш х, якщо ти додаєш паузу, осознану на 2-3 секунди, то аудиторія почувствує увагу, розслаблення, і їй буде легше слухати. І, згодом, результат буде Z... В верхній частині булочки ми фіксуємо найсильнішу сторону людина, в чому його унікальна харизма, в чому його унікальне присутність.\" — [video 15:55-28:51]"

    "meta": "Свідомо увійти в простір сцени (фізичний або онлайн), перетворити її з «холодної/чужої» на «живу, підтримуючу, мою». Усуває страх перших секунд виступу. Працює в будь-якому новому залі, на новому подкасті, перед прямим ефіром у новому місці. У L2 — це розширена версія L1 [exercises/ex-01.md] з додатковими секціями: візуалізація очищення + наповнення світлячками + інтеграція до кульмінації виступу.\n\n> **Зв'язок з L1**: Це **та сама** практика, що в L1 ([C-l05-003] [exercises/ex-01.md]) — Денис прямо посилається: «Це не техніка, це моя маленька рекомендація... ми на минулому уроці вивчали». В L2 додано: фокус на онлайн-форматі (Zoom, YouTube), а не тільки на живій сцені.",
    "instruction": "Я веду Юрія голосом-провідником, м'яко, з паузами 3-5 сек між фразами. Особливо корисно перед запуском прямого ефіру в Instagram, запису Reels, виходом на онлайн-зустріч.\n\n1. **Я кажу Юрію**: «Ми проведемо коротку практику входу у простір — 3-4 хвилини. Її можна робити перед будь-яким виступом онлайн або наживо. Спочатку — оглянь простір де ти зараз. Якщо це твоя робоча кімната — глянь куди ти зазвичай дивишся під час Zoom. Якщо великий зал — оглянь сцену + перші ряди + дальні ряди.»\n\n2. **Юрій робить**: оглядає простір 10-15 сек.\n\n3. **Я кажу**: «Тепер зроби 2-3 глибокі вдихи-видихи. З кожним вдихом — простір входить у тебе. З кожним видихом — ти наповнюєш простір собою. Простір — це особистість, він відчуває твоє тіло, мислі, світогляд.»\n\n4. **Юрій робить**: 2-3 цикли дихання (15-20 сек).\n\n5. **Я кажу**: «Тепер витягни одну долоню — праву чи ліву, ту що ближче. Уяви що з неї виходить чисте біле волшебне світло, як у Гаррі Поттера. За 10-15 секунд цим світлом очисти всі 360 градусів навколо. Якщо це сцена — очисти сцену. Якщо це твоя кімната — очисти стіл, камеру, ділянку де ти сидиш.»\n\n6. **Юрій робить**: візуалізує (10-15 сек).\n\n7. **Я кажу**: «Тепер з іншої долоні — або з обох — випусти волшебні світлячки приємного кольору. Сотні, тисячі маленьких уютних світлячків золотистого або теплого кольору. Вони розлітаються по простору і наповнюють його енергією тепла, радості, любові, благодарності, підтримки. Це твоє святе місце.»\n\n8. **Юрій робить**: візуалізує (15-20 сек).\n\n9. **Я кажу**: «Зроби ще 2-3 глибоких вдиха-видиха. Простір тепер — живий і підтримуючий. Він на твоєму боці. Завершуй плавно, без ритуальності. Просто є, як є.»\n\n10. **Юрій робить**: фінальні дихання, повідомляє про завершення.\n\n11. **Я кажу**: «Як ти зараз? Що змінилось у відчутті простору? Чи відчувається тепло?»\n\n12. **Юрій робить**: коротко описує стан (1-2 речення).",
    "criteria": "- [ ] Юрій провів усі 12 кроків (не пропустив візуалізацію світла)\n- [ ] Дихання спокійне, не механічне\n- [ ] У фідбеку згадує зміну стану: «тепліше», «своє», «не страшно»\n- [ ] Тривалість 3-4 хв (не 10+ хв і не 30 сек)\n- [ ] Після — є відчуття легкої присутності у просторі (не відстороненості)\n- [ ] Перевага L2 над L1: якщо це онлайн — Юрій включає у візуалізацію саме онлайн-простір (екран, камера, ділянка стола), не уявне «велике зал»",
    "mistakes": "- ❌ Перетворити на 15-хвилинну медитацію — це warmup, не глибока практика\n- ❌ Пропустити жест долонею — навіть фізичний жест важливий, не тільки візуалізація уявою\n- ❌ Робити «для коуча» (механічно) — Денис підкреслює: робити по-справжньому\n- ❌ Завершувати з пафосом — Денис прямо каже «плавненько завершуйте без ритуальності»\n- ❌ Робити перед знайомим простором (студія, кабінет 100-й раз) — призначено для нових/чужих просторів\n- ❌ Зосередитись тільки на сцені, ігноруючи камеру (для онлайн-форматів L2)",
    "adaptations": "- **Текст**: Юрій пише «провів, відчуття: …». Я оцінюю чи є опис зміни стану, чи просто механічна звітність.\n- **Голос (Wispr/audio)**: слухаю темп звіту — швидкий і поверхневий = можливо не зайшло. Повільний і з паузами = справжнє занурення.\n- **Відеозапис**: бачу жест долонею — чи реально присутній, чи тільки уявно. Денис рекомендує саме фізичний жест.",
    "verbatim": "> \"ось там йде шум, люди розсаджуються, щось відбувається, зал якийсь холодний, непонятний, вам туди страшно виходити, ви не відчуваєте це своєю звісною середою обитання... Ви робите вдох-видох, зупиняєтесь на одну буквально хвилинку, і через дихання починаєте з'єднатися з пространством... От ви дістаєте праву ручку, наприклад, і уявляєте, що з неї виходить м'який, волшебний, приємний світ... Очищаємо сцену і весь зал, всю музкомедію, весь дворець спорту, театр якийсь і так далі... з іншої ладошки або з двох ладошок ви випускаєте такі маленькі світлячки приємного золотистого цвіту і так розкидуєте такі уютні фонарики, маленькі такі світлячки по всьому залу\" — [video 35:21-38:48]"

    "preliminaryId": "PE-04",
    "meta": "Усунути «абстрактне звертання» до неіснуючої аудиторії в записі відео, прямих ефірах, Reels, ZoomMeetings. Замість «я говорю всім» — «я говорю конкретним 2-3 людям». Мозок сам адаптується під спілкування з конкретною особистістю — тобі не треба підбирати тон, вираз лиця, темп. Все включається автоматично. Це **ключова техніка L2** — відповідь на проблему «темп швидкий» / «зажатість» / «чужий голос на камеру».",
    "instruction": "Це не одноразова вправа, а налаштування — ритуал який встановлюється один раз і працює довго. Підготовка 10 хв, потім — використовується постійно.\n\n### Підготовка (10 хв)\n\n1. **Я кажу Юрію**: «Зараз ми відберемо 2-3 конкретних людей які стануть твоїм 'персональним адресатом' для всіх онлайн-виступів. Перші критерії: (1) реально існують, (2) добре тобі знайомі, (3) є твоїми ідеальними клієнтами / учнями / друзями. Хто з твоїх клієнтів, з ким ти найбільше в потоці? Назви 3 імена.»\n\n2. **Юрій робить**: дає 3 імені (наприклад: Соня з msonya, клієнт-X з 3-міс пакету, друг-коуч).\n\n3. **Я кажу**: «Тепер другий критерій: коли ти дивишся на них / згадуєш їх — у тобі вмикаються легкість, аутентичність, потокова креативність ([C-l07-092]). НЕ затиснутість, НЕ стид, НЕ невпевненість. Уявляючи кожного з трьох — перевір: 'якби я говорив зараз тільки з ним — як би почував?' Хто з трьох пройшов фільтр?»\n\n4. **Юрій робить**: відсіває (можливо 1-2 з 3, можливо всіх трьох).\n\n5. **Я кажу**: «Тепер — це твій adressee-pool. Замінювати треба не на абстрактного 'клієнта' а на цих конкретних. У живому форматі: знайди фотографії в Instagram / телефоні / переписці. Заскрінь або сохрани їх у папку 'PA-pool'. Зайди в Files / Photos і збери 2-3 в окрему альбом-папку.»\n\n6. **Юрій робить**: знаходить + зберігає 2-3 фото.\n\n7. **Я кажу**: «Тепер дві опції розміщення фото. (а) ФІЗИЧНО: роздрукуй або відобрази на телефоні і встанови біля камери ноутбука/телефона. Це постійний візуальний якір під час всіх ефірів. (б) ВІРТУАЛЬНО: відкрий в окремому вікні Photos на боці екрана, поруч з вікном Zoom/OBS. Або просто згадуй перед натисканням 'почати ефір' — візуалізуй обличчя.»\n\n8. **Юрій робить**: вибирає опцію, реалізує (опціонально я допомагаю якщо текст-фідбек).\n\n### Перший тренувальний прохід (5 хв)\n\n9. **Я кажу**: «Тепер тестуємо. Записуй 1-хвилинне Reels-привітання на тему 'що я роблю взагалі' — як для нового підписника. Перед записом — 30 секунд: глянь на фото / уяви 2-3 людей. Скажи собі: 'я говорю Соні / Х / другу — не абстрактному підписнику'. Тільки тоді натискай Record.»\n\n10. **Юрій робить**: записує 1-хв тестове Reels (відео або скрипт, якщо текст-формат).\n\n11. **Я кажу**: «Прослухаймо. Як ти оцінюєш від 0 до 10, наскільки PA був присутній? Де 0 = абстрактно для 'всіх', 10 = чітко конкретним 2-3 особам. ([C-l07-099])»\n\n12. **Юрій робить**: оцінює (наприклад «7 з 10»).\n\n13. **Я роблю**: оцінюю той самий ракурс — чи звучить ад персональним адресатом (тон не «лектор для маси», а «спілкування з другом»), чи темп не швидкий (бо PA = темп природний), чи відчувається близькість через камеру.\n\n### Інтеграція з якорем (якщо є готовий)\n\n14. **Я кажу (опційно)**: «У L1 на ex-03 (якорі оратора) і ex-13 (зоровий контакт з трьома людьми) у тебе вже є практика 'три людини в залі'. PA = розширення цього: тепер 'три людини' існують реально і конкретно, не уявно. Якщо у тебе є готовий якір з життя — як 'жіночий клуб' у учасниці Наталі ([C-l07-094]) — використовуй його, не вигадуй нові.»\n\n15. **Юрій робить**: підтверджує або корегує.",
    "criteria": "- [ ] Юрій відібрав 2-3 реальних людей (не уявних, не «ідеальний клієнт-аватар»)\n- [ ] Кожен викликає легкість, не затиснутість ([C-l07-092])\n- [ ] Фото фізично присутні або сохранені в доступній папці\n- [ ] Перед записом — Юрій спеціально згадує / дивиться на фото (не пропускає крок)\n- [ ] У тестовому записі — темп природний, не швидкий ([C-l07-031])\n- [ ] У тестовому записі — тон ближче до «розмова з другом», ніж «лектор у мас»\n- [ ] Юрій оцінив PA-score від 0 до 10 (само-якір через шкалу)\n- [ ] Юрій згадує готовий якір з життя (клуб, спільнота, гурток), а не вигадує новий",
    "mistakes": "- ❌ Брати фото людини з якою «хімія тяжка» ([C-l07-027]). Має бути людина з якою у потоці.\n- ❌ Брати фото відомої публічної людини / селебріті — не реальний контакт.\n- ❌ Брати фото людини що викликає страх / стид / неувіреність ([C-l07-030] контр-приклад «отчим»).\n- ❌ Уявляти «всіх клієнтів» — це повертає в абстракцію. Конкретно 2-3, не більше.\n- ❌ Один раз поставити фото і забути — PA працює коли свідомо згадуєш ПЕРЕД записом, а не тільки візуально.\n- ❌ Підбирати тон / вираз лиця штучно ([C-l07-027]) — якщо мозок не адаптується автоматично — значить PA не реалізовано на рівні. Не штучний тон, а правильний адресат.\n- ❌ Темп швидкий через тривогу таймера ([C-l07-031]). Темп — наслідок, причина у відсутньому PA.",
    "adaptations": "- **Текст**: Юрій пише імена 2-3 людей, обґрунтовує вибір (1-2 речення на кожне). Я перевіряю чи реальні, чи в потоці.\n- **Голос (Wispr/audio)**: Юрій записує тестове 1-хв Reels у двох версіях: (а) без PA (абстрактно), (б) з PA (3 людей перед очима). Я порівнюю темп, тон, енергію — слухаю різницю.\n- **Відеозапис**: Юрій надсилає 1-хв тестове відео + опис де фото. Дивлюся: чи дивиться у камеру (де фото) чи кудись убік. Чи розслаблений чи затиснутий. Темп — спокійний чи рвучкий.",
    "verbatim": "> \"ми ніколи не говоримо всім, немає оцих абстрактностей. Ми говоримо завжди комусь, і цей хтось завжди дуже конкретний... Я рекомендую для тренування на камеру, ноутбуку, або якщо у вас зеркалка, ви записуєте щось, прямо біля першого часу клеїти фотографії, або включати якимось образом фотографії конкретних двох-трьох живих особистей і візуалізувати, що ви спілкуєтесь конкретно з ними... бажано, щоб ці люди були вам добре знайомі, вони реально існують, вони є вашими ідеальними клієнтами, учениками або друзями, знайомими, і вони викликають у вас емоційний откик.\" — [video 01:28:19-01:32:25]"

    "meta": "Натренувати спонтанне виголошення сильного тоста на дні народження, ювілеї, банкеті, мероприятії. Перейти від банерної слепоти «щастя/здоров'я/успіху» (можна сказати будь-кому) до персонального, живого, аутентичного тоста, який підносить конкретну людину. Це окрема форма публічного виступу — спонтанна, без підготовки, але за чіткою структурою. Працює також для постів-привітань у соцмережах, відеопривітань, відкриттів конференцій.",
    "instruction": "Це вправа на формування тоста. Я даю Юрію конкретну ситуацію (наприклад «день народження друга»), він готує тост за 3 опорами і виголошує. Можна повторити для 2-3 різних ситуацій.\n\n### Підготовка (3-5 хв)\n\n1. **Я кажу Юрію**: «Зараз ми натренуємо мистецтво сильного тоста. Спочатку — обираємо конкретну людину. Кого ти найближчим часом маєш привітати? День народження друга, корпоратив, відкриття конференції, ювілей родича — будь-яка реальна ситуація. Назви ім'я + контекст.»\n\n2. **Юрій робить**: дає ім'я + контекст (наприклад: «корпоратив msonya, привіт Соні»).\n\n3. **Я кажу**: «Тепер 3 опори ([C-l07-041]). Можна використати одну, дві або всі три. Опора 1 — ВДЯЧНІСТЬ: 'завдяки тобі я …'. Що ця людина дала тобі, чого без неї не було б у тебе? Конкретно, не абстрактно.»\n\n4. **Юрій робить**: формулює фразу вдячності (1-2 речення з конкретикою).\n\n5. **Я кажу**: «Опора 2 — ВИЗНАННЯ (прославлення): підкреслення конкретної риси АБО конкретного вчинку людини. Не 'ти така крута', а 'ти така людина, яка тримає слово навіть коли всі провалюються' / 'ти зробила Х в моменті коли я був на дні'. Що в неї найсильніше — як риса або як вчинок?»\n\n6. **Юрій робить**: формулює визнання (1-2 речення з конкретикою).\n\n7. **Я кажу**: «Опора 3 — ОСОБИСТИЙ ВПЛИВ: коротка історія про те, як ця людина змінила тебе або світ навколо. Як у мого вчителя по баскетболу — батько ([C-l07-043]). Не загальна теза 'він прекрасний' — а конкретний момент / епізод. Який епізод найяскравіший?»\n\n8. **Юрій робить**: формулює історію впливу (2-3 речення).\n\n### Композиція тоста (2 хв)\n\n9. **Я кажу**: «Тепер композиція. Це 'Бутерброд' без начинки ([C-l07-042]) — тільки нижня + верхня булочка. Без критики, без 'але'. У тоста немає 'але'. Структура: (а) Звертання — назвати людину, (б) Одна-дві з трьох опор, (в) Підняти бокал.»\n\n10. **Я кажу**: «Опціональний 4-й елемент — фінальна фраза, що закріплює всю промову одним метафоричним рядком. Як 'давай піднімемо бокал за людину, яка робить світ м'якішим'. Хочеш додати?»\n\n11. **Юрій робить**: формулює фінальну фразу.\n\n### Виголошення (2-3 хв)\n\n12. **Я кажу**: «Тепер виголоси тост — як ти би сказав на цьому реальному заході. Не читаєш — говориш. Засікаю 1-2 хв. Без поспіху.»\n\n13. **Юрій робить**: виголошує тост (текст / аудіо / відео).\n\n14. **Я роблю**: оцінюю чи (а) є конкретика про конкретну людину, (б) немає банерної слепоти «щастя/здоров'я/успіху», (в) тон Любові, не лестощів ([C-l07-021]), (г) є хоча б одна з 3 опор повноцінно реалізована.\n\n### Фідбек (2 хв)\n\n15. **Я даю фідбек**: за «Бутербродом» БЕЗ начинки ([C-l07-042]). Тільки 2 части — визнання + закріплення. Тоста не критикуємо, бо тост — це сокровенне (sukhrit, [C-l07-046]). Знаходимо що в формулюванні вийшло сильно + закріплюємо у Юрія цей образ.",

    "mistakes": "- ❌ Банерна слепота — «щастя, здоров'я, успіху» ([C-l07-040]). Можна сказати будь-кому, нічого не говорить про конкретну людину.\n- ❌ Тост про самого оратора — «мені пощастило, що ти є», 80% часу про себе.\n- ❌ Лестощі — «ти найрозумніша людина в світі», «ти найкраща мама». Це не визнання, це підлизування.\n- ❌ Критика у тості — «ти прекрасна, тільки б ще менше нервувала». У тості — без начинки ([C-l07-042]).\n- ❌ Довга історія впливу 5+ хвилин — це лекція, не тост. 2-3 речення з peak moment.\n- ❌ Тост на людину, з якою «кармічні відносини» ([C-l07-043]) без знаходження ОДНОЇ ключової подяки. Денис на батька знайшов «баскетбол» — і це працювало.\n- ❌ Бажати чого хочеш собі ([C-l07-099] інсайт Юлії). Це поширений патерн — ми бажаємо іншим те, чого хочемо для себе. Замість цього — побажати того, чого людина хоче.",
    "adaptations": "- **Текст**: Юрій пише тост у три абзаци (1 на опору). Я перевіряю наявність конкретики, відсутність банерної слепоти, фокус на людину.\n- **Голос (Wispr/audio)**: Юрій надсилає аудіо тоста 1-2 хв. Слухаю: тон Любові чи виконаності? Темп — задумливий чи поверхневий? Чи відчувається персональність?\n- **Відеозапис**: Юрій записує відео тоста (для відео-привітання або як ритуал). Дивлюся: чи дивиться у камеру наче на людину чи кудись убік. Чи розслаблений. Чи є щира емоція в обличчі.",

    "meta": "Сформувати у Юрія усвідомленість: щоразу коли він говорить з клієнтом, учнем, дитиною, партнером — він впливає на їхню самооцінку. Після розмови людина забирає або (1) бажання рости, або (2) бажання закритися. Цей drill — не вправа з технікою, а ритуал саморефлексії після кожної важливої взаємодії. Зробити це звичкою — переформулює коучингову позицію Юрія.\n\n> **Зв'язок з технікою «Бутерброд»** ([exercises/ex-02.md]): «Бутерброд» — це інструмент. А цей reflection drill — мотивація використовувати інструмент. Без цього усвідомлення «Бутерброд» стає механічним, а не Любовним.",
    "instruction": "Це reflection drill — Юрій робить його після кожної значущої взаємодії з клієнтом. Спочатку — я веду його через рефлексію останньої сесії як демо, потім — він використовує як щоденну практику.\n\n### Демо на останній сесії (5 хв)\n\n1. **Я кажу Юрію**: «Згадай останню коучингову сесію — клієнт-Х або сьогоднішня з Y. У тебе 30 секунд просто згадати її контекст. Кого ти бачив? Що було головним?»\n\n2. **Юрій робить**: пригадує сесію (30 сек).\n\n3. **Я кажу**: «Тепер головне питання уроку: ЩО ЦЯ ЛЮДИНА ЗАБРАЛА ПІСЛЯ РОЗМОВИ З ТОБОЮ? Не як вона почувалась у моменті, а що вона несла за двері. Бажання рости (енергія, ідея, конкретний наступний крок) чи бажання закритися (треба обмірковувати, я не той, у мене не вийде)?»\n\n4. **Юрій робить**: відповідає (1-2 речення).\n\n5. **Я кажу**: «Тепер 4 sub-питання:\n   - Чи я обіцянив (devalued) щось з її досвіду / страху / ідеї? Можливо случайно через 'та це не страшно, всі так роблять'.\n   - Чи я тикнув у її больове місце без любові? Можливо випадково через 'ти ж психолог, ти маєш розуміти'.\n   - Чи я підсилив (закріпив) хоча б одну сильну сторону людини, як у верхній булочці 'Бутерброду'?\n   - Чи я говорив конкретно (X→Y→Z) чи абстрактно ('треба бути сильнішою')?»\n\n6. **Юрій робить**: відповідає на 4 sub-питання (3-5 хв).\n\n7. **Я кажу**: «Якщо в одному з 4 — ти бачиш patten 'я обіцяв / не підсилив / абстрактно' — це сировина для роботи з собою. Не пиши клієнту 'я був неправий', а наступну сесію зроби з усвідомленням і скоригуй.»\n\n### Перетворення на щоденну практику (1 хв)\n\n8. **Я кажу**: «Цей drill можна робити після кожної сесії 1 хв: 'що людина забрала?' + 'чи я в Любові пройшов або в зачіпках?'. У Notion або в нотатках телефону роби 1 рядок на сесію. За 30 сесій ти побачиш patterns.»\n\n9. **Юрій робить**: підтверджує (текст / audio).",

    "mistakes": "- ❌ Розглядати тільки моменти сесії, не що людина забрала. «Я говорив гладко» ≠ «вона побачила свій крок».\n- ❌ Відповісти «вона забрала радість» — це абстракція. Конкретно: бажання рости проявилось як що? Записала наступний крок? Сама сказала «я зрозуміла X»? Прямо у момент видна різниця.\n- ❌ Самокритика всім видом «я взагалі поганий коуч». Це теж антипатерн ([C-l07-091]). Drill — про конкретний інцидент, не про загальну якість.\n- ❌ Пропустити sub-питання про конкретику. «Я говорив абстрактно» — найчастіше залишається в blind spot.\n- ❌ Перетворити на «обіцяти» себе щодня. Drill не для самокатування, а для дослідження patterns.",

    "verbatim": "> \"якщо ви працюєте з людьми, з командою, з клієнтами, з групою, один на один, жива група ретрит, там 12-20 людей, або там великий онлайн-курс, не важливо який формат, ви постійно впливаєте на самооцінку цих особистих, які на вас дивляться, за якими, які за вами йдуть. І тут питання не в тому, що ви їм кажете, і не стільки навіть, як ви це кажете, а в самому результаті, що людина після вашого контакту, після вашого спілкування вносить з собою. Він бере з собою бажання рости або бажання закритися.\" — [video 16:01-17:13]\n\n> \"точно також наоборот, коли ми вихвалюємо якісь благі качіства інших людей, в нас цього теж стає більше. І тому логіка така, перестати критикувати інших з себе і почати визвищувати інших з себе, але, знову ж таки, аутентично, а не корисно.\" — [video 03:13:04-03:13:30]"

    "meta": "Натренувати **усвідомлене порушення** структури виступу — щоб через досвід «зроблено неправильно» закріпити правильну структуру. Денис у warmup-виступі ([C-l07-068] [C-l07-088]) навмисно зробив все «неправильно» — почав з оправдань, плутав факти, з'являвся «несумлінним експертом», ламав структуру 6+1, говорив про «сусіда Віктора» замість теми. І це СПРАЦЮВАЛО — Юрій сказав «це було жахливо, і це була твоя найбільша фішка». Ця вправа — інверсія: робиш все «неправильно» свідомо, щоб зрозуміти прямий каркас.\n\n**Це нова вправа, не з preliminary** — додана після виявлення в transcript ([C-l07-068]-[C-l07-091]). Денис використовує її як свій підпис методичний прийом — показати антипатерни «у дії».",
    "instruction": "Юрій робить 5-хвилинний виступ, де навмисно порушує структуру. Я даю йому список 5 антипатернів — він виконує усі. Потім робить контрастний 5-хвилинний виступ за структурою. Порівнюємо.\n\n### Підготовка (3 хв)\n\n1. **Я кажу Юрію**: «Сьогодні незвичайна вправа. Замість тренувати правильно — спробуємо навмисно зробити НЕправильно. Денис використав цей прийом у L2 у демо-виступі про перфекціонізм ([C-l07-068]). Тема — будь-яка твоя експертна (коучинг, AI для коучів, що завгодно). Що вибираєш?»\n\n2. **Юрій робить**: вибирає тему.\n\n3. **Я кажу**: «Тепер 5 антипатернів які треба свідомо ВКЛЮЧИТИ у виступ:\n   - **AP1 — Оправдання на початку** ([C-l07-091]): «Я не готувався / погано спав / не сильно в темі».\n   - **AP2 — Плутанина у фактах**: пообіцяти 3 факти, а дати 2; пообіцяти 3 пункти, а сказати 1.\n   - **AP3 — Відхилення від теми** ([C-l07-037]): включити деталі про «сусіда Віктора» або інший off-topic 30 секунд.\n   - **AP4 — Загальні фрази без конкретики**: «це важливо», «це треба робити», «без цього не буде успіху» — без X→Y→Z.\n   - **AP5 — Слабкий фінал**: завершити без сильної фрази, типу «ну, типу, все, я закінчив. У мене немає яркої фінальної фрази».\n     »\n\n4. **Юрій робить**: підтверджує що зрозумів антипатерни.\n\n### Виступ 1 — Антипатерни (5 хв)\n\n5. **Я кажу**: «Засікаю 5 хвилин. Тільки спробуй НЕ закотити очі сам собі — навмисно зроби це з посмішкою. Як демо. Готовий?»\n\n6. **Юрій робить**: виступ з усіма 5 AP (текст / аудіо / відео).\n\n### Виступ 2 — Правильна структура (5 хв)\n\n7. **Я кажу**: «Тепер та сама тема. Структура 6+1 ([C-l07-006] [exercises/ex-01.md]). Привітання + хук. 3 факти. План. Основна частина з потребою + 2-3 пункти. Взаємодія. Сильний фінал з кульмінацією. 5 хвилин.»\n\n8. **Юрій робить**: правильний виступ.\n\n### Аналіз контрасту (3 хв)\n\n9. **Я кажу**: «Зараз — порівнюємо. Назви хоча б один інсайт: ЩО ти відчув у антипатерн-виступі, чого не відчув у правильному? І ЩО ти відчув у правильному, чого не було в антипатерн?»\n\n10. **Юрій робить**: відповідає (інсайт 1-2 речення).\n\n11. **Я кажу**: «Парадокс цього прийому ([C-l07-068]). Денис у антипатерн-виступі через ‘жахливо' створив магнетизм — Юрій сам казав ‘це було твою найбільшу фішкою'. Чому це працює? Бо аутентичність ([C-l07-021]) важливіша за структуру. Антипатерн з усвідомленістю = свіжий аутентичний виступ. Антипатерн НЕсвідомий = катастрофа. Правильна структура = безпечний дефолт. Цей drill вчить тебе ВИБИРАТИ режим, а не дрейфувати випадково.»\n\n12. **Юрій робить**: підтверджує розуміння.",

    "mistakes": "- ❌ Робити AP-виступ цілком серйозно. Це експеримент. Юрій має бути в стані «я граю антипатерн», не «я тупо не готувався».\n- ❌ Робити AP-виступ перед реальною аудиторією. Це лабораторний експеримент, не production.\n- ❌ Зупинитися на AP-виступі і не зробити правильний. Контраст обов'язковий.\n- ❌ Не побачити інсайт. Якщо Юрій каже «ну, обидва однакові» — drill не зайшов. Повторити з усвідомленістю.\n- ❌ Робити AP-виступ перед клієнтом і виправдовувати «це у мене drill з Claude». Це не воркшоп, а особистий експеримент.",
    "adaptations": "- **Текст**: Юрій пише AP-виступ і правильний (2 чорнетки по 5-хв). Я перевіряю чи всі 5 AP включено + контраст видно.\n- **Голос (Wispr/audio)**: Юрій надсилає 2 audio. Слухаю темп — у AP темп має бути рваним, у правильному — рівним. Тон — у AP плаваючий, у правильному — закріплений.\n- **Відеозапис**: НАЙКРАЩЕ для цього drill. Юрій записує 2 відео. Дивлюся: у AP — затиснутий чи свобода-через-усвідомлення? У правильному — чи з'явилася впевненість після контрасту?",
    "verbatim": "> \"Так, ну добре, типу, всім привіт. Так, як мене чути? Сподіваюсь, мене чути добре. Алло, алло, а чути, так? Так, супер, добре, добре, ну тоді почнемо, так. Насправді я не сильно готувався і трохи погано спав... Цього сусіда, до речі, Віктора звали, не знаю, звідки він приїхав. Коротше, не суть... Окей, другий факт, це те, що факта не три, а два. А третій факт, я думаю, говорити взагалі не стоїть, і ми просто підемо далі... Ну, типу, все, я закінчив. У мене тут немає якоїсь яркої фінальної фрази, тому похлопайте мені, будь ласка, щоб зберігати цю неловку паузу.\" — [video 40:53-45:09 — Денис demo АП-виступу]\n\n> \"Ну що, Денис, це було жахливо, я тобі так скажу. Ти почав непонятно з чого, непонятно як, ввів аудиторію в заблуждення, і в цьому була, мабуть, твоя найбільша фішка – це виступлення, показати на прикладі, що як і відбувається.\" — [video 47:16-47:31 — Юрій про demo Дениса]"

    "meta": "За 30 секунд (умовно — 2-5 хв вдумливо) обрати правильну структуру виступу і перевірити її валідність ДО початку. Не вибирати «за настроєм», а за метою + типом аудиторії. Запобігає двом катастрофам: (1) AIDA з тепла особистою аудиторією → «маркетингово», втрачаєш довіру; (2) Жива коло перед B2B → «балаканина», втрачаєш авторитет.",
    "instruction": "Це pre-flight checklist перед будь-яким виступом (включно з домашкою ex-02). Я веду Юрія через 4 кроки послідовно. Можна виконувати у форматі чату (Юрій пише відповіді) або в голос.\n\n1. **Я кажу Юрію**: «Перед тим як готувати виступ, давай зробимо 30-секундну процедуру вибору структури. Чотири кроки. Перший — мета. Що має змінитися у твоїй аудиторії після виступу? Вибери одне: (а) купити, (б) замислитися, (в) надихнутися, (г) отримати систему, (д) змінити переконання.»\n\n2. **Юрій робить**: вибирає одне.\n\n3. **Я кажу**: «Другий крок — тип аудиторії. Хто перед тобою: (а) холодна, (б) тепла, (в) корпоративна, (г) особиста / підписники, (д) конференція?»\n\n4. **Юрій робить**: вибирає тип.\n\n5. **Я кажу**: «Третій крок — структура за метою.\n   • Якщо ПРОДАЖ — AIDA, дофамін-спікер, Ескалація.\n   • Якщо НАТХНЕННЯ — Арка героя, 3 контрасти, Міф-Реальність-Нове правило.\n   • Якщо НАВЧАННЯ — Шлях за 5 кроків, Проблема-Рішення-План, Запитання-Відповідь-Доказ.\n   • Якщо ОСОБИСТИЙ КОНТАКТ — Живе коло, Арка героя.\n   Дивись на свою мету і тип аудиторії і обери ОДНУ. Не змішуй.»\n\n6. **Юрій робить**: називає структуру.\n\n7. **Я кажу**: «Четвертий крок — перевірка. Чи зможеш у твоєму виступі чітко відповісти на 3 питання:\n   1. Чи є у тебе чіткий початок?\n   2. Чи розумієш, до чого ти ведеш (головний меседж)?\n   3. Чи є у тебе сильний фінал?\n      Якщо хоча б на одне — \"ні\" → структура неправильна або не прописана.»\n\n8. **Юрій робить**: дає відповіді (так/ні/невпевнено).\n\n9. **Я кажу**: «Якщо все 3 — \"так\" → структура валідна, можна готуватися. Якщо хоча б 1 — \"ні\" → давай розберемо: який саме пункт не на місці?»\n\n10. **Я роблю**: разом з Юрієм дороблюємо слабке місце (початок / середина / фінал) АБО пропонуємо змінити структуру.",
    "criteria": "- [ ] Юрій вибрав конкретну мету (одне з 5), а не «всі одразу»\n- [ ] Тип аудиторії визначений конкретно (не «всі»)\n- [ ] Структура відповідає квадранту (продаж → AIDA, не Живе коло)\n- [ ] На всі 3 контрольні запитання — чітке «так»\n- [ ] Якщо «ні» — Юрій уточнив, в якому елементі прогалина",
    "mistakes": "- ❌ Юрій вибирає 2-3 мети одночасно («і надихнутися, і купити, і навчити»). Питати: «А головна — яка?»\n- ❌ Тип аудиторії «всі». Уточнити: «На ЦЕЙ виступ — хто?»\n- ❌ Структура не з квадранту мети («хочу продати — Живе коло»). Денис прямо: продаж = AIDA, не Живе коло. Якщо Юрій впертий — спитати чи у нього вже є контакт з цією аудиторією; якщо ні — AIDA.\n- ❌ «Невпевнено» на питанні фіналу — це червоний прапор. Без сильної кінцевої точки = виступ ніяк. Дороблюємо С-32 (ex-09).\n- ❌ Юрій каже «у мене вже є виступ» і пропускає процедуру. Все одно — провести 4 кроки і перевірити готовий виступ через них.",
    "adaptations": "- **Текст**: Юрій пише відповіді у чат. Я перевіряю кожну.\n- **Голос (Wispr/audio)**: можна, але швидше у тексті. Якщо голосом — слухаю чи Юрій «думає вголос» (нормально) чи переказує заготовлене (треба питати глибше).\n- **Відеозапис**: не потрібен — це підготовча вправа.",
    "verbatim": "> \"Не обирайте структуру за настроєм. Обирайте за метою. Дайте відповідь на головне запитання: Що має змінитися в аудиторії після мого виступу?\" — [slide 40]\n\n> \"Якщо ні — структура обрана неправильно або не прописана.\" — [slide 43]\n\n> \"Універсальний принцип такий. Ви завжди ведете свою аудиторію, спочатку зважаючи на емоції. Так, захоплення уваги — це завжди про емоцію. Потім, коли емоція з'явилася, увагу, ви захопили, ви переводите в логіку і далі побачаєте її діючість.\" — [video 02:24:58]"

    "instruction": "Це багатоетапна вправа. Я веду Юрія через 4 етапи: вибір теми → вибір структури → підготовка → проведення. Між етапами можуть бути перерви від годин до кількох днів.\n\n### Етап 1 — вибір теми (5 хв)\n\n1. **Я кажу Юрію**: «Першим обираємо тему. Денис рекомендує реальну тему з твого досвіду. Приклади: страх проявлятися; вигорання; провал, який тебе змінив; запуск, який не вдався; звичка, яка тебе змінила; урок, що дав зростання. Важливо — НЕ теоретично. Що зараз болить чи резонує?»\n\n2. **Юрій робить**: називає тему (1 варіант) або 2-3 для вибору.\n\n3. **Я кажу** (якщо 2-3): «Обери одну. Яка зараз найбільше пульсує?»\n\n### Етап 2 — вибір структури (5 хв)\n\n4. **Я кажу**: «Тепер — структура. У домашці Денис дає 4 варіанти: AIDA, Ескалація, Живе коло, Арка героя (з L1). ОДНА, не змішуй. Враховуй: AIDA — для продажу, Ескалація — для емоційного прориву, Живе коло — для людської історії з висновком, Арка героя — для глибокої трансформації. Яка з них зайде на твою тему?»\n\n5. **Юрій робить**: вибирає одну.\n\n6. **Я кажу**: «Якщо хочеш — можемо разом провести pre-flight checklist (ex-01) і перевірити чи структура валідна.»\n\n### Етап 3 — підготовка (макс 40 хв)\n\n7. **Я кажу**: «Підготовка — максимум 40 хв. Денис прямо: \"Якщо більше — мозок саботує\". Пропиши структуру письмово — пункти, опорні тези. НЕ дослівний текст. Можна використати GPT (Денис рекомендує: GPT = каркас, твоя енергія = поверх). Готовий?»\n\n8. **Юрій робить**: пише структуру (надсилає мені на ревью).\n\n9. **Я роблю**: перевіряю по чек-листу:\n   - [ ] Тема реальна, з досвіду (не теоретична)\n   - [ ] Структура одна, не змішана\n   - [ ] Опорні тези (3-7 пунктів), не дослівний текст\n   - [ ] Початок, середина, фінал чітко виділені\n   - [ ] Фінал — сильна точка (висновок / рішення / запрошення / дія)\n\n10. **Я кажу**: «Фідбек по структурі: …». Конкретно — де додати, що зайве.\n\n### Етап 4 — проведення (15-25 хв)\n\n11. **Я кажу**: «Платформа: Zoom, Instagram, Telegram, YouTube або закрите коло знайомих. Без монтажу, наживо. Тривалість — 15-25 хв. ОБОВ'ЯЗКОВО запис (для фідбеку після). Дата?»\n\n12. **Юрій робить**: проводить ефір.\n\n13. **Я кажу** (після): «Як пройшло? Надішли запис або голосовий звіт. Розберемо.»\n\n14. **Юрій робить**: надсилає запис + звіт.\n\n15. **Я роблю**: фідбек по чек-листу (нижче).",
    "criteria": "- [ ] Тривалість 15-25 хв (НЕ 5 хв, не 50)\n- [ ] Структура витримана (не змінив посеред)\n- [ ] Чіткий початок (формулювання теми у перші 1-2 хв)\n- [ ] 2-3 ключові тези у середині (не 10)\n- [ ] Сильний фінал — висновок / заклик / запрошення (не «ну, наче все»)\n- [ ] Жодних монтажів — наживо\n- [ ] Запис є для post-mortem",
    "mistakes": "- ❌ Підготовка перфекціоніста — «ще пара днів, ще приклад додам». Денис: 40 хв max. Якщо більше — мозок саботує.\n- ❌ Дослівний текст. Юрій буде його читати → втратить контакт з аудиторією. Тільки опорні тези.\n- ❌ Змішування структур у середині. «Почав AIDA, перейшов у Живе коло». Не критично, але це не домашка.\n- ❌ Тривалість 5-10 хв (не дотягнув до 15) або 30+ хв (затягнув). Денис: 15-25.\n- ❌ Фокус на переглядах / лайках / продажах. Це НЕ ціль. Ціль — досвід.\n- ❌ Юрій не запише (тільки наживо). Тоді не зможу дати фідбек. Просити запис.\n- ❌ Юрій вибирає теоретичну тему («що таке коучинг»). Денис: реальна, з досвіду.\n- ❌ Парний ефір замість соло. Денис прямо: домашка — СОЛО, бо в парі структура розмивається у живому спілкуванні.",
    "adaptations": "- **Текст**: Юрій надсилає структуру (опорні тези) + звіт post-mortem. Я даю фідбек по чек-листу.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ формат для запису ефіру. Слухаю чи витримана структура — переходи, ключові тези, фінал.\n- **Відеозапис**: бажано. Денис у L3 акцентує на тоні голосу — у відео можна перевірити переключення тонів (мудрець → друг → воїн → чарівник). Якщо аудіо — фокус на дикції, темпі, паузах.",
    "verbatim": "> \"Домашнє завдання: Провести публічний ефір за структурою. Оберіть одну реальну тему, пов'язану з вашим досвідом... Оберіть одну структуру: AIDA, ескалація, живе коло або арка героя (лише одну, не змішуйте). Підготовка: пропишіть структуру письмово (пункти), не пишіть текст дослівно, лише опорні тези. Тривалість: 15-25 хвилин. Без монтажу, наживо. Важливо: ви не робите ефір заради переглядів! Ви робите це заради навички.\" — [slide 45]\n\n> \"Максимум на підготовку, ну, виділити 40 хвилин. 40 хвилин. Це може бути вибір структури, вибір теми і плюс-мінус якісь тезиси, теми. Ви можете використовувати GPT. Для початку це може допомогти. Не може, а це точно допоможе. І просто отримайте цей досвід. Тут важлива практика.\" — [video 02:27:32]\n\n> \"Ваша ціля, головне, отримати досвід. У вас немає ніяких цілей, за якими ви будете визначити свій успіх. Вам не обов'язково там щось продавати, хоча ви можете продавати. Але успіх – це не те, що ви продадите або не продадите успіх. Це про те, що ви просто отримаєте цей практичний досвід.\" — [video 02:29:35]"

    "meta": "Освоїти тон МУДРЕЦЯ — спокійну, уповільнену, впевнену енергію. Архетипи: майстер Йода, Гендальф, духовний учитель. Цей тон створює довіру і статус. Це базовий drill з 4-х тонів L3 — потім поєднаємо з іншими у структурах (ex-09 AIDA, ex-10 Ескалація, ex-11 Живе коло).",
    "instruction": "Це вправа на голос. ОБОВ'ЯЗКОВО запис аудіо (Wispr, voice notes, recorder app). Без запису неможливо дати фідбек на тон.\n\n1. **Я кажу Юрію**: «Зараз ми тренуватимемо перший з 4-х тонів — Мудрець. Це спокійна, уповільнена, впевнена енергія. Уяви Йоду чи Гандальфа. Чи якогось духовного вчителя, якого ти зустрічав. Як вони говорять? Повільно, з паузами, голос нижче звичайного, чіткі формулювання. Готовий записати аудіо?»\n\n2. **Юрій робить**: підтверджує (вмикає запис).\n\n3. **Я кажу**: «Фраза для тренування:\n   **«Іноді найважливіші рішення приймаються в повній тиші та внутрішній ясності.»**\n\n   Як читати:\n   - повільно\n   - з паузами (особливо після \"повній тиші\")\n   - трохи нижче звичайного темпу і тону\n   - відчуття глибини\n\n   Скажи цю фразу. Без поспіху. Якщо хочеш — повтори 2-3 рази.»\n\n4. **Юрій робить**: записує фразу (1-3 дублі).\n\n5. **Я кажу**: «Тепер прослухай свій запис. Чи відчуваєш сам глибину, чи звучить \"лекторськи\" / \"звичайно\"?»\n\n6. **Юрій робить**: self-фідбек.\n\n7. **Я кажу**: «Мій фідбек: …». Я даю конкретику (див. чек-лист нижче).\n\n8. **Я кажу** (опційно): «Спробуємо другу фразу: **«Страх — це не причина. Причина — відсутність системи.»** Це теж мудрець, але з ще більшою акцентом на причинно-наслідкову лаконічність.»\n\n9. **Юрій робить**: записує другу.\n\n10. **Я кажу**: «І тепер тренувальна вправа на контраст. Скажи цю саму фразу У ЗВИЧАЙНОМУ темпі — як новину з газети. А потім ще раз — Мудрецем. Послухай різницю.»\n\n11. **Юрій робить**: 2 дублі (звичайний → мудрець).\n\n12. **Я кажу**: «Цей контраст — ключовий. Запам'ятай це відчуття. Це і є переключення тону.»",
    "criteria": "Через аудіо я перевіряю:\n\n- [ ] **Темп** — реально нижче звичайного. Якщо Юрій звичайно говорить ~150 слів/хв, тут має бути 90-120.\n- [ ] **Паузи** — є помітні паузи (1-2 секунди) між смисловими блоками («Іноді найважливіші рішення приймаються в повній тиші» [ПАУЗА] «та внутрішній ясності»).\n- [ ] **Тон голосу** — фактично нижче (на грудних резонансах), а не «вище зі знятим хвилюванням».\n- [ ] **Чіткість дикції** — кожне слово окремо, не злите.\n- [ ] **Відчуття глибини** — слухач чує не «торопиться донести інформацію», а «розгортає сенс».",
    "mistakes": "- ❌ Юрій просто говорить ПОВІЛЬНІШЕ, але тоном звичайної мови. Це не мудрець, це «уповільнений диктор». Нагадати про нижній резонатор грудний.\n- ❌ Перебір — занадто повільно, паузи 5+ секунд → стає нудним і монотонним (Денис прямо: «небезпека мудреця — стати нудним»). Темп ~90-120 слів/хв оптимально.\n- ❌ Юрій імітує літню людину / «бабусю» — це акторство, не мудрець. Денис: мудрець = СТАТНІСТЬ, не вік.\n- ❌ Підняв тон угору в кінці фрази («?» інтонація). Мудрець завершує ЛІНІЙНО або ВНИЗ. Не запитує.\n- ❌ Юрій робить вправу ПОДУМКИ. Без запису — нема feedback'у. Просити: Wispr.",
    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ. Це вправа на голос — текстом неможливо.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ формат. Я слухаю:\n  - **Pitch (висота)**: спадає у нижній резонатор? Якщо текст «Іноді» починається на висоті 200 Гц і нижче, а закінчується ~150 Гц — це мудрець. Якщо все на висоті 220+ — це не мудрець.\n  - **Tempo**: <120 слів/хв = мудрець. >150 = не мудрець.\n  - **Pauses**: є помітні (1-2 сек) між смисловими блоками? Якщо все злите без пауз — не мудрець.\n  - **Modulation**: чи рівний голос (мала мелодична варіація — це характерно для мудреця). Якщо великі скачки — це інший тон.\n  - **Energy**: спокій (НЕ втома). Втома = «надломлено». Спокій = «упевнено».\n- **Відеозапис**: бонус. Дивлюсь на міміку (мудрець НЕ усміхається багато; погляд спокійний, прямий), позу (стійка, не нагнут), руки (мінімум жестів).",
    "verbatim": "> \"Мудрець: Енергія: спокійна, уповільнена, впевнена. Коли використовувати: пояснення принципів; стратегічні думки; висновки; аналітика. Як звучить: повільний темп; зниження голосу; довгі паузи; чіткі формулювання.\" — [slide 49]\n\n> \"«Іноді найважливіші рішення приймаються в повній тиші та внутрішній ясності.» Як читати: повільно, з паузами, трохи нижче звичайного темпу, відчуття глибини.\" — [slide 58]\n\n> \"це таке авторитетне звучання. звучить як медлений темп, зниження голосу, довгі паузи, без страху втратити увагу аудиторії.\" — [video 03:07:22]\n\n> \"тяжело представить мудреца который тараторит. сразу другое впечатление, другая статусность.\" — [video 03:08:24]"

    "meta": "Освоїти тон ВОЇНА — зібраність, фокус, внутрішню силу, що запускає рух у слухача. Це тон кульмінацій, викликів аудиторії, мотивації до дії. Найскладніший з 4-х — БЕЗ агресії, але з твердістю. Денис: «Щоб не було агресії — у серці має бути любов».",
    "instruction": "Це вправа на голос. ОБОВ'ЯЗКОВО запис аудіо.\n\n1. **Я кажу Юрію**: «Зараз — другий тон, Воїн. Це зібраність, фокус, внутрішня сила. Уяви воїна, який ВИКЛИКАЄ підлеглих до дії. Не кричить — констатує. Тоном, який не приймає сумнівів. Архетип — лідер у момент кульмінації. Як звучить: коротші фрази, твердий голос, менше усмішки, чітка дикція. Готовий?»\n\n2. **Юрій робить**: підтверджує (вмикає запис).\n\n3. **Я кажу**: «Фраза:\n   **«Або ви починаєте діяти сьогодні, або продовжуєте пояснювати собі причини.»**\n\n   Як читати:\n   - коротко, твердо\n   - без усмішки\n   - фрази різкіші, не наспівні\n   - кінець фрази — ВІДКРИТИЙ знак, не вниз (Денис прямо: \"В кінці чіткий відкритий знак. Не сідай вниз\")\n\n   Скажи.»\n\n4. **Юрій робить**: записує фразу.\n\n5. **Я кажу**: «Прослухай свій запис. Чи відчуваєш силу, чи відчуваєш агресію, чи нічого?»\n\n6. **Юрій робить**: self-фідбек.\n\n7. **Я кажу**: «Мій фідбек: …». Конкретика (див. чек-лист).\n\n8. **Я кажу** (опційно): «Спробуємо посилити. Та сама фраза, але уяви: ти прямо зараз стоїш перед командою, яка пасивна вже місяць. Це твій момент розвернути ситуацію. Скажи.»\n\n9. **Юрій робить**: записує 2-й дубль.\n\n10. **Я кажу**: «А тепер — анти-вправа. Скажи цю саму фразу, але МУДРЕЦЕМ (із попередньої вправи). Послухай контраст.»\n\n11. **Юрій робить**: записує мудрецем.\n\n12. **Я кажу**: «Це ключовий тест. Якщо мудрець → воїн → ти чуєш ЯСНУ різницю — ти добре переключаєшся. Якщо звучить однаково (просто гучніше / тихіше) — переключення ще не освоєне.»",
    "criteria": "- [ ] **Темп** — швидший за мудреця, фрази КОРОТШІ. Денис: «коротші фрази, твердий голос».\n- [ ] **Pitch** — у нижньо-середньому регістрі (НЕ вище звичайного). Воїн НЕ кричить, не пищить.\n- [ ] **Closure** — кінець фрази на ВІДКРИТОМУ знаку (не вниз, не вгору). Це маркер «я закінчив, але дія попереду».\n- [ ] **Без усмішки** — голос звучить «не наспівно». Усмішка робить його дружелюбним; для воїна — мінімум усмішки.\n- [ ] **Чітка дикція** — кожен приголосний чітко (особливо «т», «д», «р»). Не злито, не змазано.\n- [ ] **Без агресії** — це індикатор балансу. Якщо Юрій звучить так, що хочеться відсунутися — перебір. Якщо хочеться діяти — баланс.",
    "mistakes": "- ❌ **Агресія замість сили.** Найчастіша помилка. Юрій КРИЧИТЬ, тон жорсткий, у слухача defense reaction. Денис: «у серці має бути любов». Перезаписати з усвідомленням: ти не атакуєш — ти запрошуєш до дії.\n- ❌ **Кінець фрази вниз.** Юрій каже «...пояснювати собі причини↘» — як висновок. Воїн не закінчує. Голос має триматися рівно або трохи вгору. Денис до Лери: «Не сідай вниз. У кінці чіткий відкритий знак.»\n- ❌ **Темп як у мудреця.** Юрій уповільнено читає → це не воїн, це філософ. Воїн — ШВИДШЕ.\n- ❌ **Зайвий пафос.** Юрій імітує «оратора-проповідника». Це театр. Воїн — спокійний всередині, твердий зовні.\n- ❌ **Усмішка.** Юрій звично усміхається коли говорить → пом'якшує тон до Друга. Прибрати усмішку.",
    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ формат. Я слухаю:\n  - **Pitch range**: у воїна вузька варіація (не співає). Якщо діапазон 80-130 Гц — ОК. Якщо 80-250 Гц — це чарівник, не воїн.\n  - **Tempo**: ~140-160 слів/хв. Швидше — паніка. Повільніше — мудрець.\n  - **Articulation**: чіткі приголосні. Якщо «прадовжуєт' пасняват'» — нечітко. Якщо «продовжуєте пояснювати» — ОК.\n  - **Closure pitch**: останній склад вирівняний (не падає різко вниз).\n  - **Tone hardness**: голос «зібраний» (compressed) vs «вільний» (loose). Воїн — compressed.\n- **Відеозапис**: рекомендовано. Дивлюсь на:\n  - Постава пряма (не нагнут вперед — це агресія, не нагнут назад — це слабкість).\n  - Підборіддя горизонтальне (не задерте вгору = агресія).\n  - Очі — фокусовані на одній точці / уявному слухачі (не блукають).\n  - Жести — мінімум, чіткі (не розпорошені).",
    "verbatim": "> \"Воїн: Енергія: зібраність, фокус, внутрішня сила. Коли використовувати: кульмінація; виклик аудиторії; мотивація до дії; руйнування ілюзій. Як звучить: коротші фрази; твердий голос; менше усмішки; чітка дикція.\" — [slide 51]\n\n> \"«Або ви починаєте діяти сьогодні, або продовжуєте пояснювати собі причини.» Як читати: коротко, твердо, без усмішки, фрази різкіші.\" — [slide 58]\n\n> \"Іноді це можна спутати з агресією. Зараз це було трохи агресивно, і я не рекомендую це спутати з агресією. Тому що загальність цієї позиції – це те, що можна перегнути в агресію, але сильна сторона цього тону голосу – це те, що це запускає до руху, пробуждає і направляє до дійснень. Щоб не було агресії, повинна бути у серці любов.\" — [video 03:12:02]\n\n> \"В кінці відкритий знак, не сіжай вниз. В кінці чіткий відкритий знак.\" — [video 03:31:40]"

    "meta": "Освоїти тон ДРУГА — м'якість, підтримка, прийняття, тепло. Це тон близькості і довіри. Використовується для особистих історій, визнання помилок, роботи з болем аудиторії. Небезпека: можна втратити статус (архетип «славний пацан»).",
    "instruction": "1. **Я кажу Юрію**: «Тон Друг. Це м'якість, тепло, прийняття. Уяви, що ти зараз говориш з близьким другом, який щойно зазнав невдачі. Або з підлітком, який страшно перед іспитом. Тон підтримки, без тиску. Більше \"ми\", менше \"ти\". Готовий?»\n\n2. **Юрій робить**: підтверджує (вмикає запис).\n\n3. **Я кажу**: «Фраза:\n   **«Я розумію, як складно зробити перший крок, особливо коли страшно.»**\n\n   Як читати:\n   - м'яко\n   - трохи тепліше, ніж зазвичай\n   - з легкою посмішкою (вона чується в голосі)\n   - із легкою підтримкою в голосі\n   - в темпі повільніше, ніж воїн, але не такому повільному як мудрець\n\n   Скажи.»\n\n4. **Юрій робить**: записує.\n\n5. **Я кажу**: «Прослухай. Чи звучить тепло, чи звучить професіонально-нейтрально?»\n\n6. **Юрій робить**: self-фідбек.\n\n7. **Я кажу**: «Мій фідбек: …»\n\n8. **Я кажу** (опційно): «Ще одна фраза: **«Я теж боявся. І це нормально.»** Це класичний приклад Дениса. Скажи її так, ніби вже зустрівся з людиною, ділишся минулим, без високої позиції.»\n\n9. **Юрій робить**: записує другу.\n\n10. **Я кажу**: «Тепер контраст: скажи \"Я теж боявся\" ВОЇНОМ (з твердістю). А потім ДРУГОМ. Послухай різницю.»\n\n11. **Юрій робить**: 2 дублі.\n\n12. **Я кажу**: «Цей контраст показує: одне й те ж \"Я теж боявся\" — у воїна звучить ЯК ВИКЛИК, у друга — ЯК ПІДТРИМКА. Ось різниця передачі стану.»",
    "criteria": "- [ ] **Темп** — повільніше за воїна, швидше за мудреця (~130-140 слів/хв).\n- [ ] **Pitch** — НЕ нижче (як мудрець) і НЕ нижньо-середнє (як воїн). Друг — у звичайному регістрі Юрія, з легкою «співучістю» / варіацією.\n- [ ] **Усмішка чується** — навіть в аудіо. Якщо ти зараз посміхаєшся коли говориш, у голосі це чути. Друг — посміхається. Воїн — ні.\n- [ ] **«Ми» більше «ти»** — інклюзивна лексика. У фразі «складно зробити перший крок» — не «вам складно», а «складно» (загальнолюдське).\n- [ ] **Без тиску** — слухач не повинен почути імператив. Голос звучить як «я поряд, я зрозумів», а не «ти маєш».",
    "mistakes": "- ❌ **Юрій звучить як терапевт / коуч** — професійне співчуття. Це не зовсім друг. Друг — менш дистанційний, більш «своя людина», на рівні.\n- ❌ **Перебір емпатії** — голос ламається, слухач відчуває жаль. Друг ≠ жалість. Підтримка ≠ співчуття.\n- ❌ **Юрій звучить як мама / нянька** — м'якіше, ніж треба. Це паттерн опіки, не дружби. Друг — підтримує, але вірить в твої сили.\n- ❌ **Голос невпевнений (тихо, з хитанням)** — друг не сумнівається, він підтримує впевнено. М'якість ≠ невпевненість.\n- ❌ **Юрій лишається у своєму звичайному тоні** — без зміни енергії. Тоді це не тренування тону, а просто читання.",
    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я слухаю:\n  - **Smile-in-voice**: чи чути усмішку. Це і pitch вищий, і голос «світліший». Якщо є — друг. Якщо рівний/похмурий — не друг.\n  - **Pitch variation**: середня (більша за воїна, менша за чарівника). Друг — мелодичний, але не співає.\n  - **Pace**: розслаблений (не швидкий, не повільний).\n  - **Modulation**: легка співучість, особливо на словах підтримки («розумію», «нормально»).\n  - **Closure**: фрази закінчуються плавно вниз (на відміну від воїна — на відкритому знаку).\n- **Відеозапис**: дивлюсь на:\n  - Легка усмішка (м'яка, не широка).\n  - Розслаблена постава (не нагнут уперед).\n  - Очі — м'які, добрі (НЕ напружені фокусом як у воїна).\n  - Руки — відкриті долоні (а не стиснуті кулаки).",
    "verbatim": "> \"Друг: Енергія: підтримка, прийняття, м'якість. Коли використовувати: особисті історії; визнання помилок; робота з болем аудиторії. Як звучить: м'який темп; легка усмішка; більше «ми»; менше тиску.\" — [slide 53]\n\n> \"«Я розумію, як складно зробити перший крок, особливо коли страшно.» Як читати: м'яко, трохи тепліше, ніж зазвичай, із легкою підтримкою в голосі.\" — [slide 58]\n\n> \"Тон друга, він звучить дружелюбно, звичайно, тепло, емпатично, в контакті, з легкою ухилкою, ну от без понтов, без пафосу. Звичайно, ти є, я є, я тебе відчуваю, я тебе розумію, я тебе готовий підтримувати, я тут, я близько.\" — [video 03:13:00]\n\n> \"Цей тон, який призваний створювати, на рівні, близькості, довіри, розуміння. Тобто коли ми ділимося сокровищами, коли ми відкриваємося.\" — [video 03:13:27]"

    "meta": "Освоїти тон ЧАРІВНИКА — розширення, уява, перспектива, бачення майбутнього. Використовується коли описуєш точку Б, кажеш «уяви що...», малюєш образ майбутнього. Денис: «Чим м'якше річ — тим більше грошей. Дім мовлення і дім грошей дуже зв'язані (по астрології)».",
    "instruction": "1. **Я кажу Юрію**: «Останній з 4-х тонів — Чарівник. Це бачення майбутнього, уява, розширення. Уяви, що ти описуєш людині, як виглядатиме її життя через рік, якщо вона зробить крок. Або як виглядатимуть її стосунки, якщо вона почне говорити правду. Голос трохи вищий, образи, паузи перед сильними словами. Готовий?»\n\n2. **Юрій робить**: підтверджує (вмикає запис).\n\n3. **Я кажу**: «Фраза:\n   **«Уявіть, яким стане ваш рік, якщо ви дозволите собі рости.»**\n\n   Як читати:\n   - натхненно\n   - з легким підйомом інтонації на слові «уявіть»\n   - трохи вищий тон ніж зазвичай\n   - образні фрази\n   - паузи ПЕРЕД сильними словами («рік», «рости»)\n\n   Скажи.»\n\n4. **Юрій робить**: записує.\n\n5. **Я кажу**: «Прослухай. Чи відчуваєш картинку майбутнього? Чи звучить як констатація?»\n\n6. **Юрій робить**: self-фідбек.\n\n7. **Я кажу**: «Мій фідбек: …»\n\n8. **Я кажу** (опційно — Юрію розповідаю кейс Наталії): «Кейс з курсу: учасниця Наталія прочитала цю фразу і ДУМАЛА що це чарівник. Денис почув як ВОЇН. Сказав: \"Ми можемо думати по одному, а світ чує по-іншому\". Це частий патерн — внутрішнє відчуття не дорівнює тому що чує аудиторія. Перевір себе ще раз.»\n\n9. **Юрій робить**: 2-й дубль з усвідомленням.\n\n10. **Я кажу**: «Контраст-вправа. Скажи цю фразу ВОЇНОМ (твердо, як виклик). А потім ЧАРІВНИКОМ. Послухай: одна фраза, два різних світи.»\n\n11. **Юрій робить**: 2 дублі.\n\n12. **Я кажу**: «Зверни увагу — у Чарівника людина МАЛЮЄ внутрішню картинку. У Воїна — людина ЗАСТАВЛЯЄТЬСЯ до дії. Це фундаментально різні впливи.»",
    "criteria": "- [ ] **Pitch** — ВИЩЕ за звичайний (на 10-20%). Чарівник звучить «легше», «світліше».\n- [ ] **Темп** — середній (близький до Друга), з помітними паузами.\n- [ ] **Паузи ПЕРЕД сильними словами** — це маркер. «...яким стане ваш [ПАУЗА] рік...». Це створює очікування образу.\n- [ ] **Образна лексика** — Юрій додає словесні картинки, навіть якщо фраза стандартна. «Уявіть» — це команда уяви, не питання.\n- [ ] **Динаміка тону** — більша варіація pitch (співучість), ніж у воїна.\n- [ ] **Енергія розширення** — слухач відчуває «можливість» (не «обов'язок» як у воїна, не «спокій» як у мудреця).",
    "mistakes": "- ❌ **Звучить як воїн.** Найчастіша помилка (кейс Наталії). Юрій каже «Уявіть...» твердо, як викликаючи до дії. Це не чарівник. Чарівник СПОКУШАЄ майбутнім, не заставляє його уявити.\n- ❌ **Звучить як соблазнітель.** Перебір з «спокушанням» — тихо, нижче тону, з паузами в неправильних місцях. Кейс Катерини з курсу: думала «чарівник», Денис почув «соблазнітель». Чарівник — інтимність, але БЕЗ еротичного контексту. Відстань менша, ніж у мудреця, але більша, ніж у соблазна.\n- ❌ **Абстракція.** Юрій говорить занадто узагальнено: «ваш рік стане кращим». Це не картинка. Денис: «Опасність — піти в абстракцію». Конкретика образу: «ви виступаєте на тисячі людей», «ви прокидаєтесь о 5 ранку з ентузіазмом».\n- ❌ **Перебір театрального пафосу.** «УЯ-А-А-ВІТЬ!» — це театр. Чарівник — спокійний всередині, з натхненням у голосі.\n- ❌ **Юрій застосовує чарівника в ОПИСІ минулого** — він тільки для МАЙБУТНЬОГО. «Уявіть, яким був мій рік...» = ні. «Уявіть, яким стане ваш рік...» = так.",
    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я слухаю:\n  - **Pitch elevation**: вищий за base-line (на 10-20% Hz).\n  - **Pitch variation**: широка (мелодична). Якщо рівний — не чарівник.\n  - **Pre-word pause**: чи є мікропауза (200-500ms) перед сильними словами («рік», «рости», «дозволите»). Це маркер чарівника.\n  - **Pace**: середній (140 слів/хв), не швидкий.\n  - **Tone color**: «світлий» (звукове сприйняття). Якщо приземлений — не чарівник.\n- **Відеозапис**: дивлюсь на:\n  - Очі — підняті трохи вгору або в бік (немов бачить образ).\n  - Усмішка легка — натхненна, не широка.\n  - Жести — м'які, ширші, відкриті (на відміну від компресії воїна).\n  - Голова трохи нахилена в бік / уперед — символіка «дивитися в майбутнє».",
    "verbatim": "> \"Чарівник: Енергія: розширення, уява, перспектива. Коли використовувати: бачення майбутнього; опис результату; фінал; надихаючий блок. Як звучить: трохи вищий тон; образні фрази; паузи перед сильними словами.\" — [slide 55]\n\n> \"«Уявіть, яким стане ваш рік, якщо ви дозволите собі рости.» Як читати: натхненно, з легким підйомом інтонації на слові «уявіть».\" — [slide 58]\n\n> \"Волшебник – це той, хто створює перспективу, створює майбутнє, він дає відвідування, вдохновення, масштаб, ось ця енергія такого розширення, перспектив, щастя, що отам вперед щаслива життя.\" — [video 03:15:31]\n\n> \"Так, ми можемо думати по одному, а світ чує по-іншому. І взагалі ось цей черівник на рівні карми і езотерики, чим м'якше річ, тим більше грошей, чим більше воїнственності, тим більше конфліктів в житті.\" — [video 03:29:40]"
  },

    "meta": "Розширити голосовий діапазон через серію коротких фраз від імені 25+ різних персонажів. Це КАРДИНАЛЬНА вправа уроку для тренінгу гнучкості голосу — після неї 4 базові тони (мудрець/воїн/друг/чарівник) стають набагато доступнішими. Денис використовує її як головну практичну активацію на лекції.",
    "instruction": "Це довга вправа (30 хв повна серія). Я раджу розбити на 3 сесії по ~10 хв (8-9 персонажів за сесію). Між сесіями — 1 день. **ОБОВ'ЯЗКОВО запис кожної фрази** (Wispr).\n\n### Підхід\n\n1. **Я кажу Юрію**: «Зараз ми пройдемо 26 персонажів. Кожен — одна фраза + інструкція \"як читати\". Тривалість всієї серії — 30 хв. Можемо за раз зробити 8-9 (1/3), або всю серію. Як хочеш?»\n\n2. **Юрій робить**: вибирає темп (рекомендую — 1/3 за раз).\n\n3. **Я кажу**: «Перед кожним персонажем я даю інструкцію. Ти 2-3 секунди налаштовуєшся (можна заплющити очі, уявити персонажа) → говориш → ми йдемо далі. Не критикуй себе по ходу. Ми розбираємо після всієї серії або після 1/3. Готовий записувати?»\n\n### Сесія 1 — 4 базові тони + 4 контрастні (~10 хв)\n\n4. **Я кажу**: «**Персонаж 1 — МУДРЕЦЬ.** \"Іноді найважливіші рішення приймаються в повній тиші та внутрішній ясності.\" Як: повільно, з паузами, нижче темпу.»\n\n5. **Юрій робить**: записує.\n\n6. **Я кажу**: «**Персонаж 2 — ВОЇН.** \"Або ви починаєте діяти сьогодні, або продовжуєте пояснювати собі причини.\" Як: коротко, твердо, без усмішки.»\n\n7. **Юрій робить**: записує.\n\n8. **Я кажу**: «**Персонаж 3 — ДРУГ.** \"Я розумію, як складно зробити перший крок, особливо коли страшно.\" Як: м'яко, тепліше, з підтримкою.»\n\n9. **Юрій робить**: записує.\n\n10. **Я кажу**: «**Персонаж 4 — ЧАРІВНИК.** \"Уявіть, яким стане ваш рік, якщо ви дозволите собі рости.\" Як: натхненно, з підйомом на \"уявіть\".»\n\n11. **Юрій робить**: записує.\n\n12. **Я кажу**: «**Персонаж 5 — П'ЯНИЙ.** \"Я взагалі-то давно хотів це сказати, але все якось не наважувався.\" Як: трохи розтягуючи слова, розслаблено, з нерівним ритмом.»\n\n13. **Юрій робить**: записує.\n\n14. **Я кажу**: «**Персонаж 6 — ЗАМЕРЗЛИЙ.** \"Можна швидше закінчити розмову, тут дійсно дуже холодно.\" Як: з легкою форсованою дрижею, через напружені губи.»\n\n15. **Юрій робить**: записує.\n\n16. **Я кажу**: «**Персонаж 7 — НАЙГІРШИЙ АКТОР.** \"Це був найдраматичніший момент в історії людства, повірте мені.\" Як: надмірно театрально, переграючи.»\n\n17. **Юрій робить**: записує.\n\n18. **Я кажу**: «**Персонаж 8 — ПІСЛЯ МАРАФОНУ.** \"Я добіг до кінця і зрозумів, що межі існують тільки в голові.\" Як: через збите дихання, але з гордістю.»\n\n19. **Юрій робить**: записує.\n\n### Сесія 2 — професійні / соціальні архетипи (~10 хв)\n\n20. **Я кажу**: «**Персонаж 9 — НАЙКРАЩИЙ АКТОР.** \"Того дня я просто вибрав не відступати і йти далі.\" Як: спокійно, мінімалістично, без зайвих рухів.»\n\n21. **Я кажу**: «**Персонаж 10 — СПОКУСНИК.** \"Мені подобається, коли людина говорить повільно і дивиться прямо в очі.\" Як: повільно, нижче звичайного тону, з паузами.»\n\n22. **Я кажу**: «**Персонаж 11 — БАТЮШКА.** \"Нехай у вашому серці буде мир і впевненість у завтрашньому дні.\" Як: м'яко, благословляючи, розмірено.»\n\n23. **Я кажу**: «**Персонаж 12 — З МАЛЕНЬКИМ КОШЕНЯМ.** \"Йди сюди, маленький, я тебе не ображу.\" Як: ніжно, з усмішкою, зменшувально-пестливо.»\n\n24. **Я кажу**: «**Персонаж 13 — СТАРИЙ ПРОСИТЬ МИЛОСТИНЮ.** \"Синку, допоможи трохи, дорога була довгою і важкою.\" Як: тихо, надломлено, через втому.»\n\n25. **Я кажу**: «**Персонаж 14 — ЗЛИЙ НАЧАЛЬНИК.** \"Я чекаю на конкретний результат до завтрашнього ранку без виправдань.\" Як: холодно, рівно, з тиском.»\n\n26. **Я кажу**: «**Персонаж 15 — ОСЬ-ОСЬ ЧХНЕШ.** \"Почекай секунду, мені здається, зараз щось станеться.\" Як: з наростаючою напругою у голосі.»\n\n27. **Я кажу**: «**Персонаж 16 — НАТХНЕННИЙ СТАРТАПЕР.** \"Ми змінюємо ринок, і це тільки початок нашого зростання.\" Як: швидко, енергійно, з вогнем в очах.»\n\n28. **Я кажу**: «**Персонаж 17 — ТАЄМНИЙ АГЕНТ.** \"Є інформація, яку я можу передати тільки особисто.\" Як: тихіше, ніж зазвичай, із легкою загадковістю.»\n\n### Сесія 3 — емоційні стани + контрасти (~10 хв)\n\n29. **Я кажу**: «**Персонаж 18 — ПОЛІЦЕЙСЬКИЙ.** \"Пред'явіть документи і дайте відповідь на кілька уточнюючих запитань.\" Як: формально, сухо, без емоцій.»\n\n30. **Я кажу**: «**Персонаж 19 — ВИГРАВ МІЛЬЙОН.** \"Я досі не вірю, що це справді сталося.\" Як: з подивом і радістю.»\n\n31. **Я кажу**: «**Персонаж 20 — ВТОМЛЕНИЙ БАТЬКО/МАТИ.** \"Давай просто закінчимо це сьогодні і спокійно ляжемо спати.\" Як: втомлено, але з турботою.»\n\n32. **Я кажу**: «**Персонаж 21 — ПРОГРАВ УСЕ.** \"Сьогодні я зрозумів, що почав усе спочатку.\" Як: повільно, важко, з паузами.»\n\n33. **Я кажу**: «**Персонаж 22 — САРКАСТИЧНО.** \"Звісно, це був ідеальний план, як і завжди.\" Як: з легкою іронією, трохи розтягуючи слова.»\n\n34. **Я кажу**: «**Персонаж 23 — КАЖЕШ СЕКРЕТ.** \"Я скажу це тихо, тому що не всі мають почути.\" Як: напівпошепки, довірливо.»\n\n35. **Я кажу**: «**Персонаж 24 — ЗАКОХАНИЙ ПІДЛІТОК.** \"Мені здається, коли ти поруч, усе стає по-справжньому важливим.\" Як: ніяково, щиро, трохи плутано.»\n\n36. **Я кажу**: «**Персонаж 25 — ОРАТОР НА СТАДІОНІ.** \"Сьогодні ми тут, щоб змінити правила цієї гри!\" Як: голосно, широко, з масштабом.»\n\n37. **Я кажу**: «**Персонаж 26 — ПІСЛЯ ВАЖКОГО РІШЕННЯ.** \"Це було непросто, але я знаю, що вчинив правильно.\" Як: спокійно, з внутрішньою твердістю.»\n\n38. **Я кажу**: «**Персонаж 27 — ЩОБ НЕ РОЗБУДИТИ ДИТИНУ.** \"Будь ласка, говори тихіше, він тільки-но заснув.\" Як: максимально тихо, обережно.»\n\n39. **Я кажу**: «**Персонаж 28 — ДУЖЕ СОРОМ'ЯЗЛИВИЙ.** \"Я не впевнений, що варто це говорити вголос.\" Як: тихо, уникаючи зорового контакту.»\n\n40. **Я кажу**: «**Персонаж 29 — ЛІДЕР ІЗ ВНУТРІШНЬОЮ СИЛОЮ.** \"Ми йдемо вперед, тому що іншого шляху для нас немає.\" Як: спокійно, вагомо, без зайвої експресії.»\n\n41. **Я кажу**: «**Персонаж 30 — МОТИВАЦІЙНИЙ СПІКЕР 2000-Х.** \"Ви можете більше, ніж думаєте, просто почніть діяти сьогодні!\" Як: надмірно бадьоро, енергійно. (Денис: \"Тоні Робінс у худшому перекладі\".)»\n\n### Post-mortem\n\n42. **Я кажу**: «Дякую. Прослухай всі записи підряд. Які 3 персонажі вийшли НАЙКРАЩЕ? Які 3 — НАЙГІРШЕ?»\n\n43. **Юрій робить**: self-фідбек.\n\n44. **Я кажу**: «Мій фідбек: …». Я даю конкретику по 3-5 найслабших — що в голосі / темпі / pitch треба підправити.\n\n45. **Я кажу**: «Запам'ятай: твої 3 НАЙСКЛАДНІШІ персонажі — це твої \"слабі тони\". Треба практикувати саме їх. А 3 НАЙКРАЩІ — це твоя природна сильна сторона.»",
    "criteria": "- [ ] Усі 30 (або 26 з основного списку) записані як окремі дублі (з паузами між)\n- [ ] Кожен персонаж звучить ВІДМІННО від інших (НЕ всі однаково)\n- [ ] Контрастні пари (Воїн ↔ Друг; Мудрець ↔ Спокусник; Найгірший актор ↔ Найкращий) — реально протилежні\n- [ ] Юрій сам зміг диференціювати при прослуховуванні\n- [ ] Фізіологічні «складні» персонажі (Замерзлий, Після марафону, Ось-ось чхнеш) — мають тілесні маркери в голосі (дрижання, збите дихання, наростаюча напруга)\n- [ ] «Мотиваційний спікер 2000-х» НЕ змішується з «Чарівник» (різні енергії)",

    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я слухаю кожен запис окремо:\n  - Для базових тонів (1-4) — критерії з ex-03-ex-06.\n  - Для фізіологічних персонажів — є тілесні маркери:\n    - Замерзлий: дрижання голосу (мікротремор)\n    - Після марафону: збите дихання чути перед фразою\n    - Ось-ось чхнеш: голос обривається, наростає напруга\n    - Чарівник vs Спокусник: chаrвник вище pitch, шіроке; спокусник нижче, з паузами\n  - Для емоційних — pitch + tempo + modulation профіль:\n    - Виграв мільйон: pitch вгору, варіація широка, темп швидкий\n    - Програв все: pitch вниз, варіація мала, темп повільний з паузами\n    - Саркастично: pitch варіація умовна (співучість), tempo нерівний\n- **Відеозапис**: бонус. Дивлюся на:\n  - Мімика (фізіологічні персонажі мають мімічні маркери — зіщулене обличчя у замерзлого, відвернутий погляд у сором'язливого).\n  - Поза (натхненний стартапер — вперед; програв все — обвисло).\n  - Жести (оратор на стадіоні — широкі; кажеш секрет — ближче до тіла).",

    "preliminaryId": "derived from PE-03-06 + Anastasia drill",
    "meta": "Натренувати ПЕРЕКЛЮЧЕННЯ тонів на ОДНІЙ фразі. Це найкритичніший skill для оратора — слухач має чути не текст, а стан. Денис: «Ми ловимо навіть не логіку, ми ловимо її стан». Без переключення на одній фразі — спікер звучить плоско (моноструктура).",
    "instruction": "Це drill переключення. 5 хв, обов'язково запис.\n\n1. **Я кажу Юрію**: «Зараз — головний drill уроку. Беремо ОДНУ фразу і кажемо її в 4-х тонах. Між словами нічого не змінюється. Між тонами — все. Це покаже тобі ЯКЕ переключення ти вже маєш, а в яких — ще тільки тренуєшся.»\n\n2. **Юрій робить**: підтверджує (вмикає запис).\n\n3. **Я кажу**: «Фраза:\n   **«Або ви починаєте діяти сьогодні, або продовжуєте пояснювати собі причини.»**\n\n   Скажи її 4 рази, з паузою 5 сек між. Кожен раз — у новому тоні.»\n\n4. **Я кажу**: «**Дубль 1 — МУДРЕЦЬ.** Спокійно, з паузами, нижче темпу. Як висновок із досвіду.»\n\n5. **Юрій робить**: записує.\n\n6. **Я кажу**: «**Дубль 2 — ВОЇН.** Твердо, чітко, виклик до дії. Кінець на відкритому знаку, не вниз.»\n\n7. **Юрій робить**: записує.\n\n8. **Я кажу**: «**Дубль 3 — ДРУГ.** М'яко, з підтримкою, \"я поряд\". Не виклик — запрошення.»\n\n9. **Юрій робить**: записує.\n\n10. **Я кажу**: «**Дубль 4 — ЧАРІВНИК.** Натхненно, з образом майбутнього. Спробуй \"продовжуєте пояснювати причини\" сказати з легким смутком, а \"починаєте діяти\" — з натхненням.»\n\n11. **Юрій робить**: записує.\n\n12. **Я кажу**: «Прослухай свої 4 версії підряд. Чи відчуваєш різницю стану? Чи всі 4 звучать однаково?»\n\n13. **Юрій робить**: self-фідбек.\n\n14. **Я кажу**: «Мій фідбек: …». Конкретно по кожному дублю.\n\n15. **Я кажу**: «Інсайт Анастасії з курсу: якщо взяти ТЕКСТ ВОЇНА і прочитати його МУДРЕЦЕМ — це створює розрив шаблону. Аудиторія чекає агресії — а отримує спокій. Це момент, коли можна включити аудиторію. Спробуй?»\n\n16. **Юрій робить**: записує 5-й дубль — текст воїна, тон мудреця.\n\n17. **Я кажу**: «Якщо все 4 версії звучать однаково — твоє переключення тону ще \"застрягло\". Слабкий тон з 4-х треба окремо тренувати (ex-03 / ex-04 / ex-05 / ex-06). Якщо є різниця, але слабка — нормально, продовжуй практику. Якщо різниця чітка — ти готовий до структур (ex-09 AIDA, ex-10 Ескалація, ex-11 Живе коло).»",
    "criteria": "- [ ] Усі 4 дублі записані як окремі (паузи між 5+ сек)\n- [ ] Кожен дубль АУДИТИВНО відмінний (НЕ просто «гучніше / тихіше»)\n- [ ] Темп: мудрець < друг < чарівник < воїн (умовно — воїн швидший)\n- [ ] Pitch: мудрець < воїн ≤ друг < чарівник\n- [ ] Закінчення: мудрець — лінійне, воїн — відкритий знак, друг — плавно вниз, чарівник — варіативно\n- [ ] Юрій сам чує різницю при self-фідбеку",
    "mistakes": "- ❌ **Усі 4 версії звучать однаково.** Це найчастіше. Юрій лишився у звичайному голосі, лише змінив гучність / темп. Перезаписати з усвідомленням енергії, не лише техніки.\n- ❌ **Воїн = крик.** Юрій підіймає гучність, не переключається на твердість. Перезаписати без гучності, тільки тон твердий.\n- ❌ **Мудрець = втома.** Юрій уповільнюється, і тон стає «надломленим». Втома ≠ мудрість. Втомлений = після марафону. Мудрець = спокій з силою.\n- ❌ **Чарівник = театр.** Юрій робить пафос. Натхнення ≠ пафос. Чарівник всередині спокійний, у голосі — образ майбутнього.\n- ❌ **Друг = м'якість невпевненості.** Юрій говорить тихо, з хитанням. Не друг. Друг — м'яко, але впевнено.\n- ❌ Юрій не робить self-фідбек (запис → відсилає мені без прослухав сам). Тоді він не натренує внутрішнього сухача.",
    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я перевіряю 4 дублі по таблиці:\n\n  | Параметр        | Мудрець         | Воїн              | Друг        | Чарівник               |\n  | --------------- | --------------- | ----------------- | ----------- | ---------------------- |\n  | Pitch base      | низький         | низько-середній   | звичайний   | вищий                  |\n  | Pitch variation | мала            | вузька            | середня     | широка                 |\n  | Tempo (слів/хв) | <120            | 140-160           | 130-140     | 140                    |\n  | Pauses          | довгі (1-2 сек) | короткі (0.5 сек) | помірні     | перед сильними словами |\n  | Closure         | лінійно         | відкритий знак    | плавно вниз | варіативно             |\n  | Smile-in-voice  | мінімум         | мінімум           | є           | є                      |\n\n- **Відеозапис**: ідеально. Можна побачити перехід у позі (стан тіла часто змінюється раніше за голос).",
    "verbatim": "> \"Ми читали одну фразу, один і той же логічний контекст, один і той же смисл... І коли вона читала його мудрецем, там була одна-два-одна енергія, воїном – інша, п'яним – третя, і ми ловимо навіть не логіку, ми ловимо її стан. Тому тони голосу мега важливі.\" — [video 03:24:47]\n\n> \"Я зрозуміла. Беруть текст воїна, і, наприклад, зараз я прочиту, пам'ятаєте, то включає аудиторію і йде розрив шаблону. Ось як воїн може прочитати, мудрець воїна прочитати... І ось, вроді як чекають агресію, а виходить як мудрець. Ось в цей момент можна якраз включити аудиторію.\" — [video 03:23:03]\n\n> \"Так, ми можемо думати по одному, а світ чує по-іншому.\" — [video 03:29:40]"
