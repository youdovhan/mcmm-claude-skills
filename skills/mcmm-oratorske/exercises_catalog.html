    "meta": "Прокласти ПОВНУ ПОСЛІДОВНІСТЬ ТОНІВ через структуру AIDA — від Attention до Action. Це структура для холодної аудиторії, де тон ОСОБЛИВО важливий, бо ведеш людину з нуля до конкретного кроку. Денис: «Тут не можна тиснути. Тут потрібно зблизитися. Тут — зона бачення. Тут — імпульс».",
    "instruction": "Це drill з 4-х блоків AIDA + переключень. Можна на дениковому тексті (для першого разу) АБО на власному (рекомендую — для глибшого ефекту).\n\n### Підготовка\n\n1. **Я кажу Юрію**: «Розгорнемо AIDA з повним тональним перемиканням. Послідовність: Attention = ВОЇН → Interest = ДРУГ → Desire = ЧАРІВНИК → Action = ВОЇН (спокійний). Денисів готовий текст, чи хочеш свій?»\n\n2. **Юрій робить**: вибирає (Денисів — швидше; свій — глибше).\n\n### Варіант А — Денисів текст\n\n3. **Я кажу**: «Текст з курсу. 4 блоки. Між ними пауза 3-5 сек.\n\n   **Attention — ВОЇН** (твердий, чіткий, без зайвих емоцій): \"Більшість експертів не ростуть не через брак знань.\"\n\n   **Interest — ДРУГ** (теплий, розуміючий): \"Я знаю, як важко вийти в ефір, коли всередині є сумнів.\"\n\n   **Desire — ЧАРІВНИК** (натхненний, розширює горизонти): \"Уявіть, що за рік ви спокійно виступаєте на великих майданчиках.\"\n\n   **Action — ВОЇН СПОКІЙНИЙ** (впевнений, без агресії): \"Якщо хочете системно вибудувати виступи — приходьте.\"\n\n   Готовий записувати? Кожен блок — окремо.»\n\n4. **Юрій робить**: записує 4 блоки.\n\n### Варіант Б — свій текст\n\n3-б. **Я кажу**: «Свій текст. Тема — твоя експертиза. Я допоможу написати 4 блоки.\n\nAttention: ВОЇН — твердий хук про твою цільову аудиторію. Що для них головна омана?\n\nInterest: ДРУГ — теплий контакт зі знайомим болем. \"Я знаю як це, бо сам через це пройшов\".\n\nDesire: ЧАРІВНИК — натхненний образ майбутнього. \"Уявіть, що за X місяців у вас...\"\n\nAction: ВОЇН СПОКІЙНИЙ — заклик до дії. Без тиску, але впевнено.»\n\n4-б. **Юрій робить**: пише 4 блоки.\n\n5-б. **Я кажу**: «Перевіримо:\n\n- Attention НЕ м'який (тільки м'який = провал, бо холодна аудиторія)\n- Action НЕ виправдовується (тільки тверда впевненість)\n- Interest НЕ зверху (інакше втратиш контакт)\n- Desire НЕ абстракція (конкретний образ майбутнього)\n\nГотовий записувати?»\n\n6-б. **Юрій робить**: записує 4 блоки.\n\n### Post-mortem\n\n7. **Я кажу**: «Тепер послухай 4 блоки підряд. Чи відчуваєш переходи? Чи це звучить як ОДИН моноголос, чи як 4 різні енергії в одній особі?»\n\n8. **Юрій робить**: self-фідбек.\n\n9. **Я кажу**: «Мій фідбек: …». Особливо — на ПЕРЕХОДАХ:\n   - Воїн → Друг: чи знизилася твердість? Чи з'явилася теплота?\n   - Друг → Чарівник: чи pitch піднявся? Чи з'явилися паузи перед сильними словами?\n   - Чарівник → Воїн: чи повернулася твердість, але БЕЗ агресії?\n\n10. **Я кажу**: «Тепер запиши все 4 ОДНИМ дублем, без пауз між блоками. Це покаже, чи можеш ти триматися структури і тонів у живому потоці.»\n\n11. **Юрій робить**: 5-й дубль єдиним потоком.",
    "criteria": "- [ ] Усі 4 блоки записані окремо + 1 єдиний потік\n- [ ] Attention (Воїн) — твердість, без м'якості; pitch низько-середній; кінець на відкритому знаку\n- [ ] Interest (Друг) — теплота, «ми»-лексика; smile-in-voice\n- [ ] Desire (Чарівник) — pitch вище, паузи перед «уявіть», образ майбутнього\n- [ ] Action (Воїн спокійний) — впевненість БЕЗ агресії, без виправдовування\n- [ ] Переходи відчутні навіть у єдиному потоці\n- [ ] Денис прямо: «Тут не можна тиснути» (на Interest) — Юрій не тисне; «Тут не виправдовуватися» (на Action) — Юрій не виправдовується",

    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ для самого drill'у. Але підготовку свого AIDA можна писати текстом.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я слухаю:\n  - **Pitch evolution**: 4 блоки повинні мати ВІДМІННІ pitch-профілі (Attention низько → Interest середньо → Desire високо → Action знов низько).\n  - **Tempo evolution**: швидкий → повільний → середній → впевнено-неспішний.\n  - **Energy evolution**: tension → empathy → expansion → return-to-action.\n  - **Transition smoothness**: у єдиному потоці — чи плавні переходи, чи стрибки.\n- **Відеозапис**: дивлюсь на:\n  - Постава змінюється з блоку в блок (Воїн — пряма, Друг — розслаблена, Чарівник — трохи відкрита, Action — знов пряма).\n  - Жести (Воїн мінімальні, Друг відкриті, Чарівник широкі, Action чіткі).\n  - Очі (Воїн фокусовані, Друг м'які, Чарівник «бачать майбутнє», Action знов фокусовані).",

ибший.»\n\n### Post-mortem\n\n8. **Я кажу**: «Послухай 4 блоки підряд. Ескалація має створювати ЕМОЦІЙНУ ДУГУ. Чи відчуваєш ти, що твій запис тримає цю дугу — від спокою через напругу до кульмінації і назад до розуму?»\n\n9. **Юрій робить**: self-фідбек.\n\n10. **Я кажу**: «Мій фідбек: …». Особливо на:\n    - Перехід Мудрець → Друг → Воїн у Загостренні (один з найскладніших — два мікро-переключення в одному блоці).\n    - Точка кипіння — це ВЕРХІВКА. Якщо вона звучить як решта блоків, це фейл.\n    - Рішення — це РЕЛАКС. Якщо тут лишилась напруга — структура не закрита.\n\n11. **Я кажу**: «А тепер єдиним потоком, всі блоки підряд без зупинок. Це покаже чи можеш ти проходити повну ескалаційну дугу у живому виступі.»\n\n12. **Юрій робить**: записує єдиним потоком.",

    "adaptations": "- **Текст**: НЕ ПРАЦЮЄ. Підготовка тексту — можна.\n- **Голос (Wispr/audio)**: ОСНОВНИЙ. Я слухаю:\n  - **5 окремих pitch-профілів**: середній → низько (мудрець) → коротке низько-середнє (воїн) → знов низько → вище (чарівник).\n  - **Tempo evolution**: розслаблено → повільно → швидко → повільно → м'яко.\n  - **Емоційна температура**: тепло → глибина → напруга → стабільність → натхнення.\n  - **Closure кожного блоку**: чи зрозуміло, де блок закінчується (інакше слухач не переключиться).\n- **Відеозапис**: бажано. Дивлюсь на:\n  - Тіло (Друг розслаблено → Мудрець стійко → Воїн стиснуто → Мудрець стійко → Чарівник відкрито).\n  - Очі (м'які → глибокі → фокусовані → глибокі → відкриті, дивляться вдалечінь).\n  - Жести (м'які → мінімум → коротко-чіткі → мінімум → м'які-широкі).",
    "verbatim": "> \"ЖИВЕ КОЛО. Найлюдяніша структура. Історія — ДРУГ — Тон теплий. Ви розповідаєте як людина. Усвідомлення — МУДРЕЦЬ — Уповільнюєтеся. Тут глибина. Перелом — ВОЇН — Точка вибору. Це кульмінація. Принцип — МУДРЕЦЬ — Спокійний висновок. Завершення — ЧАРІВНИК — М'яке натхнення.\" — [slide 66]\n\n> \"Я довго уникав великих виступів. І в якийсь момент я зрозумів. Я або продовжую виправдовуватися, або виходжу. Структура знижує тривогу. І кожен із вас може пройти цей шлях.\" — [slide 66]\n\n> \"Ідеальна послідовність: Друг → Мудрець → Воїн → Мудрець → Чарівник.\" — [slide 66]\n\n> \"О, от це прекрасний волшебник був, Альона. Просто прекрасний.\" — [video 03:53:26]\n\n> \"Це людська структура. Ми починаємо з тону голосу «друг», теплий тон, ми розповідаємо, як звичайний людина.\" — [video 03:51:22]"

    "meta": "Звузити увагу до однієї навички перед виступом. Перестати боротися з собою (всі 8 фокусів одразу), а тренувати конкретний елемент як у спорті. Денис: «Не \"виступаю ідеально\", а \"сьогодні я треную ...\"». Це антидот перфекціонізму спікера.",
    "instruction": "Це pre-flight ритуал перед виступом (не drill, а mental-reframe). 5 хв перед виходом.\n\n1. **Я кажу Юрію**: «Зараз я задам тобі 3 питання — короткий ритуал перед твоїм виступом. Це техніка \"Один фокус\". Готовий?»\n\n2. **Юрій робить**: підтверджує.\n\n3. **Я кажу**: «Перше питання. ЯКИЙ виступ у тебе сьогодні? (формат, тема, тривалість, аудиторія)»\n\n4. **Юрій робить**: коротко описує.\n\n5. **Я кажу**: «Друге питання. Перепиши свою мету. Стара формула: \"Я хочу виступити ідеально\". Нова формула: \"Сьогодні я тренують ...\" — і назви ОДНУ конкретну навичку з 8:\n   1. Паузи\n   2. Дихання\n   3. Контакт очима\n   4. Структура\n   5. Кульмінація\n   6. Тон (Воїн/Друг/Мудрець/Чарівник)\n   7. Тіло (без зайвих рухів)\n   8. Один тезіс\n\n   Що сьогодні?»\n\n6. **Юрій робить**: вибирає ОДИН фокус.\n\n7. **Я кажу**: «Третє питання. Все інше — ВІДПУСКАЄШ. Не оцінюєш. Можеш забути слово, зробити паузу не там, не дотягнути кульмінацію — це сьогодні НЕ оцінюється. ОК?»\n\n8. **Юрій робить**: підтверджує.\n\n9. **Я кажу**: «Сформулюй вголос: \"Сьогодні я тренують [фокус]. Усе інше — відпускаю\". Скажи це.»\n\n10. **Юрій робить**: говорить вголос.\n\n11. **Я кажу**: «Йди. Після виступу — повертайся. Обговоримо тільки цей фокус. Решта — не існує сьогодні.»\n\n12. **Юрій робить**: виступ.\n\n13. **Я кажу** (post): «Як пройшов фокус? Тільки про нього, нічого іншого зараз не обговорюємо.»\n\n14. **Юрій робить**: ділиться.\n\n15. **Я кажу**: «Фідбек по фокусу: …». Не виходимо за межі обраного.",

    "mistakes": "- ❌ **Юрій вибирає одразу 3 фокуси.** «Сьогодні я треную паузи, тон і кульмінацію». Це не «один фокус». Денис прямо: ОДИН. Звузити.\n- ❌ **Фокус занадто загальний.** «Сьогодні я тренують впевненість». Не конкретно. Що саме у впевненості? Pauses? Tone? Body? Вибрати конкретний.\n- ❌ **Юрій вибирає структуру в моменті.** Денис прямо: «На структурі тяжко фокусуватися в моменті. Структуру треба готувати ЗАЗДАЛЕГІДЬ». Структура — для pre-prep, не для моменту.\n- ❌ **Юрій оцінює виступ у пост-фідбеку за ВСІМА критеріями.** «А паузи були окей? А кульмінація?» Денис: ТІЛЬКИ обраний фокус. Решта не існує.\n- ❌ **Юрій не сформулював вголос.** Просто подумав. Тоді мозок не отримує чіткого завдання. ОБОВ'ЯЗКОВО вголос.",

    "verbatim": "> \"Практика «Один фокус». Формула: Не «виступаю ідеально». А «сьогодні я треную ... ». Мета: Звузити увагу до однієї навички, розвивати виступ як спортивне тренування, перестати боротися з собою і почати тренувати конкретний елемент. Як проводити практику: 1 Перед виступом ви обираєте ОДИН фокус. 2 Все інше відпускаєте. 3 Після виступу обговорюєте цей досвід зі своїм наставником.\" — [slide 68]\n\n> \"коли ми виходимо на сцену, ми виходимо з умоностроєнням не зробити щось ідеальне, не продати щось, не отримати якийсь конкретно визначений результат, корисний в цьому випадку. А ми виходимо з цілею отримати досвід. Сьогодні я треную щось одне і щось конкретне.\" — [video 03:55:27]\n\n> \"Це, знаєте, як в спорту. Якщо спортсмен не знає, що робити, баскетболіст, або він переживає за якийсь матч, можна дати йому таку тренування. Сьогодні ти концентруєшся тільки на пасі. Або сьогодні тільки на броскі і задуги. Тобто на чомусь одному, але конкретному. Це знижає бітонмішалку в голові і успокаєвує розум.\" — [video 03:59:33]"

дповідає.\n\n12. **Я кажу**: «Що б ти переробив у фокусі завтра? Тільки 1 річ.»\n\n13. **Юрій робить**: відповідає.\n\n14. **Я кажу**: «Зафіксуй: завтра твій фокус — той же чи інший?»",

    "instruction": "Це reference + assignment-генератор. Я веду Юрія через 8 фокусів. Юрій обирає 2-3 пріоритетні для своєї поточної фази проявленості.\n\n1. **Я кажу Юрію**: «Зараз я опишу 8 фокусів з курсу — їхнє завдання + навичку, яку розвивають. Після кожного — ти кажеш: цей мені (А) актуальний, (Б) маю, не треба, (В) поки рано. Це дасть нам коротко 2-3 фокуси, з яких я раджу почати.»\n\n2. **Я кажу**: «**Фокус 1 — ПАУЗИ.** Завдання: говорити повільніше, ніж зазвичай. Робити паузи ПІСЛЯ ключових фраз. Навичка: управління тишею. Денис: \"Уповільнення = впевненість\". А/Б/В?»\n\n3. **Юрій робить**: вибирає.\n\n4. **Я кажу**: «**Фокус 2 — ДИХАННЯ.** Завдання: не починати фразу без вдиху. Навичка: стійкість. Денис: \"Дихання вирівнює голос. Голос вирівнює стан\". А/Б/В?»\n\n5. **Юрій робить**: вибирає.\n\n6. **Я кажу**: «**Фокус 3 — КОНТАКТ ОЧИМА.** Завдання: утримувати погляд 3-5 секунд на одній людині. Навичка: впевненість. Денис: \"По людині одразу можна зазначити, наскільки йому легко витримувати зоровий контакт\". А/Б/В?»\n\n7. **Юрій робить**: вибирає.\n\n8. **Я кажу**: «**Фокус 4 — СТРУКТУРА.** Завдання: чітко означити початок, середину та кінець. Навичка: логіка. УВАГА: Денис прямо — на структурі тяжко фокусуватися В МОМЕНТІ. Структуру треба готувати ЗАЗДАЛЕГІДЬ. А/Б/В?»\n\n9. **Юрій робить**: вибирає.\n\n10. **Я кажу**: «**Фокус 5 — КУЛЬМІНАЦІЯ.** Завдання: у середині виступу зробити один емоційний пік. Навичка: динаміка. Без піку — все плоско. А/Б/В?»\n\n11. **Юрій робить**: вибирає.\n\n12. **Я кажу**: «**Фокус 6 — ТОН.** Завдання: усвідомлено змінювати тон (Воїн/Друг/Мудрець/Чарівник). Навичка: статус. Це фокус після того як освоєні drill'и ex-03-08. А/Б/В?»\n\n13. **Юрій робить**: вибирає.\n\n14. **Я кажу**: «**Фокус 7 — ТІЛО.** Завдання: прибрати зайві рухи, стояти стійко. Навичка: концентрація сенсу. Розщеплення тіла = розщеплення слухача. А/Б/В?»\n\n15. **Юрій робить**: вибирає.\n\n16. **Я кажу**: «**Фокус 8 — ОДИН ТЕЗІС.** Завдання: донести ОДНУ думку максимально чітко. Навичка: концентрація сенсу. Після виступу — людина може повторити одне твердження. А/Б/В?»\n\n17. **Юрій робить**: вибирає.\n\n18. **Я кажу**: «Тепер дивимось разом. У \"А\" актуальних — скільки? Якщо більше 3-х — нам треба пріоритизувати ще раз. Що ЗАРАЗ найкритичніше?»\n\n19. **Юрій робить**: пріоритизує до 2-3.\n\n20. **Я кажу**: «Ось план: спочатку тренуємо [Фокус 1]. Робиш ex-13 (5-хв виступ) з ним. Коли я бачу, що шкала самооцінки стабільно >7 з 10 — переходимо на [Фокус 2]. Це шлях на 2-4 тижні, не на день.»",
    "criteria": "- [ ] Юрій пройшов всі 8 фокусів, не пропустив\n- [ ] Юрій назвав конкретно А/Б/В для кожного\n- [ ] З \"А\" актуальних — обрав 2-3 пріоритети\n- [ ] План тренування реалістичний (ex-13 з 1-м фокусом, потім перехід)",
    "mistakes": "- ❌ **Юрій всі 8 каже \"актуальний\".** Це означає, що нічого не сфокусовано. Запитати: «Який КРИТИЧНІШИЙ — Паузи чи Контакт очима?»\n- ❌ **Юрій вибирає Структуру як фокус-в-моменті.** Денис прямо: структура не в моменті. Перенаправити: «Структуру готуй заздалегідь (ex-01 + ex-02). Як ФОКУС у моменті — інший вибір».\n- ❌ **Юрій вибирає Тон як фокус-в-моменті без drill'ів.** Тон без тренування ex-03-08 = провал. Спочатку drill, потім фокус-у-моменті.\n- ❌ **Юрій каже \"в мене все погано, треба все\".** Це панічна реакція, не пріоритизація. Заспокоїти: «Один за раз — як у спорті. Решта прийде».",

    "verbatim": "> \"Можливі фокуси уваги: 1 Фокус на паузах — говорити повільніше, ніж зазвичай, і робити паузи після ключових фраз. Навичка: управління тишею. 2 Фокус на диханні — не починати фразу без вдиху. Навичка: стійкість. 3 Фокус на контакті очима — утримувати погляд 3-5 секунд на одній людині. Навичка: впевненість. 4 Фокус на структурі — чітко означити початок, середину та кінець. Навичка: логіка. 5 Фокус на кульмінації — у середині виступу зробити один емоційний пік. Навичка: динаміка. 6 Фокус на тоні — усвідомлено змінювати тон (Воїн/Друг/Мудрець/Чарівник). Навичка: статус. 7 Фокус на тілі — прибрати зайві рухи, стояти стійко. Навичка: концентрація сенсу. 8 Фокус на одному тезісі — донести одну думку максимально чітко. Навичка: концентрація сенсу.\" — [slide 69]\n\n> \"На структурі. На структурі тяжко фокусуватися в моменті. Ця структура — це те, що треба готувати до, заблаговременно.\" — [video 03:58:33]"

            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }

          // Migrate from v0 (same PE-NN ids)
          const v0 = localStorage.getItem(LEGACY_KEY_V0);
          if (v0) {
            const parsed = JSON.parse(v0);
            const migrated = migrateFromV05(parsed);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
          return {};
        } catch (e) {
          console.warn("Failed to load state:", e);
          return {};
        }
      }

      function migrateFromV05(oldState) {
        // Old IDs were "l05-PE-01", new IDs are "l05-ex-01"
        // Use preliminaryId field on each exercise to map
        const out = {};
        const peToExId = {};
        EXERCISES.forEach((ex) => {
          if (ex.preliminaryId) {
            const oldId = `${ex.lesson}-${ex.preliminaryId}`;
            peToExId[oldId] = ex.id;
          }
        });
        Object.keys(oldState || {}).forEach((oldKey) => {
          // Old key like "l05-PE-01"
          const newKey = peToExId[oldKey];
          if (newKey) {
            out[newKey] = oldState[oldKey];
          }
        });
        return out;
      }

      let state = loadState();

        ids: [],
        startedAt: null,

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn("Failed to save state:", e);
        }
      }

      function getExerciseState(id) {
        if (!state[id]) {
          state[id] = {
            status: "todo",
            notes: "",
            transcript: "",
            rating: 0,
            date: null,
          };
        }
        return state[id];

      function updateExerciseState(id, patch) {
        const cur = getExerciseState(id);
        Object.assign(cur, patch, { date: new Date().toISOString() });

      // =====================================================================
      // SESSION GENERATION — 3 exercises a day
      // =====================================================================
      function dateSeedToday() {
        const d = new Date();
        return parseInt(
          `${d.getFullYear()}${(d.getMonth() + 1).toString().padStart(2, "0")}${d.getDate().toString().padStart(2, "0")}`,
          10,
        );
      }

      function seededShuffle(arr, seed) {
        const a = arr.slice();
        let s = seed;
        for (let i = a.length - 1; i > 0; i--) {
          s = (s * 1664525 + 1013904223) % 4294967296;
          const j = Math.abs(s) % (i + 1);
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function isUndone(id) {
        return getExerciseState(id).status !== "done";
      }

      function pickToday() {
        const seed = dateSeedToday();
        const undone = EXERCISES.filter((ex) => isUndone(ex.id));
        if (undone.length === 0) return [];

        // Bucket 1: warmup/breath (priority: short, kickoff)
        const warmupPool = undone.filter(
          (ex) => ex.type === "warmup" || ex.type === "breath",
        );

        // Bucket 2: core voice/structure/articulation/rhythm
        const corePool = undone.filter((ex) =>
          ["voice", "structure", "articulation", "rhythm"].includes(ex.type),
        );

        // Bucket 3: presence/other/reflection (closer)
        const closerPool = undone.filter(
          (ex) =>
            ex.type === "presence" ||
            ex.type === "other" ||
            ex.type === "reflection",
        );

        const picked = [];
        const usedIds = new Set();

        function pickOne(pool) {
          if (!pool.length) return null;
          const available = pool.filter((ex) => !usedIds.has(ex.id));
          if (!available.length) return null;
          const shuffled = seededShuffle(available, seed + picked.length);
          const chosen = shuffled[0];
          usedIds.add(chosen.id);
          return chosen;
        }

        // 1st: warmup/breath, fallback to shortest undone
        let p1 = pickOne(warmupPool);
        if (!p1) {
          const sortedByDur = undone
            .filter((ex) => !usedIds.has(ex.id))
            .slice()
            .sort((a, b) => {
              const da = typeof a.duration === "number" ? a.duration : 999;
              const db = typeof b.duration === "number" ? b.duration : 999;
              return da - db;
            });
          if (sortedByDur.length) {
            p1 = sortedByDur[0];
            usedIds.add(p1.id);
          }
        }
        if (p1) picked.push(p1);

        // 2nd: core skill
        let p2 = pickOne(corePool);
        if (!p2) {
          const fallback = seededShuffle(
            undone.filter((ex) => !usedIds.has(ex.id)),
            seed + 100,
          )[0];
          if (fallback) {
            p2 = fallback;
            usedIds.add(fallback.id);
          }
        }
        if (p2) picked.push(p2);

        // 3rd: presence/other/reflection
        let p3 = pickOne(closerPool);
        if (!p3) {
          const fallback = seededShuffle(
            undone.filter((ex) => !usedIds.has(ex.id)),
            seed + 200,
          )[0];
          if (fallback) {
            p3 = fallback;
            usedIds.add(fallback.id);
          }
        }
        if (p3) picked.push(p3);

        return picked.map((ex) => ex.id);
      }

      function pickRandomUndone() {
        const undone = EXERCISES.filter((ex) => isUndone(ex.id));
        if (!undone.length) return null;
        const i = Math.floor(Math.random() * undone.length);
        return undone[i];
      }

      // =====================================================================

      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function formatDuration(d) {
        if (d == null || d === "") return "—";
        if (typeof d === "number") return `${d} хв`;
        return String(d);
      }

      // Minimal markdown-to-HTML for instruction blocks.
      // Supports: ## H2 → h3, ### H3 → h4, **bold**, *italic*, > blockquote,
      // 1. numbered list (kept inline as <strong>N.</strong>), - bullet items.
      function renderMarkdownBlock(md) {
        if (!md) return "";
        const lines = String(md).split("\n");
        const out = [];
        let i = 0;
        let inBlockquote = false;
        while (i < lines.length) {
          const raw = lines[i];
          const line = raw;

          // Heading
          if (line.startsWith("### ")) {
            out.push(`<h4>${inlineMd(line.slice(4))}</h4>`);
            i++;
            continue;
          }
          if (line.startsWith("## ")) {
            out.push(`<h3>${inlineMd(line.slice(3))}</h3>`);
            i++;
            continue;
          }
          // Blockquote (gather consecutive)
          if (line.startsWith("> ") || line === ">") {
            const block = [];
            while (i < lines.length && (lines[i].startsWith("> ") || lines[i] === ">")) {
              block.push(lines[i].replace(/^> ?/, ""));
              i++;
            }
            out.push(`<blockquote>${inlineMd(block.join("\n"))}</blockquote>`);
            continue;
          }
          // Bullet list items keep as paragraphs with markers
          // Numbered list / paragraph
          out.push(inlineMd(line));
          i++;
        }
        return out.join("\n");
      }

      function inlineMd(text) {
        // Escape first
        let s = escapeHtml(text);
        // Bold **x**
        s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
        // Italic *x*
        s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
        return s;
      }

      function statusEmoji(s) {

      function progressStats() {

          if (st.status === "done") {

            byLesson[ex.lesson]++;
          } else if (st.status === "in_progress") inProg++;
        });
        return {
          done,
          inProg,
          total: EXERCISES.length,
          byLesson,
          totalByLesson,
        };

                </details>`
                : ""
            }

            <div class="focus-section-divider">Твоя робота</div>

            <label class="focus-field-label">Wispr транскрипт або текст виконання</label>
            <textarea
              class="focus-input transcript"
              data-field="transcript"
              placeholder="Встав сюди транскрипт з Wispr Flow або просто виконай вправу і опиши що сказав…"
            >${escapeHtml(st.transcript)}</textarea>

            <label class="focus-field-label">Нотатки / спостереження</label>
            <textarea
              class="focus-input notes"
              data-field="notes"
              placeholder="Що відчув, що складно, що вийшло, що повторити…"
            >${escapeHtml(st.notes)}</textarea>

            <div class="focus-rating-row">
              <span class="focus-field-label">Self-rating</span>
              <input type="range" class="rating-slider" data-field="rating" min="0" max="10" value="${st.rating}">
              <span class="rating-value" id="rating-display">${st.rating}/10</span>
            </div>

            <button class="focus-copy-btn" data-action="copy">📋 Скопіювати в чат до Claude</button>

            ${
              ex.verbatim
                ? `<details class="collapsible">
                  <summary>Verbatim quote з лекції</summary>
                  <div><div class="focus-verbatim">${escapeHtml(ex.verbatim)}</div></div>
                </details>`
                : ""
            }

            <div class="focus-controls">
              <button class="focus-control focus-control-primary" data-action="done">
                ✅ Виконано · далі
              </button>
              <button class="focus-control" data-action="later">
                🔄 Ще раз пізніше
              </button>
              <button class="focus-control" data-action="skip">
                ⏭ Пропустити
              </button>
            </div>

            <div class="focus-date-stamp">Last attempt: ${dateStr}</div>
          </div>
        `;

        root
          .querySelector("[data-action='back']")
          .addEventListener("click", () => navigate("#/home"));

        root.querySelectorAll("[data-field]").forEach((el) => {
          el.addEventListener("input", () => {
            const field = el.dataset.field;
            let val = el.value;
            if (field === "rating") {
              val = parseInt(val, 10);
              const display = document.getElementById("rating-display");
              if (display) display.textContent = val + "/10";
            }
            updateExerciseState(ex.id, { [field]: val });
          });
        });

        root
          .querySelector("[data-action='copy']")
          .addEventListener("click", () => copyPromptToChat(ex.id));

        root
          .querySelector("[data-action='done']")
          .addEventListener("click", () => {
            updateExerciseState(ex.id, { status: "done" });
            session.completedNow++;
            gotoNext(ex.id);
          });

        root
          .querySelector("[data-action='later']")
          .addEventListener("click", () => {
            updateExerciseState(ex.id, { status: "in_progress" });
            gotoNext(ex.id);
          });

        root
          .querySelector("[data-action='skip']")
          .addEventListener("click", () => {
            gotoNext(ex.id);
          });
      }

      function gotoNext(currentId) {
        const idx = session.ids.indexOf(currentId);
        if (idx === -1 || idx >= session.ids.length - 1) {
          window._sessionJustEnded = true;
          navigate("#/home");
          return;
        }
        const nextId = session.ids[idx + 1];
        navigate(`#/focus/${nextId}`);
      }

      // =====================================================================
      // SESSION END BANNER
      // =====================================================================
      function maybeShowSessionEndBanner(root) {
        if (window._sessionJustEnded) {
          const total = session.ids.length;
          const done = session.completedNow;
          const banner = document.createElement("div");
          banner.className = "session-end-banner";
          banner.innerHTML = `
            <h2>Сесію закінчено</h2>
            <p>Сьогодні ти виконав <strong>${done} з ${total}</strong> ${
              done === 1 ? "вправу" : "вправ"
            }${done > 0 ? " — респект." : "."}</p>
          `;
          const app = root.querySelector(".app");
          const firstSection = app.querySelector(".progress-block");
          app.insertBefore(banner, firstSection);
          window._sessionJustEnded = false;
        }
      }

      // =====================================================================
      // COPY TO CLAUDE
      // =====================================================================
      function copyPromptToChat(exerciseId) {
        const ex = EXERCISES.find((e) => e.id === exerciseId);
        const st = getExerciseState(exerciseId);

        const partnerLine =
          ex.needsPartner === true
            ? "Потрібен партнер: так\n"
            : "Потрібен партнер: ні\n";
        const recLine =
          ex.needsRecording === true
            ? "Потрібен запис: так\n"
            : "Потрібен запис: ні\n";

        const refsParts = [];
        if (ex.slideRef) refsParts.push(ex.slideRef);
        if (ex.transcriptRef) refsParts.push("transcript " + ex.transcriptRef);
        const refsStr = refsParts.join(" · ");

        const tpl = `Юрій виконав вправу «${ex.title}» з MCMM ораторського (${ex.lessonName}, ${ex.exId}).

Exercise ID: ${ex.id}
Lecturer: Денис Чернишов
${refsStr ? "Reference: " + refsStr + "\n" : ""}Type: ${ex.type} · ~${formatDuration(ex.duration)} · ${ex.difficulty}
${partnerLine}${recLine}
МЕТА:
${ex.meta || "(не вказано)"}

ПОВНА ІНСТРУКЦІЯ:
${ex.instruction || "(не вказано)"}

КРИТЕРІЇ ОЦІНЮВАННЯ:
${ex.criteria || "(не вказано)"}

ПОШИРЕНІ ПОМИЛКИ:
${ex.mistakes || "(не вказано)"}

ADAPTATIONS (text/голос/відео):
${ex.adaptations || "(не вказано)"}

VERBATIM QUOTE З ЛЕКЦІЇ:
${ex.verbatim || "(не вказано)"}

═══════════════════════════════════════
ТРАНСКРИПТ ВИКОНАННЯ (Wispr або текст):
${st.transcript || "(не вказано)"}

НОТАТКИ ЮРІЯ:
${st.notes || "(не вказано)"}

SELF-RATING: ${st.rating}/10
Дата спроби: ${st.date ? new Date(st.date).toLocaleString("uk-UA") : "(не вказано)"}

═══════════════════════════════════════
ДАЙ ФІДБЕК:
1) Що сильно (з прив'язкою до критеріїв)
2) Які з поширених помилок траплялись (якщо є — як виправити)
3) Якщо це voice/audio вправа — оцінка по pitch/tempo/pauses/tone з urlbar transcript
4) Наступна вправа з цього уроку (підкажи яка з ex-NN.md цього lesson_label)`;

        navigator.clipboard
          .writeText(tpl)
          .then(() => showToast("Скопійовано — встав у чат Claude"))
          .catch(() => {
            const ta = document.createElement("textarea");
            ta.value = tpl;
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              showToast("Скопійовано (fallback)");
            } catch (e) {
              alert("Не вдалося скопіювати. Промпт у console.");
              console.log(tpl);
            }
            document.body.removeChild(ta);
          });
      }

      // =====================================================================
      // EXPORT / IMPORT
      // =====================================================================
      function exportState() {
        const data = JSON.stringify(state, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `mcmm-oratorske-state-v1-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Експортовано JSON");
      }

      function importState(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (
              confirm(
                "Замінити поточний стан імпортованим? (поточні нотатки будуть втрачені)",
              )
            ) {
              state = imported;
              saveState();
              session.ids = [];
              render();
              showToast("Імпортовано успішно");
            }
          } catch (err) {
            alert("Помилка імпорту: " + err.message);
          }
        };
        reader.readAsText(file);
        event.target.value = "";
      }

      // =====================================================================
      // MAIN RENDER
      // =====================================================================
      function render() {
        const route = getRoute();
        switch (route.name) {
          case "home":
            renderHome();
            maybeShowSessionEndBanner(document.getElementById("root"));
            break;
          case "all":
            renderAll();
            break;
          case "focus":
            if (route.arg) renderFocus(route.arg);
            else navigate("#/home");
            break;
          default:
            navigate("#/home");
        }
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      // =====================================================================
      // INIT
      // =====================================================================
      if (!window.location.hash) {
        window.location.hash = "#/home";
      } else {
        render();
      }
      render();
    </script>
  </body>
</html>
